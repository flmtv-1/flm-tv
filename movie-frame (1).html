<!DOCTYPE html>
<!-- saved from url=(0070)https://flmtv.com/movie-frame.html?id=0b30a58fd5019e61d741097dfc9e628a -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLM TV</title>
  <style>
    :root { --hdr: 50px; --gold: #ffd700; --green: #22c55e; --red: #dc2626; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; overflow: hidden; }

    #flmBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--hdr);
      background: rgba(0,0,0,0.92);
      border-bottom: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      z-index: 99999;
    }

    .flm-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-vault {
      background: var(--green);
      color: #fff;
    }
    .btn-vault:hover { background: #16a34a; }

    .btn-front {
      background: var(--gold);
      color: #000;
    }

    .btn-front:hover { background: #ffe84d; }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-flag {
      display: flex;
      flex-direction: column;
      width: 14px;
      height: 20px;
      gap: 2px;
    }

    .logo-flag span {
      flex: 1;
      border-radius: 1px;
    }

    .logo-flag span:nth-child(1) { background: #0038a8; }
    .logo-flag span:nth-child(2) { background: var(--red); }
    .logo-flag span:nth-child(3) { background: var(--gold); }

    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .logo-text .flm { color: var(--gold); }
    .logo-text .tv  { color: var(--green); }

    .bar-spacer { flex: 1; }

    #jellyfinFrame {
      position: fixed;
      top: var(--hdr);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - var(--hdr));
      border: none;
      background: #000;
    }

    @media (max-width: 768px) {
      .flm-btn { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
      .logo-text { font-size: 14px; }

      /* On mobile: keep top bar */
    }


  </style>
</head>
<body>

<div id="flmBar">
  <a class="flm-btn btn-front" href="#" onclick="history.back(); return false;" id="backBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Back
  </a>
  <a class="flm-btn btn-front" href="home.html" id="homeBtn">🏠 Home</a>
  <div class="logo-wrap">
    <div class="logo-flag"><span></span><span></span><span></span></div>
    <div class="logo-text"><span class="flm">FLM</span> <span class="tv">TV</span></div>
  </div>
  <div class="bar-spacer"></div>
  <a class="flm-btn btn-vault" href="#" onclick="document.getElementById('jellyfinFrame').src='https://flmtv26.duckdns.org:8920/web/index.html?api_key=62131ee22c0141c6b651be75a7444350#/home'; return false;">
    🎬 The Vault
  </a>
</div>

<iframe id="jellyfinFrame" allowfullscreen="" allow="autoplay; fullscreen; picture-in-picture" title="FLM TV"></iframe>



<script>
const CONFIG = {
  SERVER:    'https://flmtv26.duckdns.org:8920',
  API_KEY:   '62131ee22c0141c6b651be75a7444350',
  USER_ID:   '2562494c1df24f8789cd0ad8a38a7bf4',
  SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
};

const params   = new URLSearchParams(location.search);
const ITEM_ID  = params.get('id') || '';

// Home button always goes home
document.getElementById('homeBtn').href = 'home.html';

// Step 1: Pre-authenticate so Jellyfin never shows login screen
// Step 2: Load iframe directly to movie detail page
async function loadFrame() {
  if (!ITEM_ID) return;

  // Pre-auth — write session to localStorage before iframe loads
  try {
    const resp = await fetch(CONFIG.SERVER + '/Users/AuthenticateByName', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': 'MediaBrowser Client="FLM TV", Device="Web Browser", DeviceId="flmtv-movieframe", Version="1.0.0"'
      },
      body: JSON.stringify({ Username: 'ENTER FLM', Pw: '' })
    });
    if (resp.ok) {
      const data = await resp.json();
      localStorage.setItem('jellyfin_credentials', JSON.stringify({
        Servers: [{
          Id: CONFIG.SERVER_ID,
          Url: CONFIG.SERVER,
          AccessToken: data.AccessToken,
          UserId: data.User.Id,
          DateLastAccessed: Date.now(),
          LastConnectionMode: 2,
          manualAddressOnly: true
        }]
      }));
    }
  } catch(e) {
    console.warn('Pre-auth failed:', e);
  }

  // Load iframe directly to movie detail page
  const url = CONFIG.SERVER + '/web/index.html' +
    '?api_key=' + CONFIG.API_KEY +
    '&userId=' + CONFIG.USER_ID +
    '#/details?id=' + ITEM_ID +
    '&serverId=' + CONFIG.SERVER_ID;
  document.getElementById('jellyfinFrame').src = url;
}

// After iframe loads, keep pushing to correct detail page
// (Jellyfin sometimes redirects to home after init)
function navigateToItem() {
  if (!ITEM_ID) return;
  const frame = document.getElementById('jellyfinFrame');
  try {
    const win = frame.contentWindow;
    if (win && win.location && !win.location.hash.includes(ITEM_ID)) {
      win.location.hash = '/details?id=' + ITEM_ID + '&serverId=' + CONFIG.SERVER_ID;
    }
  } catch(e) {}
}

loadFrame();

// Inject CSS into iframe to hide Jellyfin's header bars
function injectFrameCSS() {
  const frame = document.getElementById('jellyfinFrame');
  try {
    const doc = frame.contentDocument || frame.contentWindow.document;
    if (doc && doc.head) {
      const style = doc.getElementById('flm-hide-header');
      if (!style) {
        const s = doc.createElement('style');
        s.id = 'flm-hide-header';
        s.textContent = `
          .skinHeader, .headerTop, .mainHeader,
          .skinHeader-withBackground, .sectionTitleContainer,
          header.skinHeader { 
            display: none !important; 
          }
          .scrollY { 
            top: 0 !important; 
          }
          .backdropContainer { 
            top: 0 !important; 
          }
        `;
        doc.head.appendChild(s);
      }
    }
  } catch(e) {}
}

// After iframe loads — inject CSS and keep navigating to correct movie
document.getElementById('jellyfinFrame').addEventListener('load', function() {
  setTimeout(injectFrameCSS, 500);
  setTimeout(injectFrameCSS, 1500);
  setTimeout(injectFrameCSS, 3000);
  setTimeout(navigateToItem, 1200);
  setTimeout(navigateToItem, 2500);
  setTimeout(navigateToItem, 4000);
});
setInterval(injectFrameCSS, 2000);

// ── Hide FLM bar when fullscreen; restore on exit ──────────────────
const flmBar = document.getElementById('flmBar');
const frame  = document.getElementById('jellyfinFrame');

function onFullscreenChange() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) {
    flmBar.style.transition    = 'opacity 0.3s';
    flmBar.style.opacity       = '0';
    flmBar.style.pointerEvents = 'none';
    frame.style.top            = '0';
    frame.style.height         = '100%';
  } else {
    flmBar.style.opacity       = '1';
    flmBar.style.pointerEvents = '';
    frame.style.top            = '';
    frame.style.height         = '';
  }
}

document.addEventListener('fullscreenchange',       onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
</script>


<script>
// Firestick detection - shrink bar so it doesn't cover cards
(function() {
    var ua = navigator.userAgent || '';
    var isFirestick = /AFT|FireTV|Silk/i.test(ua);
    var isTV = (window.screen.width >= 1280 && window.screen.height >= 600 && window.screen.width <= 1920);
    if (isFirestick || isTV) {
        document.body.style.zoom = '0.7';
        var bar = document.getElementById('flmBar');
        if (bar) {
            bar.style.height = '36px';
            bar.style.padding = '0 0.5rem';
            bar.style.fontSize = '0.75rem';
        }
        // Make all buttons in bar focusable and visible
        var btns = document.querySelectorAll('.flm-btn');
        btns.forEach(function(b) {
            b.style.padding = '0.25rem 0.6rem';
            b.style.fontSize = '0.75rem';
        });
        // Update iframe position
        var frame = document.getElementById('jellyfinFrame');
        if (frame) {
            frame.style.top = '36px';
            frame.style.height = 'calc(100% - 36px)';
        }
        // Focus glow for remote nav
        var style = document.createElement('style');
        style.textContent = 'a:focus,button:focus{outline:3px solid #22c55e !important;box-shadow:0 0 15px rgba(34,197,94,0.8) !important;}';
        document.head.appendChild(style);
    }
})();
</script>
</body></html>
