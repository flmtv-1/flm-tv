<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - FLM TV</title>
    <style>
        :root {
            --primary: #ffd700;
            --secondary: #22c55e;
            --bg: #0a0f1a;
            --bg-light: #1a1f2e;
            --text: #ffffff;
            --text-secondary: #94a3b8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--primary);
            color: #000;
        }
        
        .header {
            background: var(--bg-light);
            padding: 6rem 2rem 2rem;
            border-bottom: 3px solid var(--primary);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .collections-title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .collections-count {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }
        
        .collection-card {
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .collection-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }
        
        .collection-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #1a1a1a;
        }
        
        .collection-info {
            padding: 1rem;
        }
        
        .collection-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .collection-year {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .collections-title { font-size: 2rem; }
            .collections-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='home.html'">← Back</button>

<div class="header">
    <div class="header-content">
        <h1 class="collections-title">Collections</h1>
        <div class="collections-count" id="collectionsCount">31 collections</div>
    </div>
</div>

<div class="content">
    <div class="collections-grid" id="collectionsGrid"></div>
</div>

<script>

    { id: 'e0b04e86496d5116c7c870ca9fdd4918', name: 'Ace Ventura Collection', year: '1994' },

    { id: 'e0ef9c2ef48794cf90330e5a8e671998', name: 'Avatar Collection', year: '2009' },
    { id: '0cebe383a89ff4f9aafaa644f1197d53', name: 'AVP Collection', year: '2004' },
    { id: '5cadb319bc8b9dca78b5c9e0561c767a', name: 'Beverly Hills Cop Collection', year: '1984' },
    { id: '2fef462b031294deb4cfb4ac9d5f28bf', name: 'Braveheart Collection', year: '1995' },
    { id: '4bd36104361cd55997fde09a5be613f7', name: 'Carry On Collection', year: '1958' },
    { id: '21f507e7a9155de1c777026f80278a81', name: 'Charlie Chan Collection', year: '1931' },
    { id: '6a6e77f259ec1fe04faddf4c464d1554', name: 'Die Hard Collection', year: '1988' },
    { id: 'ffea8ec538e4c51f3ee2459583484c5c', name: 'Dirty Harry Collection', year: '1971' },

];

const SERVER = 'https://flmtv26.duckdns.org:8920';
const API_KEY = '62131ee22c0141c6b651be75a7444350';

const grid = document.getElementById('collectionsGrid');

COLLECTIONS.forEach(collection => {
    const card = document.createElement('div');
    card.className = 'collection-card';
    card.onclick = () => {
        window.location.href = `collection-detail.html?id=${collection.id}&name=${encodeURIComponent(collection.name)}`;
    };
    
    // Try to fetch poster from Jellyfin
    const posterUrl = `${SERVER}/Items/${collection.id}/Images/Primary?api_key=${API_KEY}&maxWidth=400`;
    
    card.innerHTML = `
        <img src="${posterUrl}" 
             alt="${collection.name}" 
             class="collection-poster" 
             loading="lazy" 
             onerror="this.style.background='#1a1a1a'">
        <div class="collection-info">
            <div class="collection-name">${collection.name}</div>
            ${collection.year ? `<div class="collection-year">${collection.year}</div>` : ''}
        </div>
    `;
    
    grid.appendChild(card);
});

document.getElementById('collectionsCount').textContent = `${COLLECTIONS.length} collections`;
</script>

</body>
</html>
