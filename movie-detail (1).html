<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Movie - FLM TV</title>
    <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .watch-container {
            max-width: 600px;
            width: 100%;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 1rem;
        }
        
        .movie-info {
            margin-bottom: 2rem;
        }
        
        .movie-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        .watch-btn {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #22c55e 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .watch-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }
        
        .watch-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .watch-btn i {
            font-size: 1.8rem;
        }
        
        .back-btn {
            margin-top: 1.5rem;
            padding: 1rem;
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            border-color: #ffd700;
            color: #ffd700;
        }
        
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        
        .status.loading {
            display: block;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,215,0,0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .watch-container {
                padding: 2rem;
            }
            
            .movie-title {
                font-size: 1.5rem;
            }
            
            .watch-btn {
                padding: 1.2rem;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="watch-container">
        <div class="logo">FLM TV</div>
        
        <div class="movie-info">
            <div class="movie-title" id="movieTitle">Ready to Watch</div>
            <p class="subtitle">Click the button below to start watching</p>
        </div>
        
        <button class="watch-btn" id="watchBtn">
            <i class="fas fa-play-circle"></i>
            Watch Now
        </button>
        
        <button class="back-btn" onclick="window.location.href='home.html'">
            <i class="fas fa-arrow-left"></i> Back to Home
        </button>
        
        <div class="status" id="status">
            <div class="spinner"></div> Preparing video...
        </div>
    </div>

    <script>
        const JELLYFIN = {
            SERVER: 'https://flmtv26.duckdns.org:8920',
            API_KEY: '62131ee22c0141c6b651be75a7444350',
            USER_ID: '0407d4609a0346f99c09e0d7ddc9ccd1',
            SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
        };

        // Get movie ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        
        const watchBtn = document.getElementById('watchBtn');
        const statusDiv = document.getElementById('status');

        if (!movieId) {
            document.getElementById('movieTitle').textContent = 'Error: No movie found';
            document.querySelector('.subtitle').textContent = 'Please return to home and try again';
            watchBtn.disabled = true;
        }

        // Watch button click handler
        watchBtn.addEventListener('click', async function() {
            watchBtn.disabled = true;
            statusDiv.className = 'status loading';
            statusDiv.style.display = 'block';
            
            try {
                // Authenticate as Public user
                const authResponse = await fetch(`${JELLYFIN.SERVER}/Users/AuthenticateByName`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Emby-Authorization': `MediaBrowser Client="FLM TV", Device="Web", DeviceId="flmtv-web-${Date.now()}", Version="1.0.0"`
                    },
                    body: JSON.stringify({
                        Username: 'Public',
                        Pw: ''
                    })
                });

                if (authResponse.ok) {
                    const authData = await authResponse.json();
                    
                    // Store credentials in localStorage
                    localStorage.setItem('jellyfin_credentials', JSON.stringify({
                        Servers: [{
                            AccessToken: authData.AccessToken,
                            UserId: authData.User.Id,
                            Id: authData.ServerId || JELLYFIN.SERVER_ID,
                            ManualAddress: JELLYFIN.SERVER,
                            LastConnectionMode: 2,
                            Name: 'FLM TV Server',
                            DateLastAccessed: Date.now()
                        }]
                    }));

                    console.log('✅ Authenticated, opening Jellyfin...');
                    
                    // Redirect to Jellyfin detail page
                    window.location.href = `${JELLYFIN.SERVER}/web/#!/details?id=${movieId}&serverId=${JELLYFIN.SERVER_ID}`;
                    
                } else {
                    throw new Error('Authentication failed');
                }
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '❌ Error loading movie. Please try again.';
                statusDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                statusDiv.style.color = '#ef4444';
                watchBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
