<!DOCTYPE html>
<!-- FLM TV movie-frame.html · VERSION 2026-10-21 · backup player route (search "VERSION" with Ctrl+U) -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLM TV</title>
  <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
  <style>
    :root { --hdr: 50px; --gold: #ffd700; --green: #22c55e; --red: #dc2626; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; overflow: hidden; }

    #flmBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--hdr);
      background: rgba(0,0,0,0.92);
      border-bottom: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      z-index: 99999;
    }

    .flm-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-vault {
      background: var(--green);
      color: #fff;
    }
    .btn-vault:hover { background: #16a34a; }

    .btn-front {
      background: var(--gold);
      color: #000;
    }

    .btn-front:hover { background: #ffe84d; }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-flag {
      display: flex;
      flex-direction: column;
      width: 14px;
      height: 20px;
      gap: 2px;
    }

    .logo-flag span {
      flex: 1;
      border-radius: 1px;
    }

    .logo-flag span:nth-child(1) { background: #0038a8; }
    .logo-flag span:nth-child(2) { background: var(--red); }
    .logo-flag span:nth-child(3) { background: var(--gold); }

    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .logo-text .flm { color: var(--gold); }
    .logo-text .tv  { color: var(--green); }

    .bar-spacer { flex: 1; }

    #jellyfinFrame {
      position: fixed;
      top: var(--hdr);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - var(--hdr));
      border: none;
      background: #000;
    }

    @media (max-width: 768px) {
      .flm-btn { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
      .logo-text { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="flmBar">
  <a class="flm-btn btn-front" href="#" onclick="history.back(); return false;" id="backBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Back
  </a>
  <a class="flm-btn btn-front" href="home.html" id="homeBtn">🏠 Home</a>
  <div class="logo-wrap">
    <div class="logo-flag"><span></span><span></span><span></span></div>
    <div class="logo-text"><span class="flm">FLM</span> <span class="tv">TV</span></div>
  </div>
  <div class="bar-spacer"></div>
  <a class="flm-btn btn-vault" href="#" onclick="openVault(); return false;">
    🎬 The Vault
  </a>
</div>

<iframe id="jellyfinFrame" allowfullscreen="" allow="autoplay; fullscreen; picture-in-picture" title="FLM TV"></iframe>

<script>
// The Vault opens Jellyfin's real native interface — account settings,
// avatar, everything live there. It must NEVER run as the shared
// ENTER FLM account, since that's a public login anyone can use.
// Only a real, signed-up member's own token is allowed in.
function openVault() {
  const memberEmail = localStorage.getItem('flmtv_member_email');
  let session = null;
  try {
    const creds = JSON.parse(localStorage.getItem('jellyfin_credentials') || 'null');
    const server = creds && creds.Servers && creds.Servers[0];
    if (server && server.UserId && server.AccessToken) session = server;
  } catch (e) {}

  if (!memberEmail || !session) {
    if (confirm('Sign up free on Home to unlock The Vault with your own account. Go there now?')) {
      window.location.href = 'home.html';
    }
    return;
  }

  document.getElementById('jellyfinFrame').src =
    CONFIG.SERVER + '/web/index.html?flmuid=' + encodeURIComponent(session.UserId) +
    '&flmtok=' + encodeURIComponent(session.AccessToken) + '#/home';
}

const CONFIG = {
  SERVER:    'https://flmtv26.duckdns.org:8920',
  API_KEY:   '62131ee22c0141c6b651be75a7444350',
  SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
};

// BACKUP ROUTE: the player normally loads straight from Computer 2 on
// port 8920. If 8920 doesn't answer (expired certificate, blocked port,
// router change), the page switches to the flmtv.com/jellyfin route,
// which goes through Netlify, so shows keep playing.
// When 8920 works again, nothing changes: it is always tried first.
const MAIN_SERVER   = 'https://flmtv26.duckdns.org:8920';
const BACKUP_SERVER = 'https://flmtv.com/jellyfin';

function pickServer() {
  return new Promise(function(resolve) {
    let done = false;
    const finish = function(server) { if (!done) { done = true; resolve(server); } };
    setTimeout(function() { finish(BACKUP_SERVER); }, 4000);
    fetch(MAIN_SERVER + '/System/Info/Public', { cache: 'no-store' })
      .then(function(r) { finish(r.ok ? MAIN_SERVER : BACKUP_SERVER); })
      .catch(function() { finish(BACKUP_SERVER); });
  });
}

const params   = new URLSearchParams(location.search);
const ITEM_ID  = params.get('id') || '';
const CAT_ID   = params.get('catId') || '';
const CAT_NAME = decodeURIComponent(params.get('catName') || '');

// Home button always goes home
document.getElementById('homeBtn').href = 'home.html';

function openDetails() {
  document.getElementById('jellyfinFrame').src =
    CONFIG.SERVER + '/web/index.html#!/details?id=' + ITEM_ID +
    '&serverId=' + CONFIG.SERVER_ID +
    '&api_key=' + CONFIG.API_KEY;
}

pickServer().then(function(server) {
  CONFIG.SERVER = server;
  if (server !== MAIN_SERVER) console.warn('FLM TV: port 8920 not answering, using backup route', server);
  if (!ITEM_ID) return;
  // If this is a Book, the Jellyfin reader cannot run inside an iframe.
  // Redirect the whole window directly to Jellyfin so the reader works.
  fetch(CONFIG.SERVER + '/Users/2562494c1df24f8789cd0ad8a38a7bf4/Items/' + ITEM_ID + '?api_key=' + CONFIG.API_KEY)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.Type === 'Book') {
        window.location.href = CONFIG.SERVER + '/web/index.html?api_key=' + CONFIG.API_KEY + '#/details?id=' + ITEM_ID + '&serverId=' + CONFIG.SERVER_ID;
      } else {
        openDetails();
      }
    })
    .catch(openDetails);
});
</script>


</body></html>
