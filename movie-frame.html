    body { background: #000; overflow: hidden; }

    #flmBar {

      padding: 0 1rem;

    }

    .flm-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-vault {
      background: var(--green);
      color: #fff;
    }
    .btn-vault:hover { background: #16a34a; }

    .btn-front {
      background: var(--gold);
      color: #000;
    }

    .btn-front:hover { background: #ffe84d; }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-flag {
      display: flex;
      flex-direction: column;
      width: 14px;
      height: 20px;
      gap: 2px;
    }

    .logo-flag span {
      flex: 1;
      border-radius: 1px;
    }

    .logo-flag span:nth-child(1) { background: #0038a8; }
    .logo-flag span:nth-child(2) { background: var(--red); }
    .logo-flag span:nth-child(3) { background: var(--gold); }

    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .logo-text .flm { color: var(--gold); }
    .logo-text .tv  { color: var(--green); }

    .bar-spacer { flex: 1; }

    #jellyfinFrame {
      position: fixed;
      top: var(--hdr);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - var(--hdr));
      border: none;
      background: #000;
    }

    @media (max-width: 768px) {
      .flm-btn { 
        padding: 0.2rem 0.45rem; 
        font-size: 0.68rem; 
        gap: 0.15rem;
        border-radius: 4px;
        white-space: nowrap;

      .logo-text { font-size: 11px; letter-spacing: 0.5px; }
      .logo-flag { width: 10px; height: 14px; }

      #flmBar {
        height: 38px;

        top: 0 !important;
        bottom: auto !important;
      }
      #jellyfinFrame {
        top: 38px !important;
        height: calc(100% - 38px - 60px) !important;
        bottom: 60px !important;
      }
    }



    /* Bottom Nav - mobile only */
    #flmBottomNav {
      display: none;
    }
    @media (max-width: 768px) {
      #flmBottomNav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 78px;
        background: #111;
        border-top: 3px solid #ffd700;
        z-index: 2147483647;
        align-items: flex-end;
        justify-content: space-around;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
        padding-top: 10px;

      .fnav-item {

      .fnav-item:active { color: #ffd700; transform: scale(0.95); }

      /* Shrink iframe so it never sits under the bottom nav */
      #jellyfinFrame {
        bottom: 78px !important;
        height: calc(100% - 38px - 78px) !important;
      }
    }

🎬 The Vault</a>

<iframe id="jellyfinFrame" allowfullscreen="" allow="autoplay; fullscreen; picture-in-picture" title="FLM TV"></iframe>



<script>
const CONFIG = {
  SERVER:    'https://flmtv26.duckdns.org:8920',
  API_KEY:   '62131ee22c0141c6b651be75a7444350',
  USER_ID:   '2562494c1df24f8789cd0ad8a38a7bf4',
  SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
};

const params   = new URLSearchParams(location.search);
const ITEM_ID  = params.get('id') || '';

// Home button always goes home
document.getElementById('homeBtn').href = 'home.html';

// Step 1: Pre-authenticate so Jellyfin never shows login screen
// Step 2: Load iframe directly to movie detail page
async function loadFrame() {
  if (!ITEM_ID) return;

  // Pre-auth — write session to localStorage before iframe loads
  try {
    const resp = await fetch(CONFIG.SERVER + '/Users/AuthenticateByName', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': 'MediaBrowser Client="FLM TV", Device="Web Browser", DeviceId="flmtv-movieframe", Version="1.0.0"'
      },
      body: JSON.stringify({ Username: 'ENTER FLM', Pw: '' })
    });
    if (resp.ok) {
      const data = await resp.json();
      localStorage.setItem('jellyfin_credentials', JSON.stringify({
        Servers: [{
          Id: CONFIG.SERVER_ID,
          Url: CONFIG.SERVER,
          AccessToken: data.AccessToken,
          UserId: data.User.Id,
          DateLastAccessed: Date.now(),
          LastConnectionMode: 2,
          manualAddressOnly: true
        }]
      }));
    }
  } catch(e) {
    console.warn('Pre-auth failed:', e);
  }

  // Load iframe directly to movie detail page
  const url = CONFIG.SERVER + '/web/index.html' +
    '?api_key=' + CONFIG.API_KEY +
    '&userId=' + CONFIG.USER_ID +
    '#/details?id=' + ITEM_ID +
    '&serverId=' + CONFIG.SERVER_ID;
  document.getElementById('jellyfinFrame').src = url;
}

// After iframe loads, keep pushing to correct detail page
// (Jellyfin sometimes redirects to home after init)
function navigateToItem() {
  if (!ITEM_ID) return;
  const frame = document.getElementById('jellyfinFrame');
  try {
    const win = frame.contentWindow;
    if (win && win.location && !win.location.hash.includes(ITEM_ID)) {
      win.location.hash = '/details?id=' + ITEM_ID + '&serverId=' + CONFIG.SERVER_ID;
    }
  } catch(e) {}
}

loadFrame();

// Inject CSS into iframe to hide Jellyfin's header bars
function injectFrameCSS() {
  const frame = document.getElementById('jellyfinFrame');
  try {
    const doc = frame.contentDocument || frame.contentWindow.document;
    if (doc && doc.head) {
      const style = doc.getElementById('flm-hide-header');
      if (!style) {
        const s = doc.createElement('style');
        s.id = 'flm-hide-header';
        s.textContent = `
          .skinHeader, .headerTop, .mainHeader,
          .skinHeader-withBackground, .sectionTitleContainer,
          header.skinHeader { 
            display: none !important; 
          }
          .scrollY { 
            top: 0 !important; 
          }
          .backdropContainer { 
            top: 0 !important; 
          }
        `;
        doc.head.appendChild(s);
      }
    }
  } catch(e) {}
}

// After iframe loads — inject CSS and keep navigating to correct movie
document.getElementById('jellyfinFrame').addEventListener('load', function() {
  setTimeout(injectFrameCSS, 500);
  setTimeout(injectFrameCSS, 1500);
  setTimeout(injectFrameCSS, 3000);
  setTimeout(navigateToItem, 1200);
  setTimeout(navigateToItem, 2500);
  setTimeout(navigateToItem, 4000);
});
setInterval(injectFrameCSS, 2000);

// ── Hide FLM bar when fullscreen; restore on exit ──────────────────
const flmBar = document.getElementById('flmBar');
const frame  = document.getElementById('jellyfinFrame');

function onFullscreenChange() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) {
    flmBar.style.transition    = 'opacity 0.3s';
    flmBar.style.opacity       = '0';
    flmBar.style.pointerEvents = 'none';
    frame.style.top            = '0';
    frame.style.height         = '100%';
  } else {
    flmBar.style.opacity       = '1';
    flmBar.style.pointerEvents = '';
    frame.style.top            = '';
    frame.style.height         = '';
  }
}

document.addEventListener('fullscreenchange',       onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
</script>


<script>
// FLM TV: Firestick D-pad navigation for movie-frame top bar
(function() {
    var ua = navigator.userAgent || '';
    if (!/AFT|FireTV|Silk/i.test(ua)) return;

    // Fix viewport for Firestick 960px — NO zoom
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute('content', 'width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');

    // Shrink bar to fit 960px without zoom
    var bar = document.getElementById('flmBar');
    if (bar) {
        bar.style.height = '42px';
        bar.style.padding = '0 0.6rem';
        bar.style.gap = '0.5rem';
    }
    document.querySelectorAll('.flm-btn').forEach(function(b) {
        b.setAttribute('tabindex', '0');
        // Don't override padding on avatar/circular buttons
        if (b.style.borderRadius !== '50%') {
            b.style.padding = '0.3rem 0.8rem';
            b.style.fontSize = '0.8rem';
        }
    });

    // Focus styles
    var style = document.createElement('style');
    style.textContent = `
        .flm-btn:focus {
            outline: 3px solid #ffd700 !important;
            box-shadow: 0 0 15px rgba(255,215,0,0.7) !important;
            transform: scale(1.05);
        }
        #flmBar { background: rgba(0,0,0,0.97) !important; }
    `;
    document.head.appendChild(style);

    // Top bar buttons in order
    var barBtns = ['backBtn', 'homeBtn'];
    var vaultBtn = document.querySelector('#flmBar a.btn-vault');
    if (vaultBtn) { vaultBtn.setAttribute('tabindex','0'); barBtns.push(vaultBtn.id || 'vaultBtn'); if (!vaultBtn.id) vaultBtn.id = 'vaultBtn'; }

    var barIdx = 0;
    var inBar = false;

    function focusBarBtn(i) {
        barIdx = Math.max(0, Math.min(barBtns.length - 1, i));
        var el = document.getElementById(barBtns[barIdx]);
        if (el) { el.focus(); inBar = true; }
    }

    document.addEventListener('keydown', function(e) {
        // Backspace always goes back
        if (e.key === 'Backspace' || e.key === 'Escape') {
            e.preventDefault();
            history.back();
            return;
        }

        // ArrowUp always brings focus to bar
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            focusBarBtn(barIdx);
            return;
        }

        // If focused on bar buttons
        if (inBar) {
            if (e.key === 'ArrowRight') { e.preventDefault(); focusBarBtn(barIdx + 1); return; }
            if (e.key === 'ArrowLeft')  { e.preventDefault(); focusBarBtn(barIdx - 1); return; }
            if (e.key === 'ArrowDown')  {
                e.preventDefault();
                inBar = false;
                // Pass focus into iframe
                var frame = document.getElementById('jellyfinFrame');
                if (frame && frame.contentWindow) {
                    try { frame.contentWindow.focus(); } catch(e) {}
                }
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                var el = document.getElementById(barBtns[barIdx]);
                if (el) el.click();
                return;
            }
        }
    }, true);

    // Focus first bar button on load
    window.addEventListener('load', function() {
        setTimeout(function() { focusBarBtn(0); }, 500);
    });
})();
</script>
