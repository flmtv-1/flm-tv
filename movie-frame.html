<!DOCTYPE html>
<!-- saved from url=(0070)https://flmtv.com/movie-frame.html?id=0b30a58fd5019e61d741097dfc9e628a -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLM TV</title>
  <style>
    :root { --hdr: 50px; --gold: #ffd700; --green: #22c55e; --red: #dc2626; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; overflow: hidden; }

    #flmBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--hdr);
      background: rgba(0,0,0,0.92);
      border-bottom: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      z-index: 99999;
    }

    .flm-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-vault {
      background: var(--green);
      color: #fff;
    }
    .btn-vault:hover { background: #16a34a; }

    .btn-front {
      background: var(--gold);
      color: #000;
    }

    .btn-front:hover { background: #ffe84d; }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-flag {
      display: flex;
      flex-direction: column;
      width: 14px;
      height: 20px;
      gap: 2px;
    }

    .logo-flag span {
      flex: 1;
      border-radius: 1px;
    }

    .logo-flag span:nth-child(1) { background: #0038a8; }
    .logo-flag span:nth-child(2) { background: var(--red); }
    .logo-flag span:nth-child(3) { background: var(--gold); }

    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .logo-text .flm { color: var(--gold); }
    .logo-text .tv  { color: var(--green); }

    .bar-spacer { flex: 1; }

    #jellyfinFrame {
      position: fixed;
      top: var(--hdr);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - var(--hdr));
      border: none;
      background: #000;
    }

    @media (max-width: 768px) {
      .flm-btn { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
      .logo-text { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="flmBar">
  <a class="flm-btn btn-front" href="#" onclick="history.back(); return false;" id="backBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Back
  </a>
  <a class="flm-btn btn-front" href="home.html" id="homeBtn">🏠 Home</a>
  <div class="logo-wrap">
    <div class="logo-flag"><span></span><span></span><span></span></div>
    <div class="logo-text"><span class="flm">FLM</span> <span class="tv">TV</span></div>
  </div>
  <div class="bar-spacer"></div>
  <a class="flm-btn btn-vault" href="#" onclick="document.getElementById('jellyfinFrame').src='https://flmtv26.duckdns.org:8920/web/index.html?api_key=62131ee22c0141c6b651be75a7444350#/home'; return false;">
    🎬 The Vault
  </a>
</div>

<iframe id="jellyfinFrame" allowfullscreen="" allow="autoplay; fullscreen; picture-in-picture" title="FLM TV"></iframe>

<script>
const CONFIG = {
  SERVER:    'https://flmtv26.duckdns.org:8920',
  API_KEY:   '62131ee22c0141c6b651be75a7444350',
  SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
};

const params   = new URLSearchParams(location.search);
const ITEM_ID  = params.get('id') || '';
const CAT_ID   = params.get('catId') || '';
const CAT_NAME = decodeURIComponent(params.get('catName') || '');

// Home button always goes home
document.getElementById('homeBtn').href = 'home.html';

// Auto-login to Jellyfin as Public user before loading the frame
async function autoLoginAndLoad() {
  try {
    const authResponse = await fetch(CONFIG.SERVER + '/Users/AuthenticateByName', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': 'MediaBrowser Client="FLM TV", Device="Browser", DeviceId="flmtv-web", Version="1.0"'
      },
      body: JSON.stringify({ Username: 'ENTER FLM', Pw: '' })
    });

    if (authResponse.ok) {
      const authData = await authResponse.json();
      const credentials = {
        Servers: [{
          Id: CONFIG.SERVER_ID,
          Name: 'FLM TV',
          Url: CONFIG.SERVER,
          UserId: authData.User.Id,
          AccessToken: authData.AccessToken,
          DateLastAccessed: new Date().getTime()
        }]
      };
      localStorage.setItem('jellyfin_credentials', JSON.stringify(credentials));
      console.log('✅ Auto-logged in as Public user');
    }
  } catch(e) {
    console.log('Auto-login attempt:', e);
  }

  if (ITEM_ID) {
    document.getElementById('jellyfinFrame').src =
      CONFIG.SERVER + '/web/index.html?api_key=' + CONFIG.API_KEY +
      '#/details?id=' + ITEM_ID +
      '&serverId=' + CONFIG.SERVER_ID;
  }
}

autoLoginAndLoad();
</script>


</body></html>
