<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLM TV</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:  #FFD700;
    --green: #00A550;
    --red:   #CE1126;
    --blue:  #0038A8;
    --hdr:   48px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: 'Oswald', sans-serif; }

  /* ── FLM TV TOP BAR ── */
  #flmBar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--hdr);
    background: #0a0a0a;
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--blue), var(--red), var(--gold), var(--green)) 1;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 9999;
    box-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }

  .flm-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 5px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ← Home — gold outline */
  .btn-front {
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.4);
    background: rgba(255,215,0,0.07);
  }
  .btn-front:hover { background: rgba(255,215,0,0.18); border-color: var(--gold); }

  /* Logo */
  .logo-wrap { display: flex; align-items: center; gap: 8px; }
  .logo-flag { display: flex; flex-direction: column; gap: 2px; }
  .logo-flag span { display: block; width: 20px; height: 2.5px; border-radius: 2px; }
  .logo-flag span:nth-child(1) { background: var(--blue); }
  .logo-flag span:nth-child(2) { background: var(--red); }
  .logo-flag span:nth-child(3) { background: var(--gold); }
  .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
  .logo-text .flm { color: var(--gold); }
  .logo-text .tv  { color: var(--green); }

  .bar-spacer { flex: 1; }

  /* FLM TV Home — solid gold */
  .btn-home {
    color: #000;
    background: var(--gold);
    border: 1px solid var(--gold);
    font-weight: 700;
  }
  .btn-home:hover { background: #ffe033; }

/* ── Chat & AI buttons — overlaid on player controls ── */
  .player-btns {
    position: fixed;
    bottom: 18px;
    right: 80px;
    display: flex;
    gap: 10px;
    z-index: 9999;
  }
  .player-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
    transition: opacity 0.2s, transform 0.2s;
  }
  .player-btn:hover { opacity: 1; transform: scale(1.1); }
  .btn-chat { background: var(--green); }
  .btn-ai   { background: var(--gold); }
  #jellyfinFrame {
    position: fixed;
    top: var(--hdr);
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: calc(100% - var(--hdr));
    border: none;
    background: #000;
  }
</style>
</head>
<body>

<!-- FLM TV BAR -->
<div id="flmBar">
  <a id="backBtn" class="flm-btn btn-front" href="home.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    ← Home
  </a>

  <div class="logo-wrap">
    <div class="logo-flag"><span></span><span></span><span></span></div>
    <div class="logo-text"><span class="flm">FLM</span> <span class="tv">TV</span></div>
  </div>

  <div class="bar-spacer"></div>

</div>

<!-- Chat & Zaina AI — overlaid on player controls bottom right -->
<div class="player-btns">
  <button class="player-btn btn-chat" title="Chat" onclick="document.getElementById('chatPanel').classList.toggle('open')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
  </button>
  <button class="player-btn btn-ai" title="Zaina AI" onclick="document.getElementById('aiPanel').classList.toggle('open')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  </button>
</div>

<!-- JELLYFIN IFRAME — full screen below bar -->
<iframe id="jellyfinFrame" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" title="FLM TV"></iframe>

<script>
const CONFIG = {
  PLAYER:    'https://flmtv26.duckdns.org:8920',
  API_KEY:   '62131ee22c0141c6b651be75a7444350',
  SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
};

const params   = new URLSearchParams(location.search);
const ITEM_ID  = params.get('id') || '';
const TITLE    = decodeURIComponent(params.get('name') || params.get('title') || '');
const CAT_ID   = params.get('catId') || '';
const CAT_NAME = decodeURIComponent(params.get('catName') || '');

// Page title
if (TITLE) document.title = 'FLM TV – ' + TITLE;

// Back button — go to category if we came from one, else home
const backBtn = document.getElementById('backBtn');
if (CAT_ID) {
  backBtn.href = 'category-detail.html?id=' + CAT_ID + '&name=' + encodeURIComponent(CAT_NAME);
}

// Load Jellyfin detail page
if (ITEM_ID) {
  document.getElementById('jellyfinFrame').src =
    CONFIG.PLAYER + '/web/index.html?api_key=' + CONFIG.API_KEY +
    '#/details?id=' + ITEM_ID +
    
    '&serverId=' + CONFIG.SERVER_ID;
}
</script>
</body>
</html>
