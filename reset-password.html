<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — FLM TV</title>
<link rel="icon" type="image/png" href="assets/logos/favicons-3/favicon-96x96.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:#7A6330;--red:#C0272D;--red-bright:#E8333A;--black:#070709;--dark:#0E0E13;--dark2:#14141A;--dark3:#1C1C24;--dark4:#26262F;--text:#F0EDE8;--text-dim:#888898;--text-muted:#444450;--live-green:#00E676;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.012) 3px,rgba(0,0,0,0.012) 4px);pointer-events:none;}
.ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:180px;letter-spacing:16px;color:rgba(201,168,76,0.025);white-space:nowrap;pointer-events:none;user-select:none;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--gold);text-decoration:none;margin-bottom:36px;position:relative;z-index:1;}
.nav-logo span{color:var(--red);}
.card{width:100%;max-width:400px;background:var(--dark2);border:1px solid rgba(201,168,76,0.15);border-radius:6px;padding:36px 32px;position:relative;z-index:1;}
.eyebrow{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--gold-dim);border:1px solid rgba(201,168,76,0.18);display:inline-block;padding:5px 14px;border-radius:2px;margin-bottom:18px;}
h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;margin-bottom:8px;}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:28px;line-height:1.5;}
label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
input[type=password]{width:100%;background:var(--dark);border:1px solid var(--dark4);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;padding:12px 14px;border-radius:4px;margin-bottom:18px;transition:border-color 0.2s;}
input[type=password]:focus{outline:none;border-color:var(--gold-dim);}
.hint{font-size:11px;color:var(--text-muted);margin-top:-12px;margin-bottom:18px;}
button{width:100%;background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:13px;border-radius:4px;cursor:pointer;transition:background 0.2s;}
button:hover{background:var(--gold-light);}
button:disabled{background:var(--dark4);color:var(--text-muted);cursor:not-allowed;}
.msg{font-size:13px;padding:12px 14px;border-radius:4px;margin-bottom:18px;line-height:1.5;display:none;}
.msg.error{display:block;background:rgba(192,39,45,0.1);border:1px solid rgba(192,39,45,0.3);color:#ff8a8f;}
.msg.success{display:block;background:rgba(0,230,118,0.08);border:1px solid rgba(0,230,118,0.25);color:var(--live-green);}
.back-link{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--gold-dim);text-decoration:none;letter-spacing:0.5px;}
.back-link:hover{color:var(--gold);}
</style>
</head>
<body>
<div class="ghost">RESET</div>
<a href="home.html" class="nav-logo">FLM<span>TV</span></a>

<div class="card">
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Set a new password</h1>
  <p class="sub" id="subText">Choose a new password for your FLM TV account.</p>

  <div class="msg" id="formMsg"></div>

  <form id="resetForm">
    <label for="pw1">New Password</label>
    <input type="password" id="pw1" autocomplete="new-password" required>
    <div class="hint">At least 6 characters</div>

    <label for="pw2">Confirm Password</label>
    <input type="password" id="pw2" autocomplete="new-password" required>

    <button type="submit" id="submitBtn">Reset Password</button>
  </form>

  <a href="home.html" class="back-link">← Back to FLM TV</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const form = document.getElementById('resetForm');
const msg = document.getElementById('formMsg');
const submitBtn = document.getElementById('submitBtn');
const subText = document.getElementById('subText');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

if (!token) {
  form.style.display = 'none';
  subText.textContent = '';
  showMsg('This reset link is missing or invalid. Please request a new one from the sign-in screen.', 'error');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw1.length < 6) {
    showMsg('Password must be at least 6 characters.', 'error');
    return;
  }
  if (pw1 !== pw2) {
    showMsg('Passwords don\u2019t match.', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting…';
  msg.className = 'msg';

  try {
    const res = await fetch('/.netlify/functions/jellyfin-reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: pw1 })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      form.style.display = 'none';
      subText.textContent = '';
      showMsg('Your password has been reset. You can now sign in with your new password.', 'success');
    } else {
      showMsg(data.error || 'Something went wrong. Please try again.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  } catch (err) {
    showMsg('Network error. Please check your connection and try again.', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
