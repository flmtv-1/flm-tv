<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dim: #7A6330;
  --red: #C0272D;
  --red-bright: #E8333A;
  --black: #070709;
  --dark: #0E0E13;
  --dark2: #14141A;
  --dark3: #1C1C24;
  --dark4: #26262F;
  --text: #F0EDE8;
  --text-dim: #888898;
  --text-muted: #444450;
  --live-green: #00E676;
  --ad-blue: #4A9EFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.012) 3px,rgba(0,0,0,0.012) 4px);
  pointer-events: none; z-index: 999;
}

/* NAV */
.topnav {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 60px;
  background: rgba(7,7,9,0.97);
  border-bottom: 1px solid rgba(201,168,76,0.2);
  backdrop-filter: blur(12px);
}
.nav-logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:5px; color:var(--gold); text-decoration:none; }
.nav-logo span { color:var(--red); }
.nav-links { display:flex; gap:24px; list-style:none; }
.nav-links a { color:var(--text-dim); text-decoration:none; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; transition:color 0.2s; }
.nav-links a:hover,.nav-links a.active { color:var(--gold); }
.live-pill { display:flex; align-items:center; gap:7px; background:var(--red); color:#fff; text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; padding:7px 16px; border-radius:2px; transition:background 0.2s; }
.live-pill:hover { background:var(--red-bright); }
.live-dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* HERO */
.hero { position:relative; overflow:hidden; padding:48px 32px 36px; background:linear-gradient(180deg,rgba(192,39,45,0.07) 0%,transparent 100%); text-align:center; }
.hero-ghost { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Bebas Neue',sans-serif; font-size:180px; letter-spacing:16px; color:rgba(201,168,76,0.025); white-space:nowrap; pointer-events:none; user-select:none; }
.hero-eyebrow { display:inline-flex; align-items:center; gap:8px; font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--gold-dim); border:1px solid rgba(201,168,76,0.18); padding:5px 14px; border-radius:2px; margin-bottom:18px; }
.hero-title { font-family:'Bebas Neue',sans-serif; font-size:68px; letter-spacing:6px; line-height:1; color:var(--text); margin-bottom:8px; }
.hero-title em { color:var(--gold); font-style:normal; }
.hero-date { font-family:'Barlow Condensed',sans-serif; font-size:17px; letter-spacing:4px; color:var(--text-dim); text-transform:uppercase; margin-bottom:28px; }
.hero-stats { display:flex; justify-content:center; gap:48px; }
.stat-num { font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:2px; color:var(--gold); line-height:1; }
.stat-label { font-size:10px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; margin-top:3px; }

/* JUMP BAR */
.jump-bar { display:flex; align-items:center; justify-content:center; gap:16px; padding:14px 32px; background:var(--dark2); border-top:1px solid rgba(201,168,76,0.1); border-bottom:1px solid rgba(201,168,76,0.1); }
.jump-btn { display:inline-flex; align-items:center; gap:8px; background:transparent; border:1px solid rgba(0,230,118,0.4); color:var(--live-green); font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:2px; padding:8px 20px; border-radius:2px; cursor:pointer; text-transform:uppercase; transition:all 0.2s; }
.jump-btn:hover { background:rgba(0,230,118,0.1); }
.clock-display { font-family:'Share Tech Mono',monospace; font-size:14px; color:var(--text-dim); letter-spacing:2px; }

/* FILTER */
.filter-bar { display:flex; gap:8px; padding:16px 32px; background:var(--dark); border-bottom:1px solid rgba(255,255,255,0.04); overflow-x:auto; }
.filter-bar::-webkit-scrollbar { display:none; }
.ftab { flex-shrink:0; background:transparent; border:1px solid var(--dark4); color:var(--text-dim); font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; letter-spacing:1.5px; padding:6px 16px; border-radius:2px; cursor:pointer; text-transform:uppercase; transition:all 0.2s; }
.ftab:hover { border-color:var(--gold-dim); color:var(--gold); }
.ftab.active { background:var(--gold); border-color:var(--gold); color:#000; }

/* SCHEDULE */
.schedule-wrap { max-width:860px; margin:0 auto; padding:28px 32px 80px; }

.time-block-header { display:flex; align-items:center; gap:14px; padding:24px 0 10px; }
.time-block-label { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--gold-dim); white-space:nowrap; }
.time-block-line { flex:1; height:1px; background:linear-gradient(90deg,rgba(201,168,76,0.2),transparent); }

/* SHOW CARD */
.show-card {
  display:grid; grid-template-columns:90px 1fr auto;
  align-items:stretch; gap:0;
  margin-bottom:3px; border-radius:4px; overflow:hidden;
  transition:transform 0.15s; position:relative;
}
.show-card:not(.live-now):hover { transform:translateX(3px); }
.show-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; z-index:1; }
.show-card.upcoming::before { background:var(--dark4); }
.show-card.live-now::before { background:var(--live-green); }
.show-card.ad-card::before { background:rgba(74,158,255,0.25); }
.show-card.flm-promo::before { background:var(--gold-dim); }

.show-time { padding:13px 14px; background:var(--dark2); border-right:1px solid rgba(255,255,255,0.04); text-align:right; display:flex; flex-direction:column; justify-content:center; }
.show-time-start { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--text); letter-spacing:0.5px; }
.show-time-end { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-muted); margin-top:2px; }

.show-info { padding:13px 18px; background:var(--dark2); border-right:1px solid rgba(255,255,255,0.04); flex:1; }
.show-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:600; letter-spacing:0.5px; color:var(--text); line-height:1.2; }
.show-meta { font-size:11px; color:var(--text-muted); margin-top:3px; letter-spacing:0.5px; }

.show-dur { padding:13px 14px; background:var(--dark2); font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-muted); white-space:nowrap; display:flex; align-items:center; }

/* AIRED */
.show-card.aired .show-time,
.show-card.aired .show-info,
.show-card.aired .show-dur { background:rgba(14,14,19,0.5); opacity:0.4; }

/* LIVE NOW */
.show-card.live-now { box-shadow:0 0 0 2px var(--live-green),0 4px 28px rgba(0,230,118,0.12); }
.show-card.live-now .show-time { background:rgba(0,230,118,0.07); border-right-color:rgba(0,230,118,0.15); }
.show-card.live-now .show-info { background:rgba(0,230,118,0.05); border-right-color:rgba(0,230,118,0.1); }
.show-card.live-now .show-dur  { background:rgba(0,230,118,0.04); }
.show-card.live-now .show-time-start { color:var(--live-green); }
.show-card.live-now .show-name { color:#fff; font-size:17px; }

.live-badge { display:inline-flex; align-items:center; gap:6px; background:var(--live-green); color:#000; font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:2px; padding:2px 8px; border-radius:2px; margin-top:6px; }
.live-badge-dot { width:5px; height:5px; border-radius:50%; background:#000; animation:blink 1s infinite; }

.watch-now-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    background: var(--live-green);
    color: #000;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 6px 16px;
    border-radius: 4px;
    text-decoration: none;
    transition: all 0.2s;
}
.watch-now-btn:hover { background: #fff; color: #000; transform: scale(1.05); }

/* PROGRESS */
.progress-bar-wrap { grid-column:1/-1; height:3px; background:rgba(0,230,118,0.1); }
.progress-bar-fill { height:100%; background:var(--live-green); transition:width 1s linear; }

/* AD */
.show-card.ad-card .show-time,
.show-card.ad-card .show-info,
.show-card.ad-card .show-dur { background:rgba(74,158,255,0.03); }
.show-card.ad-card .show-name { color:var(--ad-blue); font-size:13px; font-weight:500; }
.show-card.ad-card .show-time-start { color:var(--ad-blue); font-size:11px; }
.show-card.ad-card.aired { opacity:1; }

/* FLM PROMO */
.show-card.flm-promo .show-name { color:var(--gold); font-size:13px; }
.show-card.flm-promo .show-time,
.show-card.flm-promo .show-info,
.show-card.flm-promo .show-dur { background:rgba(201,168,76,0.03); }

.movie-badge { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:9px; font-weight:700; letter-spacing:1.5px; color:var(--gold); border:1px solid rgba(201,168,76,0.3); padding:1px 6px; border-radius:2px; margin-left:8px; vertical-align:middle; }
.flm-tag { font-size:10px; color:var(--gold-dim); letter-spacing:1px; margin-left:6px; font-family:'Barlow Condensed',sans-serif; font-weight:700; vertical-align:middle; }

.show-card.hidden { display:none !important; }

/* FOOTER */
.schedule-footer { text-align:center; padding:40px 32px; border-top:1px solid rgba(201,168,76,0.1); color:var(--text-muted); font-size:12px; letter-spacing:1px; line-height:2; }
.schedule-footer a { color:var(--gold-dim); text-decoration:none; }
.schedule-footer a:hover { color:var(--gold); }

@media(max-width:640px){
  .topnav{padding:0 16px;}
  .nav-links{display:none;}
  .hero{padding:32px 16px 24px;}
  .hero-ghost{display:none;}
  .hero-title{font-size:46px;}
  .hero-stats{gap:24px;}
  .schedule-wrap{padding:16px 12px 60px;}
  .filter-bar{padding:10px 12px;}
  .show-card{grid-template-columns:72px 1fr;}
  .show-dur{display:none;}
}
</style>

// ── KNOWN CATEGORIES ─────────────────────────────────────────────────
const AD_NAMES    = ['lance hendron','lenna hovanessian','mary perry','maryperry','cardboard boxer','dancing bear logo','lance4judge','judgemaryperry','lenna4nv','sheboujay','boxer','snail logo','snail-logo'];
const KIDS_NAMES  = ['sesame street','molly of denali','ready jet go','elinor wonders','super why','charlie brown','schoolhouse rock','little rascals'];
const MOVIE_NAMES = ['lord of the rings','hellboy','gran torino','herbie goes','cloudy with a chance','matilda','jurassic','alice in wonderland','lost world','charlie and the chocolate','angels and demons','good day to die hard','good day 2 die hard','a good day'];
const FLM_NAMES   = ['zaina juliette','flmtv','flm tv','2 louisiana','lucy the raffle','locals in las vegas'];
const FLM_ORIGINALS = ['Lucy the Raffle','Locals in Las Vegas','Charly Suarez','Zaina Juliette & Friends','Og Scorpio','Gladius'];

function classifyShow(name) {
  const n = name.toLowerCase();
  if (AD_NAMES.some(x => n.includes(x)))    return { type:'ad',      isAd:true };
  if (KIDS_NAMES.some(x => n.includes(x)))  return { type:'kids' };
  if (MOVIE_NAMES.some(x => n.includes(x))) return { type:'movie',   isMovie:true };
  if (FLM_NAMES.some(x => n.includes(x)))   return { type:'flm',     isFlmPromo:true };
  return { type:'classic' };
}

function parseSchedule(json) {
  const shows = Array.isArray(json) ? json : Object.values(json).flat();
  let offset = 0;
  let prevMin = -1;
  return shows.filter(s => s && s.name).map(s => {
    const cls = classifyShow(s.name);
    const [sh, sm] = (s.startTime||'00:00').split(':').map(Number);
    let startMin = sh * 60 + sm + offset;
    if (startMin < prevMin) { offset += 1440; startMin += 1440; }
    prevMin = startMin;
    const durSec = Math.max(0, (s.outPoint||s.duration||0) - (s.inPoint||0));
    const durMin = durSec / 60;
    const endMin = startMin + durMin;
    let dur = durSec===0?'—':durMin<1?Math.round(durSec)+' sec':durMin<60?Math.round(durMin)+' min':Math.floor(durMin/60)+' hr'+(Math.round(durMin%60)>0?' '+Math.round(durMin%60)+' min':'');
    function minToTime(m) {
      const hh=Math.floor(m/60)%24,mm=Math.round(m%60),ampm=hh>=12?'PM':'AM',h12=hh%12||12;
      return `${h12}:${String(mm).padStart(2,'0')} ${ampm}`;
    }
    return { name:s.name.trim(), rawName:s.name, path:s.path||'', start:minToTime(startMin), end:minToTime(endMin), startMin, endMin, dur, ...cls, isFlmOrig:FLM_ORIGINALS.some(x=>s.name.toLowerCase().includes(x.toLowerCase())) };
  });
}

// ── TIME OFFSET (minutes) — increase if page is behind, decrease if ahead ──
const TIME_OFFSET_MINUTES = 0;

const SCHEDULE = parseSchedule(SCHEDULE_JSON);

function getNowMin() {
  const n = new Date();
  const raw = n.getHours()*60 + n.getMinutes() + n.getSeconds()/60 + TIME_OFFSET_MINUTES;
  // If any show spans this raw time, use it. Otherwise try +1440 (next day).
  const matchRaw = SCHEDULE.some(s => raw >= s.startMin && raw < s.endMin);
  return matchRaw ? raw : raw + 1440;
}

function getStatus(s) {
  const now = getNowMin();
  if (now >= s.startMin && now < s.endMin) return 'live';
  if (now >= s.endMin) return 'aired';
  return 'upcoming';
}

function getProgress(s) {
  const now = getNowMin();
  return Math.min(100, Math.max(0, ((now - s.startMin)/(s.endMin - s.startMin))*100));
}

function blockLabel(min) {
  const h = Math.floor(min/60) % 24;
  if (h>=5 && h<12) return 'MORNING';
  if (h>=12 && h<17) return 'AFTERNOON';
  if (h>=17 && h<21) return 'EVENING';
  return 'LATE NIGHT';
}

function renderSchedule() {
  const wrap = document.getElementById('scheduleWrap');
  wrap.innerHTML = '';
  let lastBlock = null;

  let liveCardRendered = false;
  let morningCount = 0;
  SCHEDULE.forEach(show => {
    const status = getStatus(show);
    const block  = blockLabel(show.startMin);

    if (block !== lastBlock) {
      lastBlock = block;
      const hdr = document.createElement('div');
      hdr.className = 'time-block-header';
      if (block === 'MORNING') morningCount++;
      const d = new Date(); d.setDate(d.getDate() + morningCount - 1);
      const dateStr = block === 'MORNING' ? ` · ${d.getMonth()+1}-${d.getDate()}-${d.getFullYear()}` : '';
      hdr.innerHTML = `<div class="time-block-label">${block}${dateStr}</div><div class="time-block-line"></div>`;
      wrap.appendChild(hdr);
    }

    const classes = ['show-card', status === 'live' ? 'live-now' : status];
    if (show.isAd)       classes.push('ad-card');
    if (show.isFlmPromo) classes.push('flm-promo');

    const filterTags = [show.type, status];
    if (show.type==='kids')  filterTags.push('kids');
    if (show.isFlmOrig)      filterTags.push('flm');
    if (show.isMovie)        filterTags.push('movies');

    const card = document.createElement('div');
    card.className = classes.join(' ');
    card.dataset.filter = filterTags.join(' ');
    if (status === 'live' && !liveCardRendered) {
        card.id = 'live-now-card';
        card.style.cursor = 'pointer';
        card.onclick = function() { window.location.href = 'live.html'; };
    }

    const movieBadge = show.isMovie   ? `<span class="movie-badge">MOVIE</span>` : '';
    const flmTag     = show.isFlmOrig ? `<span class="flm-tag">★ FLM ORIGINAL</span>` : '';
    const liveBadge  = (status==='live' && !liveCardRendered) ? `<div class="live-badge"><div class="live-badge-dot"></div>ON AIR NOW</div>` : '';
    const watchNowBtn = (status==='live' && !liveCardRendered) ? `<a href="live.html" class="watch-now-btn" onclick="event.stopPropagation();">▶ Watch Now</a>` : '';
    const progressBar= (status==='live' && !liveCardRendered) ? `<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:${getProgress(show)}%"></div></div>` : '';
    if (status === 'live') liveCardRendered = true;

    card.innerHTML = `
      <div class="show-time">
        <div class="show-time-start">${show.start}</div>
        <div class="show-time-end">${show.end}</div>
      </div>
      <div class="show-info">
        <div class="show-name">${show.name}${movieBadge}${flmTag}</div>
        <div class="show-meta">${show.dur}</div>
        ${liveBadge}
        ${watchNowBtn}
      </div>
      <div class="show-dur">${show.dur}</div>
      ${progressBar}
    `;
    wrap.appendChild(card);
  });

  // Update hero stats
  const total = SCHEDULE.length;
  const movies = SCHEDULE.filter(s=>s.isMovie).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statMovies').textContent = movies;
  document.getElementById('statHours').textContent = Math.round(
    SCHEDULE.reduce((a,s)=>a+(s.endMin-s.startMin),0)/60
  );
}

function downloadSchedule() {
  const date = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  let txt = `FLM TV — Channel 26.5 Las Vegas & Worldwide\n`;
  txt += `Today's Schedule — ${date}\n`;
  txt += `${'═'.repeat(60)}\n\n`;
  SCHEDULE.forEach(s => {
    if (s.isAd) return; // skip commercials
    txt += `${s.start.padEnd(10)} ${s.name}\n`;
  });
  txt += `\n${'─'.repeat(60)}\n`;
  txt += `Watch Live: FLMTV.com\n`;
  txt += `Channel 26.5 — Las Vegas\n`;
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `FLM-TV-Schedule-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

function jumpToNow() {
  const el = document.getElementById('live-now-card');
  if (!el) { alert('No show currently airing — check back later!'); return; }
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.style.boxShadow = '0 0 0 3px #00E676, 0 0 40px rgba(0,230,118,0.35)';
  setTimeout(() => { el.style.boxShadow = '0 0 0 2px var(--live-green), 0 4px 28px rgba(0,230,118,0.12)'; }, 900);
}

function filterSchedule(cat, btn) {
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.show-card').forEach(card => {
    const tags = card.dataset.filter || '';
    let show = false;
    if (cat==='all')      show = true;
    else if (cat==='shows')   show = !card.classList.contains('ad-card') && !card.classList.contains('flm-promo') && !tags.includes('movie');
    else if (cat==='movies')  show = tags.includes('movies');
    else if (cat==='kids')    show = tags.includes('kids');
    else if (cat==='flm')     show = tags.includes('flm') && !card.classList.contains('ad-card');
    else if (cat==='upcoming')show = tags.includes('upcoming');
    card.classList.toggle('hidden', !show);
  });
}

// Live clock
function updateClock() {
  const n = new Date();
  const h = n.getHours()%12||12, m = String(n.getMinutes()).padStart(2,'0');
  const s = String(n.getSeconds()).padStart(2,'0');
  const ap = n.getHours()>=12?'PM':'AM';
  const el = document.getElementById('clockDisplay');
  if (el) el.textContent = `${h}:${m}:${s} ${ap}`;
}

// Progress bar update
function updateProgress() {
  const fill = document.getElementById('progressFill');
  if (!fill) return;
  const live = SCHEDULE.find(s => getStatus(s)==='live');
  if (live) fill.style.width = getProgress(live) + '%';
}

// Hero date
function setHeroDate() {
  const el = document.getElementById('heroDate');
  if (!el) return;
  el.textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
}

window.addEventListener('DOMContentLoaded', () => {
  setHeroDate();
  renderSchedule();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(updateProgress, 10000);
  setInterval(() => { renderSchedule(); }, 60000); // re-render every minute so live status updates
});
</script>

<script>
(function() {
    var ua = navigator.userAgent || '';
    if (!/AFT|FireTV|Silk/i.test(ua)) return;
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute('content', 'width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');

    var style = document.createElement('style');
    style.textContent = `
        .show-card:focus, .ftab:focus, .jump-btn:focus, .nav-logo:focus, a:focus {
            outline: 4px solid #ffd700 !important;
            box-shadow: 0 0 20px rgba(255,215,0,0.5) !important;
            z-index: 10; position: relative;
        }
        #live-now-card:focus { outline: 4px solid #00E676 !important; }
    `;
    document.head.appendChild(style);

    function getFocusable() {
        return Array.from(document.querySelectorAll(
            '.show-card:not(.hidden), .ftab, .jump-btn, .nav-logo, a.live-pill'
        )).filter(function(el) {
            return el.offsetParent !== null && el.offsetWidth > 0 && el.offsetHeight > 0;
        });
    }

    function findBest(current, all, dir) {
        var cr = current.getBoundingClientRect();
        var cx = cr.left + cr.width/2, cy = cr.top + cr.height/2;
        var candidates = all.filter(function(el) {
            if (el === current) return false;
            var r = el.getBoundingClientRect();
            var ex = r.left+r.width/2, ey = r.top+r.height/2;
            if (dir==='right') return ex > cr.right - 10;
            if (dir==='left')  return ex < cr.left + 10;
            if (dir==='down')  return ey > cr.bottom - 10;
            if (dir==='up')    return ey < cr.top + 10;
        });
        if (!candidates.length) return null;
        var best = null, bestScore = Infinity;
        candidates.forEach(function(el) {
            var r = el.getBoundingClientRect();
            var dx=(r.left+r.width/2)-cx, dy=(r.top+r.height/2)-cy;
            var p=(dir==='right'||dir==='left')?Math.abs(dx):Math.abs(dy);
            var s=(dir==='right'||dir==='left')?Math.abs(dy):Math.abs(dx);
            var score=p+s*0.3;
            if(score<bestScore){bestScore=score;best=el;}
        });
        return best;
    }

    document.addEventListener('keydown', function(e) {
        var all = getFocusable();
        if (!all.length) return;
        var focused = document.activeElement;
        var inList = all.indexOf(focused) >= 0;
        if (!inList) {
            if (['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter'].includes(e.key)) {
                e.preventDefault();
                var liveCard = document.getElementById('live-now-card');
                if (liveCard) { liveCard.focus(); liveCard.scrollIntoView({block:'center'}); }
                else { all[0].focus(); }
            }
            return;
        }
        var dir = {ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'}[e.key];
        if (dir) {
            e.preventDefault();
            var next = findBest(focused, all, dir);
            if (next) { next.focus(); next.scrollIntoView({behavior:'smooth',block:'center'}); }
            else if (dir==='up') { window.scrollTo({top:0,behavior:'smooth'}); setTimeout(function(){all[0].focus();},400); }
        }
        if (e.key==='Backspace'||e.key==='Escape') { e.preventDefault(); window.location.href='home.html'; }
        if (e.key==='Enter' && focused && focused.onclick) focused.click();
    }, true);

    window.addEventListener('load', function() {
        document.querySelectorAll('.show-card').forEach(function(el) {
            if (!el.getAttribute('tabindex')) el.setAttribute('tabindex','0');
            el.addEventListener('keydown', function(e) {
                if (e.key==='Enter'||e.key===' ') { e.preventDefault(); el.click(); }
            });
        });
        new MutationObserver(function() {
            document.querySelectorAll('.show-card').forEach(function(el) {
                if (!el.getAttribute('tabindex')) el.setAttribute('tabindex','0');
            });
        }).observe(document.body, {childList:true, subtree:true});
    });
})();
</script>
