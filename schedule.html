<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLM TV — Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#C9A84C; --red:#C0272D; --black:#070709; --dark:#14141A;
  --text:#F0EDE8; --dim:#888898; --muted:#444450;
  --green:#00E676; --blue:#4A9EFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;}
.nav{position:sticky;top:0;z-index:99;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:rgba(7,7,9,0.97);border-bottom:1px solid rgba(201,168,76,0.2);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;color:var(--gold);text-decoration:none;}
.logo span{color:var(--red);}
.live-btn{display:flex;align-items:center;gap:6px;background:var(--red);color:#fff;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;padding:6px 14px;border-radius:2px;}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.hero{padding:28px;text-align:center;border-bottom:1px solid rgba(201,168,76,0.1);}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:5px;}
.hero h1 em{color:var(--gold);font-style:normal;}
.hero-date{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:4px;color:var(--dim);text-transform:uppercase;margin-top:4px;}

.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 28px;background:var(--dark);border-bottom:1px solid rgba(255,255,255,0.04);}
.now-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(0,230,118,0.4);color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;padding:6px 14px;border-radius:2px;cursor:pointer;}
.clock{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--dim);letter-spacing:2px;}

.wrap{max-width:860px;margin:0 auto;padding:20px 28px 80px;}

.show{display:grid;grid-template-columns:90px 1fr 70px;margin-bottom:2px;border-radius:2px;overflow:hidden;border-left:3px solid var(--muted);}
.show.live{border-left-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 20px rgba(0,230,118,0.15);animation:glow 2s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--green),0 0 20px rgba(0,230,118,0.12)}50%{box-shadow:0 0 0 1px var(--green),0 0 32px rgba(0,230,118,0.3)}}
.show.aired{opacity:.3;}
.show.ad{border-left-color:rgba(74,158,255,0.35);}

.tcol{padding:10px 12px;background:var(--dark);text-align:right;display:flex;flex-direction:column;justify-content:center;}
.ts{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);}
.te{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.show.live .ts{color:var(--green);}

.icol{padding:10px 14px;background:var(--dark);border-left:1px solid rgba(255,255,255,0.03);}
.sname{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;}
.show.live .sname{color:#fff;font-size:16px;}
.show.ad .sname{color:var(--blue);font-size:13px;}
.badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center;}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;padding:2px 6px;border-radius:2px;}
.b-live{background:var(--green);color:#000;display:flex;align-items:center;gap:4px;}
.b-live-dot{width:5px;height:5px;border-radius:50%;background:#000;animation:blink 1s infinite;}
.b-movie{color:var(--gold);border:1px solid rgba(201,168,76,0.3);}
.b-kids{color:#a78bfa;border:1px solid rgba(167,139,250,0.3);}
.b-flm{color:var(--gold);font-size:9px;}
.watch{display:inline-flex;align-items:center;gap:4px;margin-top:5px;background:var(--green);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:2px;text-decoration:none;}

.dcol{padding:10px 8px;background:var(--dark);border-left:1px solid rgba(255,255,255,0.03);font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;}

.prog{grid-column:1/-1;height:3px;background:rgba(0,230,118,0.1);}
.prog-fill{height:100%;background:var(--green);transition:width 5s linear;}

.day-hdr{display:flex;align-items:center;gap:12px;padding:24px 0 10px;}
.day-lbl{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:rgba(201,168,76,0.5);}
.day-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,0.2),transparent);}

@media(max-width:600px){
  .show{grid-template-columns:72px 1fr;}
  .dcol{display:none;}
  .wrap{padding:12px 12px 60px;}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="home.html" class="logo">FLM<span>TV</span></a>
  <a href="live.html" class="live-btn"><div class="dot"></div> WATCH LIVE</a>
</nav>

<div class="hero">
  <h1>TODAY'S <em>PROGRAMMING</em></h1>
  <div class="hero-date" id="heroDate"></div>
</div>

<div class="bar">
  <button class="now-btn" onclick="jumpToNow()"><div class="dot" style="background:var(--green)"></div> NOW PLAYING</button>
  <div class="clock" id="clock"></div>
</div>

<div class="wrap" id="wrap"></div>

<script>
// ─────────────────────────────────────────────
// SCHEDULE — in broadcast order
// type: show | movie | kids | ad | flm
// ─────────────────────────────────────────────
const ITEMS = [
{"t":"08:49","n":"Nature Cat","d":1441,"type":"kids"},
{"t":"09:13","n":"FLMTV.com/KidsCorner","d":1535,"type":"ad"},
{"t":"09:39","n":"Snail-logo1-Z","d":15,"type":"ad"},
{"t":"09:39","n":"The Monkees 207 Hillbilly Honeymoon","d":1505,"type":"show"},
{"t":"10:04","n":"The Dick Van Dyke Show S02E06","d":1507,"type":"show"},
{"t":"10:29","n":"Get Smart S01E13 (Aboard the Orient Express)","d":1523,"type":"show"},
{"t":"10:54","n":"VoteScottBlack.com","d":30,"type":"ad"},
{"t":"10:55","n":"JudgeMaryPerry.com","d":14,"type":"ad"},
{"t":"10:56","n":"Lance4Judge.com","d":32,"type":"ad"},

{"t":"10:59","n":"Gilligan's Island S02E12","d":1518,"type":"show"},
{"t":"11:24","n":"Mister Ed S01E07 Ed the Lover","d":1326,"type":"show"},
{"t":"11:46","n":"Leave it to Beaver","d":1539,"type":"show"},
{"t":"12:12","n":"Bewitched","d":1521,"type":"show"},
{"t":"12:37","n":"Bewitched 2","d":1521,"type":"show"},
{"t":"13:02","n":"VoteScottBlack.com","d":30,"type":"ad"},
{"t":"13:03","n":"JudgeMaryPerry.com","d":14,"type":"ad"},
{"t":"13:03","n":"LallyForNV.com","d":30,"type":"ad"},
{"t":"13:04","n":"Lenna4NV.com","d":30,"type":"ad"},
{"t":"13:05","n":"Lance4Judge.com","d":32,"type":"ad"},
{"t":"13:06","n":"Andy Griffith","d":1800,"type":"show"},
{"t":"13:36","n":"Andy Griffith 2","d":1503,"type":"show"},
{"t":"14:01","n":"Boxer","d":135,"type":"ad"},
{"t":"14:03","n":"The Twilight Zone","d":1570,"type":"show"},
{"t":"14:29","n":"The Twilight Zone 2","d":1557,"type":"show"},
{"t":"14:55","n":"VoteScottBlack.com","d":30,"type":"ad"},
{"t":"14:56","n":"JudgeMaryPerry.com","d":14,"type":"ad"},
{"t":"14:56","n":"Lance4Judge.com","d":32,"type":"ad"},
{"t":"14:57","n":"Lenna4NV.com","d":30,"type":"ad"},
{"t":"14:58","n":"LallyForNV.com","d":30,"type":"ad"},
{"t":"14:59","n":"SheBoujay.com","d":60,"type":"ad"},
{"t":"15:00","n":"What's Happening S01E03","d":1800,"type":"show"},
{"t":"15:30","n":"Good Times S05E16 Where There's Smoke","d":1540,"type":"show"},
{"t":"15:56","n":"Sanford and Son Season 4","d":1800,"type":"show"},
{"t":"16:26","n":"The Jeffersons S06E21 The Loan","d":1495,"type":"show"},
{"t":"16:51","n":"FLM TV Tag","d":21,"type":"ad"},
{"t":"16:51","n":"VoteScottBlack.com","d":30,"type":"ad"},
{"t":"16:52","n":"JudgeMaryPerry.com","d":14,"type":"ad"},
{"t":"16:52","n":"LallyForNV.com","d":30,"type":"ad"},
{"t":"16:53","n":"Lenna4NV.com","d":30,"type":"ad"},
{"t":"16:54","n":"Lance4Judge.com","d":32,"type":"ad"},
{"t":"16:55","n":"Schoolhouse Rock 1","d":185,"type":"kids"},
{"t":"16:58","n":"Schoolhouse Rock 2","d":194,"type":"kids"},
{"t":"17:01","n":"Schoolhouse Rock 3","d":186,"type":"kids"},
{"t":"17:04","n":"Schoolhouse Rock 4","d":192,"type":"kids"},
{"t":"17:07","n":"Aladdin (1992)","d":5400,"type":"movie"}
];

// ─────────────────────────────────────────────
// ENGINE — walks list in order, one midnight crossing = next calendar day
// ─────────────────────────────────────────────
function build(items) {
  let dayOffset = 0;
  let prevMin = -1;
  return items.map((s, i) => {
    const [h, m] = s.t.split(':').map(Number);
    const minOfDay = h * 60 + m;
    if (i > 0 && minOfDay < prevMin - 30) dayOffset += 1440;
    prevMin = minOfDay;
    const start = dayOffset + minOfDay;
    const end = start + s.d / 60;
    return { ...s, start, end, day: Math.floor(dayOffset / 1440) };
  });
}

function ftime(min) {
  const h = Math.floor(min / 60) % 24, m = Math.round(min % 60);
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
}

function fdur(sec) {
  if (!sec) return '—';
  const m = sec / 60;
  if (m < 1) return Math.round(sec) + 's';
  if (m < 60) return Math.round(m) + ' min';
  return Math.floor(m / 60) + ' hr' + (Math.round(m % 60) ? ' ' + Math.round(m % 60) + ' min' : '');
}

const S = build(ITEMS);

// Get current time in schedule-minutes
// Walk each day offset, find which one has a live show
function now() {
  const d = new Date();
  const raw = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const days = [...new Set(S.map(s => s.day))];
  for (const day of days) {
    const t = raw + day * 1440;
    if (S.some(s => t >= s.start && t < s.end)) return t;
  }
  // In a gap — use the last day's offset
  return raw + (Math.max(...days) * 1440);
}

function render() {
  const t = now();
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  let lastDay = -1;

  S.forEach(s => {
    if (s.day !== lastDay) {
      lastDay = s.day;
      // day 0 = today, day 1 = tomorrow — always relative to TODAY's date
      const d = new Date();
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + s.day);
      wrap.insertAdjacentHTML('beforeend',
        `<div class="day-hdr"><div class="day-lbl">${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase()}</div><div class="day-line"></div></div>`
      );
    }

    const live  = t >= s.start && t < s.end;
    const aired = t >= s.end;
    const pct   = live ? Math.min(100, ((t - s.start) / (s.end - s.start)) * 100) : 0;
    const cls   = `show ${live?'live':aired?'aired':'upcoming'} ${s.type==='ad'?'ad':''} ${s.type==='flm'?'flm':''}`;

    wrap.insertAdjacentHTML('beforeend', `
      <div class="${cls}" ${live ? 'id="live-now"' : ''}>
        <div class="tcol"><div class="ts">${ftime(s.start)}</div><div class="te">${ftime(s.end)}</div></div>
        <div class="icol">
          <div class="sname">${s.n}</div>
          <div class="badges">
            ${live  ? `<span class="badge b-live"><span class="b-live-dot"></span>ON AIR NOW</span>` : ''}
            ${s.type==='movie' ? `<span class="badge b-movie">MOVIE</span>` : ''}
            ${s.type==='kids'  ? `<span class="badge b-kids">KIDS</span>`  : ''}
            ${s.type==='flm'   ? `<span class="badge b-flm">★ FLM ORIGINAL</span>` : ''}
          </div>
          ${live ? `<a href="live.html" class="watch">▶ Watch Now</a>` : ''}
        </div>
        <div class="dcol">${fdur(s.d)}</div>
        ${live ? `<div class="prog"><div class="prog-fill" id="pf" style="width:${pct}%"></div></div>` : ''}
      </div>`);
  });
}

function jumpToNow() {
  const el = document.getElementById('live-now');
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function tick() {
  const d = new Date();
  const h = d.getHours() % 12 || 12, m = String(d.getMinutes()).padStart(2,'0'), s = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s} ${d.getHours()>=12?'PM':'AM'}`;
  const pf = document.getElementById('pf');
  if (pf) { const t=now(), live=S.find(s=>t>=s.start&&t<s.end); if(live) pf.style.width=Math.min(100,((t-live.start)/(live.end-live.start))*100)+'%'; }
}

document.getElementById('heroDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
render();
jumpToNow();
setInterval(tick, 1000);
setInterval(render, 30000);
</script>
</body>
</html>
