<style>
:root {
  --gold: #C9A84C; --gold-light: #E8C97A; --gold-dim: #7A6330;
  --red: #C0272D; --red-bright: #E8333A;
  --black: #070709; --dark: #0E0E13; --dark2: #14141A; --dark3: #1C1C24; --dark4: #26262F;
  --text: #F0EDE8; --text-dim: #888898; --text-muted: #444450;
  --green: #00E676; --blue: #4A9EFF;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--black); color:var(--text); font-family:'Barlow',sans-serif; min-height:100vh; }
.topnav { position:sticky; top:0; z-index:200; display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:60px; background:rgba(7,7,9,0.97); border-bottom:1px solid rgba(201,168,76,0.2); backdrop-filter:blur(12px); }
.nav-logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:5px; color:var(--gold); text-decoration:none; }
.nav-logo span { color:var(--red); }
.nav-links { display:flex; gap:24px; list-style:none; }
.nav-links a { color:var(--text-dim); text-decoration:none; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; transition:color 0.2s; }
.nav-links a:hover,.nav-links a.active { color:var(--gold); }
.live-pill { display:flex; align-items:center; gap:7px; background:var(--red); color:#fff; text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; padding:7px 16px; border-radius:2px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }
.hero { padding:36px 32px 24px; text-align:center; border-bottom:1px solid rgba(201,168,76,0.1); }
.hero-title { font-family:'Bebas Neue',sans-serif; font-size:56px; letter-spacing:6px; color:var(--text); }
.hero-title em { color:var(--gold); font-style:normal; }
.hero-sub { font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:4px; color:var(--text-dim); text-transform:uppercase; margin-top:4px; }
.toolbar { display:flex; align-items:center; justify-content:space-between; padding:12px 32px; background:var(--dark2); border-bottom:1px solid rgba(255,255,255,0.04); flex-wrap:wrap; gap:12px; }
.toolbar-left { display:flex; gap:10px; align-items:center; }
.btn { display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid rgba(0,230,118,0.4); color:var(--green); font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; padding:7px 16px; border-radius:2px; cursor:pointer; text-transform:uppercase; transition:all 0.2s; }
.btn:hover { background:rgba(0,230,118,0.1); }
.btn-gold { border-color:rgba(201,168,76,0.4); color:var(--gold); }
.btn-gold:hover { background:rgba(201,168,76,0.1); }
.clock { font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--text-dim); letter-spacing:2px; }
.schedule-wrap { max-width:900px; margin:0 auto; padding:24px 32px 80px; }
.day-header { display:flex; align-items:center; gap:14px; padding:28px 0 12px; }
.day-label { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px; color:var(--gold-dim); white-space:nowrap; }
.day-line { flex:1; height:1px; background:linear-gradient(90deg,rgba(201,168,76,0.25),transparent); }
.show-card { display:grid; grid-template-columns:100px 1fr 80px; align-items:stretch; margin-bottom:3px; border-radius:3px; overflow:hidden; border-left:3px solid var(--dark4); transition:transform 0.15s; }
.show-card:hover { transform:translateX(2px); }
.show-card.aired { opacity:0.35; }
.show-card.live { border-left-color:var(--green); box-shadow:0 0 0 1px var(--green),0 4px 24px rgba(0,230,118,0.2); animation:pglow 2s ease-in-out infinite; }
@keyframes pglow { 0%,100%{box-shadow:0 0 0 1px var(--green),0 4px 24px rgba(0,230,118,0.15)}50%{box-shadow:0 0 0 1px var(--green),0 4px 36px rgba(0,230,118,0.35)} }
.show-card.ad { border-left-color:rgba(74,158,255,0.3); }
.show-card.flm { border-left-color:var(--gold-dim); }
.time-col { padding:12px 14px; background:var(--dark2); border-right:1px solid rgba(255,255,255,0.04); text-align:right; display:flex; flex-direction:column; justify-content:center; }
.time-start { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--text); }
.time-end { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-muted); margin-top:2px; }
.show-card.live .time-start { color:var(--green); }
.info-col { padding:12px 16px; background:var(--dark2); border-right:1px solid rgba(255,255,255,0.04); }
.show-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:600; color:var(--text); line-height:1.2; }
.show-card.live .show-name { color:#fff; font-size:17px; }
.show-card.ad .show-name { color:var(--blue); font-size:13px; }
.show-card.flm .show-name { color:var(--gold); }
.show-badges { display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap; }
.badge { font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:1.5px; padding:2px 7px; border-radius:2px; }
.badge-live { background:var(--green); color:#000; display:flex; align-items:center; gap:5px; }
.badge-live-dot { width:5px; height:5px; border-radius:50%; background:#000; animation:blink 1s infinite; }
.badge-movie { color:var(--gold); border:1px solid rgba(201,168,76,0.35); }
.badge-kids { color:#a78bfa; border:1px solid rgba(167,139,250,0.35); }
.badge-flm { color:var(--gold-dim); }
.watch-btn { display:inline-flex; align-items:center; gap:5px; margin-top:6px; background:var(--green); color:#000; font-weight:800; font-size:11px; letter-spacing:1px; padding:5px 14px; border-radius:3px; text-decoration:none; }
.dur-col { padding:12px 10px; background:var(--dark2); font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-muted); display:flex; align-items:center; justify-content:flex-end; }
.progress-wrap { grid-column:1/-1; height:3px; background:rgba(0,230,118,0.1); }

.footer { text-align:center; padding:40px 32px; border-top:1px solid rgba(201,168,76,0.1); color:var(--text-muted); font-size:12px; letter-spacing:1px; line-height:2; }

// ════════════════════════════════════════════════════
// ENGINE
// ════════════════════════════════════════════════════
function buildSchedule(raw) {
  let dayOffset = 0;
  let prevStartMin = -1;
  return raw.map((s, i) => {
    const [h, m] = s.time.split(':').map(Number);
    let startMin = h * 60 + m + dayOffset;
    // If start time goes backward, we crossed midnight — add a day
    if (i > 0 && startMin <= prevStartMin) {
      dayOffset += 1440;
      startMin += 1440;
    }
    prevStartMin = startMin;
    const durMin = s.duration / 60;
    const endMin = startMin + durMin;
    return { ...s, startMin, endMin, dayNum: Math.floor(startMin / 1440), startLabel: fmt(startMin), endLabel: fmt(endMin), durLabel: fmtDur(s.duration) };
  });
}

function fmt(min) {
  const h = Math.floor(min/60)%24, m = Math.round(min%60);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}

function fmtDur(sec) {
  if (!sec) return '—';
  const m = sec/60;
  if (m < 1) return Math.round(sec)+'s';
  if (m < 60) return Math.round(m)+' min';
  return Math.floor(m/60)+' hr'+(Math.round(m%60)>0?' '+Math.round(m%60)+' min':'');
}

const SCHEDULE = buildSchedule(SCHEDULE_RAW);

function getNow() {
  const n = new Date();
  const rawMin = n.getHours()*60 + n.getMinutes() + n.getSeconds()/60;
  // Try each day offset in the schedule — find which one has a live show
  const offsets = [...new Set(SCHEDULE.map(s => s.dayNum * 1440))];
  for (const off of offsets) {
    const t = rawMin + off;
    if (SCHEDULE.some(s => t >= s.startMin && t < s.endMin)) return t;
  }
  // In a gap between shows — use last offset
  return rawMin + (offsets[offsets.length-1] || 0);
}

function render() {
  const wrap = document.getElementById('scheduleWrap');
  const now = getNow();
  wrap.innerHTML = '';
  let lastDay = -1;
  const today = new Date();
  today.setHours(0,0,0,0);

  SCHEDULE.forEach(s => {
    if (s.dayNum !== lastDay) {
      lastDay = s.dayNum;
      const d = new Date(today.getTime() + s.dayNum * 86400000);
      const label = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
      wrap.insertAdjacentHTML('beforeend',`<div class="day-header"><div class="day-label">${label}</div><div class="day-line"></div></div>`);
    }

    const isLive  = now >= s.startMin && now < s.endMin;
    const isAired = now >= s.endMin;
    const pct = isLive ? Math.min(100,((now-s.startMin)/(s.endMin-s.startMin))*100) : 0;

    const cls = ['show-card', isLive?'live':isAired?'aired':'upcoming', s.type==='ad'?'ad':'', s.type==='flm'?'flm':''].join(' ');
    const id  = isLive ? 'id="live-now"' : '';

    const movieB = s.type==='movie' ? `<span class="badge badge-movie">MOVIE</span>` : '';
    const kidsB  = s.type==='kids'  ? `<span class="badge badge-kids">KIDS</span>` : '';
    const flmB   = s.type==='flm'   ? `<span class="badge badge-flm">★ FLM ORIGINAL</span>` : '';
    const liveB  = isLive ? `<span class="badge badge-live"><span class="badge-live-dot"></span>ON AIR NOW</span>` : '';
    const watchB = isLive ? `<a href="live.html" class="watch-btn">▶ Watch Now</a>` : '';
    const prog   = isLive ? `<div class="progress-wrap"><div class="progress-fill" id="pfill" style="width:${pct}%"></div></div>` : '';

    wrap.insertAdjacentHTML('beforeend',`
      <div class="${cls}" ${id}>
        <div class="time-col"><div class="time-start">${s.startLabel}</div><div class="time-end">${s.endLabel}</div></div>
        <div class="info-col">
          <div class="show-name">${s.name}</div>
          <div class="show-badges">${liveB}${movieB}${kidsB}${flmB}</div>
          ${watchB}
        </div>
        <div class="dur-col">${s.durLabel}</div>
        ${prog}
      </div>`);
  });
}

function jumpToNow() {
  const el = document.getElementById('live-now');
  if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
  else alert('No show currently live!');
}

function updateClock() {
  const n = new Date();
  const h=n.getHours()%12||12, m=String(n.getMinutes()).padStart(2,'0'), s=String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s} ${n.getHours()>=12?'PM':'AM'}`;
}

function updateProgress() {
  const fill = document.getElementById('pfill');
  if (!fill) return;
  const now = getNow();
  const live = SCHEDULE.find(s => now >= s.startMin && now < s.endMin);
  if (live) fill.style.width = Math.min(100,((now-live.startMin)/(live.endMin-live.startMin))*100)+'%';
}

function downloadSchedule() {
  let txt = `FLM TV — Channel 26.5 Las Vegas & Worldwide\nSchedule — ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}\n${'═'.repeat(60)}\n\n`;
  SCHEDULE.forEach(s => { if (s.type!=='ad') txt += `${s.startLabel.padEnd(12)} ${s.name}\n`; });
  txt += `\n${'─'.repeat(60)}\nWatch Live: FLMTV.com | Channel 26.5 Las Vegas\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download = `FLM-TV-Schedule-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

document.getElementById('heroDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
render();
updateClock();
setInterval(updateClock, 1000);
setInterval(updateProgress, 5000);
setInterval(render, 30000);
</script>
