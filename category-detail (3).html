<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category - FLM TV</title>
    <style>
        :root {
            --primary: #ffd700;
            --secondary: #22c55e;
            --bg: #0a0f1a;
            --bg-light: #1a1f2e;
            --text: #ffffff;
            --text-secondary: #94a3b8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--primary);
            color: #000;
        }
        
        .header {
            background: var(--bg-light);
            padding: 6rem 2rem 2rem;
            border-bottom: 3px solid var(--primary);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .category-title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .category-count {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .item-card {
            background: transparent;
            border: none;
            border-radius: 8px;
            overflow: visible;
            cursor: pointer;
            transition: transform 0.2s ease;
            min-width: 0;
        }
        
        .item-card:hover {
            transform: translateY(-4px);
        }
        
        .item-poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-light);
            border-radius: 8px;
            display: block;
        }

        /* Wrapper so dark bg shows even when image fails */
        .poster-wrap {
            width: 100%;
            height: 200px;
            background: var(--bg-light);
            border-radius: 8px;
            overflow: hidden;
        }

        .poster-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .item-info {
            padding: 0.4rem 0.1rem 0;
        }
        
        .item-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.15rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        
        .item-year {
            color: var(--text-secondary);
            font-size: 0.72rem;
        }
        
        /* LOADING OVERLAY */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 9999;
            gap: 1rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .loading-text {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .pagination button {
            background: var(--bg-light);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--primary);
            color: #000;
        }
        
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .load-more-btn {
            display: block;
            margin: 2rem auto;
            background: var(--secondary);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        
        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* LOADING MORE INDICATOR */
        .loading-more {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .category-title { font-size: 2rem; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
            .pagination button { padding: 0.5rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="history.back()">← Back</button>

<div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading library...</div>
</div>

<div class="header">
    <div class="header-content">
        <h1 class="category-title" id="categoryTitle">Loading...</h1>
        <div class="category-count" id="categoryCount"></div>
    </div>
</div>

<div class="content">
    <div class="items-grid" id="itemsGrid"></div>
    
    <div class="loading-more" id="loadingMore" style="display: none;">
        <div class="spinner" style="margin: 0 auto 1rem;"></div>
        Loading more items...
    </div>
    
    <!-- LOAD MORE BUTTON -->
    <button class="load-more-btn" id="loadMoreBtn" style="display: none;" onclick="loadMore()">
        Load More
    </button>
    
    <!-- PAGE NAVIGATION (Alternative to Load More) -->
    <div class="pagination" id="pagination" style="display: none;">
        <button onclick="previousPage()" id="prevBtn">← Previous</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button onclick="nextPage()" id="nextBtn">Next →</button>
    </div>
</div>

<script>
const CONFIG = {
    SERVER: 'https://flmtv26.duckdns.org:8920',
    API_KEY: '62131ee22c0141c6b651be75a7444350',
    USER_ID: '0407d4609a0346f99c09e0d7ddc9ccd1'
};

const categoryId = new URLSearchParams(window.location.search).get('id');
const categoryName = new URLSearchParams(window.location.search).get('name');

// PAGINATION SETTINGS
const ITEMS_PER_PAGE = 24; // Load 24 items at a time
let currentPage = 0;
let totalItems = 0;
let allItems = [];

// Authentication skipped — using API key directly

async function loadCategory() {
    try {
        // Use API key directly — no auth needed
        
        // Set category name if provided
        if (categoryName) {
            document.getElementById('categoryTitle').textContent = decodeURIComponent(categoryName);
        }
        
        // LOAD FIRST PAGE ONLY - Much faster!
        const itemsUrl = `${CONFIG.SERVER}/Users/${CONFIG.USER_ID}/Items?ParentId=${categoryId}&Recursive=true&SortBy=SortName&Fields=PrimaryImageAspectRatio,BasicSyncInfo,Name,OriginalTitle&ImageTypeLimit=1&EnableImageTypes=Primary&StartIndex=${currentPage * ITEMS_PER_PAGE}&Limit=${ITEMS_PER_PAGE}&api_key=${CONFIG.API_KEY}`;
        console.log('Loading page', currentPage + 1, ':', itemsUrl);
        
        const itemsRes = await fetch(itemsUrl);
        const itemsData = await itemsRes.json();
        
        console.log('Category items:', itemsData);
        
        totalItems = itemsData.TotalRecordCount || 0;
        allItems = itemsData.Items || [];
        
        // Update count
        document.getElementById('categoryCount').textContent = `${totalItems} items total`;
        
        // If no name provided, try to get it from category
        if (!categoryName) {
            try {
                const parentUrl = `${CONFIG.SERVER}/Users/${CONFIG.USER_ID}/Items/${categoryId}?api_key=${CONFIG.API_KEY}`;
                const parentRes = await fetch(parentUrl);
                const parent = await parentRes.json();
                document.getElementById('categoryTitle').textContent = parent.Name || 'Category';
            } catch (e) {
                document.getElementById('categoryTitle').textContent = 'Category';
            }
        }
        
        // Display items
        displayItems(allItems);
        
        // Show pagination controls
        updatePaginationControls();
        
        document.getElementById('loading').style.display = 'none';
        
    } catch (error) {
        console.error('Error loading category:', error);
        document.getElementById('loading').style.display = 'none';
    }
}

function displayItems(items) {
    const itemsGrid = document.getElementById('itemsGrid');
    
    if (items && items.length > 0) {
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => {
                const catParam = categoryId ? `&catId=${categoryId}&catName=${encodeURIComponent(categoryName || '')}` : '';
                window.location.href = `movie-frame.html?id=${item.Id}${catParam}`;
            };
            
            const posterUrl = item.ImageTags && item.ImageTags.Primary
                ? `${CONFIG.SERVER}/Items/${item.Id}/Images/Primary?api_key=${CONFIG.API_KEY}&tag=${item.ImageTags.Primary}&maxWidth=300&quality=90`
                : '';
            
            card.innerHTML = `
                <div class="poster-wrap">
                    ${posterUrl ? `<img src="${posterUrl}" alt="${item.Name}" loading="lazy">` : ''}
                </div>
                <div class="item-info">
                    <div class="item-title">${item.OriginalTitle || item.Name}</div>
                    ${item.ProductionYear ? `<div class="item-year">${item.ProductionYear}</div>` : ''}
                </div>
            `;
            
            itemsGrid.appendChild(card);
        });
    } else {
        itemsGrid.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 2rem;">No items found in this category</p>';
    }
}

function updatePaginationControls() {
    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
    const hasMore = (currentPage + 1) * ITEMS_PER_PAGE < totalItems;
    
    // Show Load More button if there are more items
    if (hasMore) {
        document.getElementById('loadMoreBtn').style.display = 'block';
    } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
    }
    
    // Update page navigation
    document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = !hasMore;
}

async function loadMore() {
    currentPage++;
    document.getElementById('loadingMore').style.display = 'block';
    document.getElementById('loadMoreBtn').disabled = true;
    
    const itemsUrl = `${CONFIG.SERVER}/Users/${CONFIG.USER_ID}/Items?ParentId=${categoryId}&Recursive=true&SortBy=SortName&Fields=PrimaryImageAspectRatio,BasicSyncInfo,Name,OriginalTitle&ImageTypeLimit=1&EnableImageTypes=Primary&StartIndex=${currentPage * ITEMS_PER_PAGE}&Limit=${ITEMS_PER_PAGE}&api_key=${CONFIG.API_KEY}`;
    
    try {
        const itemsRes = await fetch(itemsUrl);
        const itemsData = await itemsRes.json();
        
        displayItems(itemsData.Items);
        updatePaginationControls();
        
    } catch (error) {
        console.error('Error loading more:', error);
    }
    
    document.getElementById('loadingMore').style.display = 'none';
    document.getElementById('loadMoreBtn').disabled = false;
}

async function nextPage() {
    currentPage++;
    document.getElementById('itemsGrid').innerHTML = '';
    document.getElementById('loading').style.display = 'flex';
    await loadCategory();
}

async function previousPage() {
    if (currentPage > 0) {
        currentPage--;
        document.getElementById('itemsGrid').innerHTML = '';
        document.getElementById('loading').style.display = 'flex';
        await loadCategory();
    }
}

if (!categoryId) {
    history.back();
} else {
    loadCategory();
}
</script>

</body>
</html>
