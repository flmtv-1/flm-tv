<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - FLM TV</title>
    <style>
        :root {
            --primary: #ffd700;
            --secondary: #22c55e;
            --bg: #0a0f1a;
            --bg-light: #1a1f2e;
            --text: #ffffff;
            --text-secondary: #94a3b8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--primary);
            color: #000;
        }
        
        .header {
            background: var(--bg-light);
            padding: 6rem 2rem 2rem;
            border-bottom: 3px solid var(--primary);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .collections-title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .collections-count {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }
        
        .collection-card {
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .trailer-btn {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220,38,38,0.9);
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .collection-card:hover .trailer-btn { opacity: 1; }
        
        .collection-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }
        
        .collection-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #1a1a1a;
        }
        
        .collection-info {
            padding: 1rem;
        }
        
        .collection-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .collection-year {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .collections-title { font-size: 2rem; }
            .collections-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='home.html'">← Back</button>

<div class="header">
    <div class="header-content">
        <h1 class="collections-title">Collections</h1>
        <div class="collections-count" id="collectionsCount">31 collections</div>
    </div>
</div>

<div class="content">
    <div class="collections-grid" id="collectionsGrid"></div>
</div>

<script>
const COLLECTIONS = [

    { id: '36308ee776b2730ca6f32aeb128af43d', name: 'Arthur Collection', year: '1981' },
    { id: 'eb51916201c6db134a167b67f89c11ea', name: 'Austin Powers Collection', year: '1997' },
    { id: 'e0ef9c2ef48794cf90330e5a8e671998', name: 'Avatar Collection', year: '2009' },
    { id: '0cebe383a89ff4f9aafaa644f1197d53', name: 'AVP Collection', year: '2004' },
    { id: '5cadb319bc8b9dca78b5c9e0561c767a', name: 'Beverly Hills Cop Collection', year: '1984' },

    { id: '21f507e7a9155de1c777026f80278a81', name: 'Charlie Chan Collection', year: '1931' },

    { id: 'ffea8ec538e4c51f3ee2459583484c5c', name: 'Dirty Harry Collection', year: '1971' },

</script>


<!-- TRAILER MODAL -->
<div id="trailerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;align-items:center;justify-content:center;padding:1rem;">
    <div style="width:100%;max-width:900px;position:relative;">
        <button onclick="closeTrailer()" style="position:absolute;top:-44px;right:0;background:#22c55e;border:none;color:white;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;z-index:10;">&#x2715;</button>
        <div id="trailerTitle" style="color:#ffd700;font-size:1.2rem;font-weight:800;margin-bottom:0.75rem;"></div>
        <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;border:2px solid #ffd700;">
            <iframe id="trailerFrame" src="" allow="autoplay;encrypted-media" allowfullscreen
                style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe>
        </div>
    </div>
</div>
<style>#trailerModal.active { display: flex !important; }</style>

<script>
const TMDB_KEY = '34773a6e0f80645a5b07a1ee76ecc26b';

async function fetchTrailer(title, year, type) {
    const modal   = document.getElementById('trailerModal');
    const frame   = document.getElementById('trailerFrame');
    const titleEl = document.getElementById('trailerTitle');
    titleEl.textContent = 'Loading trailer for "' + title + '"...';
    frame.src = '';
    modal.classList.add('active');
    try {
        const isTv       = type === 'Series';
        const searchType = isTv ? 'tv' : 'movie';
        const yearParam  = isTv ? 'first_air_date_year' : 'year';
        const searchRes  = await fetch('https://api.themoviedb.org/3/search/' + searchType + '?api_key=' + TMDB_KEY + '&query=' + encodeURIComponent(title) + (year ? '&' + yearParam + '=' + year : ''));
        const searchData = await searchRes.json();
        if (!searchData.results || !searchData.results.length) { titleEl.textContent = 'No trailer found for "' + title + '"'; return; }
        const tmdbId     = searchData.results[0].id;
        const videosRes  = await fetch('https://api.themoviedb.org/3/' + searchType + '/' + tmdbId + '/videos?api_key=' + TMDB_KEY);
        const videosData = await videosRes.json();
        const candidates = (videosData.results || []).filter(v =>
            v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')
        ).sort((a, b) => {
            if (a.type === 'Trailer' && b.type !== 'Trailer') return -1;
            if (b.type === 'Trailer' && a.type !== 'Trailer') return 1;
            if (a.official && !b.official) return -1;
            if (b.official && !a.official) return 1;
            return 0;
        });
        if (!candidates.length) { titleEl.textContent = 'No trailer available for "' + title + '"'; return; }
        titleEl.textContent = title + (year ? ' (' + year + ')' : '');
        for (const c of candidates) {
            frame.src = 'https://www.youtube-nocookie.com/embed/' + c.key + '?autoplay=1&rel=0&modestbranding=1&origin=' + encodeURIComponent(window.location.origin);
            const ok = await new Promise(resolve => {
                let done = false;
                frame.addEventListener('load',  () => { if (!done) { done = true; resolve(true);  } }, { once: true });
                frame.addEventListener('error', () => { if (!done) { done = true; resolve(false); } }, { once: true });
                setTimeout(() => { if (!done) { done = true; resolve(true); } }, 2000);
            });
            if (ok) return;
            frame.src = '';
        }
        titleEl.textContent = 'Opening trailer for "' + title + '" on YouTube...';
        window.open('https://www.youtube.com/watch?v=' + candidates[0].key, '_blank');
        closeTrailer();
    } catch(err) {
        titleEl.textContent = 'Could not load trailer for "' + title + '"';
        console.error('Trailer error:', err);
    }
}

function closeTrailer() {
    document.getElementById('trailerModal').classList.remove('active');
    document.getElementById('trailerFrame').src = '';
}

document.getElementById('trailerModal').addEventListener('click', function(e) {
    if (e.target === this) closeTrailer();
});
</script>

<script>
// FLM TV Firestick D-pad Navigation
(function() {
    var ua = navigator.userAgent || '';
    var isFirestick = /AFT|FireTV|Silk/i.test(ua);
    var isTV = (window.screen.width >= 1280 && window.screen.height >= 600 && window.screen.width <= 1920);
    if (!isFirestick && !isTV) return;

    document.body.style.zoom = '0.7';

    // Add focus styles
    var style = document.createElement('style');
    style.textContent = [
        '* { transition: transform 0.15s ease; }',
        ':focus { outline: 3px solid #fff !important; outline-offset: 2px !important; box-shadow: 0 0 20px rgba(255,255,255,0.5) !important; z-index: 9999 !important; }',
        'a:focus, button:focus, [tabindex]:focus { transform: scale(1.08) !important; }'
    ].join('');
    document.head.appendChild(style);

    function getAbsTop(el) { var t=0,n=el; while(n){t+=n.offsetTop||0;n=n.offsetParent;} return t; }
    function getAbsLeft(el) { var l=0,n=el; while(n){l+=n.offsetLeft||0;n=n.offsetParent;} return l; }

    function makeFocusable() {
        document.querySelectorAll('a[href], button, [onclick], .collection-card, .episode-card, .back-btn, .retry-btn').forEach(function(el) {
            if (!el.getAttribute('tabindex') && el.offsetParent !== null) {
                el.setAttribute('tabindex', '0');
            }
        });
    }
    setTimeout(makeFocusable, 500);
    setTimeout(makeFocusable, 2000);

    function buildRows() {
        var els = Array.from(document.querySelectorAll('[tabindex="0"], a[href], button')).filter(function(el) {
            return el.offsetParent !== null && el.offsetWidth > 0 && el.offsetHeight > 0;
        });
        els.sort(function(a,b){ return getAbsTop(a)-getAbsTop(b); });
        var rows = [];
        els.forEach(function(el) {
            var top = getAbsTop(el);
            for (var i=0; i<rows.length; i++) {
                if (Math.abs(top - getAbsTop(rows[i][0])) < 80) { rows[i].push(el); return; }
            }
            rows.push([el]);
        });
        rows.forEach(function(row) { row.sort(function(a,b){ return getAbsLeft(a)-getAbsLeft(b); }); });
        return rows;
    }

    document.addEventListener('keydown', function(e) {
        if (['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Enter',' ','Backspace','Escape'].indexOf(e.key) === -1) return;

        if (e.key === 'Backspace' || e.key === 'Escape') {
            if (document.activeElement.tagName !== 'INPUT') { e.preventDefault(); window.history.back(); }
            return;
        }

        var focused = document.activeElement;
        var rows = buildRows();
        if (!rows.length) return;

        if (!focused || focused === document.body) {
            rows[0][0].focus();
            e.preventDefault();
            return;
        }

        var pos = null;
        for (var r=0; r<rows.length; r++) {
            var c = rows[r].indexOf(focused);
            if (c !== -1) { pos = {row:r, col:c}; break; }
        }
        if (!pos) { rows[0][0].focus(); e.preventDefault(); return; }

        var next = null;
        var rr = pos.row, cc = pos.col;

        if (e.key === 'ArrowRight') {
            next = cc < rows[rr].length-1 ? rows[rr][cc+1] : null;
        } else if (e.key === 'ArrowLeft') {
            next = cc > 0 ? rows[rr][cc-1] : null;
        } else if (e.key === 'ArrowDown') {
            if (rr < rows.length-1) { var nr = rows[rr+1]; next = nr[Math.min(cc, nr.length-1)]; }
        } else if (e.key === 'ArrowUp') {
            if (rr > 0) { var pr = rows[rr-1]; next = pr[Math.min(cc, pr.length-1)]; }
        } else if (e.key === 'Enter' || e.key === ' ') {
            focused.click(); e.preventDefault(); return;
        }

        e.preventDefault();
        if (next && next !== focused) {
            next.focus();
            next.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    });

    // Focus first element
    setTimeout(function() {
        var first = document.querySelector('a[href], button, [tabindex="0"]');
        if (first) first.focus();
    }, 1000);
})();
</script>
