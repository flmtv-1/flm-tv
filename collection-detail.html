<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection - FLM TV</title>
    <style>
        :root {
            --primary: #ffd700;
            --secondary: #22c55e;
            --bg: #0a0f1a;
            --bg-light: #1a1f2e;
            --text: #ffffff;
            --text-secondary: #94a3b8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--primary);
            color: #000;
        }
        
        .header {
            background: var(--bg-light);
            padding: 6rem 2rem 2rem;
            border-bottom: 3px solid var(--primary);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .collection-title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .collection-count {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
        
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .item-card {
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .item-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }
        
        .item-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #1a1a1a;
        }
        
        .item-info {
            padding: 1rem;
        }
        
        .item-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .item-year {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .load-more-container {
            display: flex;
            justify-content: center;
            padding: 2rem 0;
        }
        
        .load-more-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 1rem 3rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .load-more-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.5);
        }
        
        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 9999;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            .collection-title { font-size: 2rem; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="history.back()">← Back</button>

<div id="loading"><div class="spinner"></div></div>

<div class="header">
    <div class="header-content">
        <h1 class="collection-title" id="collectionTitle">Loading...</h1>
        <div class="collection-count" id="collectionCount"></div>
    </div>
</div>

<div class="content">
    <div class="items-grid" id="itemsGrid"></div>
    <div class="load-more-container" id="loadMoreContainer" style="display:none;">
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load More</button>
    </div>
</div>

<script>
const CONFIG = {
    SERVER: 'https://flmtv.com/jellyfin',
    API_KEY: '62131ee22c0141c6b651be75a7444350',
    USER_ID: '0407d4609a0346f99c09e0d7ddc9ccd1'
};

const collectionId = new URLSearchParams(window.location.search).get('id');
const collectionName = new URLSearchParams(window.location.search).get('name');

const ITEMS_PER_PAGE = 25; // Load 25 items at a time
let currentIndex = 0;
let allItems = [];

// AUTHENTICATE FIRST
async function authenticate() {
    try {
        const response = await fetch(`${CONFIG.SERVER}/Users/AuthenticateByName`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Emby-Authorization': `MediaBrowser Client="FLM TV", Device="Web", DeviceId="flmtv-${Date.now()}", Version="1.0.0"`
            },
            body: JSON.stringify({
                Username: 'Public',
                Pw: ''
            })
        });
        
        if (response.ok) {
            const data = await response.json();
            CONFIG.ACCESS_TOKEN = data.AccessToken;
            CONFIG.USER_ID = data.User.Id;
            console.log('✅ Authenticated');
            return true;
        }
    } catch (error) {
        console.error('Auth error:', error);
    }
    return false;
}

function createItemCard(item) {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.onclick = () => {
        if (item.Type === 'Series') {
            window.location.href = `tv-detail.html?id=${item.Id}`;
        } else {
            window.location.href = `http://flmtv26.duckdns.org:8096/web/index.html#!/details?id=${item.Id}&serverId=db6bb6388c8c4c70825698639853ede6`;
        }
    };
    
    const posterUrl = item.ImageTags && item.ImageTags.Primary
        ? `${CONFIG.SERVER}/Items/${item.Id}/Images/Primary?api_key=${CONFIG.API_KEY}&tag=${item.ImageTags.Primary}&maxWidth=400`
        : '';
    
    card.innerHTML = `
        ${posterUrl ? `<img src="${posterUrl}" alt="${item.Name}" class="item-poster" loading="lazy" onerror="this.style.background='#1a1a1a'">` : '<div class="item-poster"></div>'}
        <div class="item-info">
            <div class="item-title">${item.Name}</div>
            ${item.ProductionYear ? `<div class="item-year">${item.ProductionYear}</div>` : ''}
        </div>
    `;
    
    return card;
}

function loadMore() {
    const itemsGrid = document.getElementById('itemsGrid');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Loading...';
    
    const endIndex = Math.min(currentIndex + ITEMS_PER_PAGE, allItems.length);
    const itemsToLoad = allItems.slice(currentIndex, endIndex);
    
    itemsToLoad.forEach(item => {
        itemsGrid.appendChild(createItemCard(item));
    });
    
    currentIndex = endIndex;
    
    // Hide Load More button if all items are loaded
    if (currentIndex >= allItems.length) {
        document.getElementById('loadMoreContainer').style.display = 'none';
    } else {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load More';
    }
}

async function loadCollection() {
    try {
        // Authenticate first
        await authenticate();
        
        const headers = {
            'X-Emby-Authorization': `MediaBrowser Client="FLM TV", Device="Web", DeviceId="flmtv-web", Version="1.0.0", Token="${CONFIG.ACCESS_TOKEN}"`
        };
        
        // Set collection name if provided
        if (collectionName) {
            document.getElementById('collectionTitle').textContent = decodeURIComponent(collectionName);
        }
        
        // Load ALL items in collection
        const itemsUrl = `${CONFIG.SERVER}/Users/${CONFIG.USER_ID}/Items?ParentId=${collectionId}&Recursive=true&SortBy=SortName&Limit=1000`;
        console.log('Loading collection:', itemsUrl);
        
        const itemsRes = await fetch(itemsUrl, { headers });
        const itemsData = await itemsRes.json();
        
        console.log('Collection items:', itemsData);
        
        allItems = itemsData.Items || [];
        
        // Update count
        document.getElementById('collectionCount').textContent = `${allItems.length} items`;
        
        // If no name provided, try to get it from parent
        if (!collectionName && allItems.length > 0) {
            try {
                const parentUrl = `${CONFIG.SERVER}/Users/${CONFIG.USER_ID}/Items/${collectionId}`;
                const parentRes = await fetch(parentUrl, { headers });
                const parent = await parentRes.json();
                document.getElementById('collectionTitle').textContent = parent.Name || 'Collection';
            } catch (e) {
                document.getElementById('collectionTitle').textContent = 'Collection';
            }
        }
        
        document.getElementById('loading').style.display = 'none';
        
        if (allItems.length > 0) {
            // Load first batch
            loadMore();
            
            // Show Load More button if there are more items
            if (allItems.length > ITEMS_PER_PAGE) {
                document.getElementById('loadMoreContainer').style.display = 'flex';
            }
        } else {
            document.getElementById('itemsGrid').innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 2rem;">No items found in this collection</p>';
        }
        
    } catch (error) {
        console.error('Error loading collection:', error);
        alert('Error loading collection. Check console for details.');
        document.getElementById('loading').style.display = 'none';
    }
}

if (!collectionId) {
    alert('No collection ID provided');
    history.back();
} else {
    loadCollection();
}
</script>

</body>
</html>
