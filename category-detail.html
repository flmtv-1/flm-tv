<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLM TV – Category</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --green: #00A550;
    --red: #CE1126;
    --bg: #0a0a0a;
    --surface: #141414;
    --card: #1c1c1c;
    --text: #ffffff;
    --muted: #888;
    --header-h: 64px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: linear-gradient(180deg, rgba(10,10,10,0.98) 0%, rgba(10,10,10,0.85) 100%);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,215,0,0.15);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 100;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.35);
    color: var(--gold);
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }
  .back-btn:hover {
    background: rgba(255,215,0,0.2);
    border-color: var(--gold);
    transform: translateX(-2px);
  }
  .back-btn svg { width: 16px; height: 16px; }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 4px;
  }
  .logo-flag {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .logo-flag span {
    display: block;
    width: 28px;
    height: 4px;
    border-radius: 2px;
  }
  .logo-flag span:nth-child(1) { background: #0038A8; }
  .logo-flag span:nth-child(2) { background: #CE1126; }
  .logo-flag span:nth-child(3) { background: #FFD700; }

  .logo-text {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .logo-text .flm { color: var(--gold); }
  .logo-text .tv  { color: var(--green); }

  .page-title {
    margin-left: auto;
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── MAIN ── */
  main {
    padding-top: calc(var(--header-h) + 32px);
    padding-bottom: 60px;
    max-width: 1400px;
    margin: 0 auto;
    padding-left: 24px;
    padding-right: 24px;
  }

  .hero-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }
  .hero-bar h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .item-count {
    background: var(--green);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.5px;
  }

  /* ── GRID ── */
  .poster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }

  @media (max-width: 600px) {
    .poster-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  }

  /* ── CARD ── */
  .poster-card {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    background: var(--card);
    aspect-ratio: 2/3;
    transition: transform 0.25s, box-shadow 0.25s;
    text-decoration: none;
    display: block;
  }
  .poster-card:hover {
    transform: scale(1.04) translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 0 2px var(--gold);
    z-index: 2;
  }
  .poster-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s;
  }
  .poster-card .no-poster {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 12px;
  }
  .poster-card .no-poster svg { opacity: 0.4; }
  .poster-card .no-poster span { font-family: 'Source Sans 3', sans-serif; font-size: 11px; opacity: 0.7; }

  .poster-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    padding: 32px 10px 10px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .poster-card:hover .poster-overlay { opacity: 1; }

  .poster-title {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .poster-year {
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
  }
  .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    background: rgba(255,215,0,0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .poster-card:hover .play-badge { opacity: 1; }
  .play-badge svg { fill: #000; margin-left: 3px; }

  /* ── LOADING / EMPTY ── */
  .state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--muted);
    text-align: center;
    gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(255,215,0,0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-box p { font-size: 16px; }
  .state-box .sub { font-size: 13px; color: rgba(255,255,255,0.3); }
  .retry-btn {
    background: var(--gold);
    color: #000;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .retry-btn:hover { background: #ffe033; }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <a class="back-btn" href="home.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Home
  </a>

  <div class="logo-wrap">
    <div class="logo-flag">
      <span></span><span></span><span></span>
    </div>
    <div class="logo-text">
      <span class="flm">FLM</span> <span class="tv">TV</span>
    </div>
  </div>

  <div class="page-title" id="headerTitle">Browse</div>
</header>

<!-- ═══ MAIN ═══ -->
<main>
  <div class="hero-bar">
    <h1 id="collectionName">Loading…</h1>
    <span class="item-count" id="itemCount" style="display:none"></span>
  </div>

  <div id="gridContainer">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Loading content…</p>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
const CONFIG = {
  SERVER:  'https://flmtv.com/jellyfin',
  PLAYER:  'http://flmtv26.duckdns.org:8096',
  API_KEY: '62131ee22c0141c6b651be75a7444350',
  USER_ID: '2562494c1df24f8789cd0ad8a38a7bf4'
};

// ── Helpers ──
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const COLLECTION_ID   = params.get('id')   || '';
const COLLECTION_NAME = params.get('name') || 'Browse';

// ── Poster URL ──
function posterUrl(itemId) {
  return `${CONFIG.SERVER}/Items/${itemId}/Images/Primary?fillHeight=450&fillWidth=300&quality=90&api_key=${CONFIG.API_KEY}`;
}

// ── Fetch items in collection ──
async function loadItems() {
  if (!COLLECTION_ID) {
    showError('No collection specified.', false);
    return;
  }

  try {
    const url = `${CONFIG.SERVER}/Users/${CONFIG.USER_ID}/Items` +
      `?ParentId=${COLLECTION_ID}` +
      `&api_key=${CONFIG.API_KEY}` +
      `&Recursive=false` +
      `&SortBy=SortName` +
      `&SortOrder=Ascending` +
      `&ImageTypeLimit=1` +
      `&EnableImageTypes=Primary,Thumb` +
      `&Fields=PrimaryImageAspectRatio,ProductionYear,Type` +
      `&Limit=500`;

    const res = await fetch(url);
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    renderGrid(data.Items || []);
  } catch(err) {
    console.error('FLM TV load error:', err);
    showError(`Could not load items. (${err.message})`, true);
  }
}

// ── Render grid ──
function renderGrid(items) {
  const nameEl  = $('collectionName');
  const countEl = $('itemCount');
  const grid    = $('gridContainer');

  nameEl.textContent = COLLECTION_NAME;
  $('headerTitle').textContent = COLLECTION_NAME;
  document.title = `FLM TV – ${COLLECTION_NAME}`;

  if (items.length === 0) {
    showError('No content found in this category.', false);
    return;
  }

  countEl.textContent = `${items.length} titles`;
  countEl.style.display = 'inline-block';

  const html = items.map(item => {
    const hasPoster = item.ImageTags && item.ImageTags.Primary;
    const year = item.ProductionYear || '';
    const title = escHtml(item.Name || 'Untitled');
    // Send to FLM TV frame wrapper (keeps user on flmtv.com, shows Jellyfin detail inside)
    const catParams = `catId=${encodeURIComponent(COLLECTION_ID)}&catName=${encodeURIComponent(COLLECTION_NAME)}`;
    const detailUrl = `movie-frame.html?id=${item.Id}&name=${encodeURIComponent(item.Name||'')}&${catParams}`;

    return `
      <a class="poster-card" href="${detailUrl}">
        ${hasPoster
          ? `<img src="${posterUrl(item.Id)}" alt="${title}" loading="lazy" onerror="this.parentElement.querySelector('.no-poster')&&(this.style.display='none');this.insertAdjacentHTML('afterend','<div class=\\'no-poster\\'><svg width=\\'32\\' height=\\'32\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1\\'><rect x=\\'2\\' y=\\'3\\' width=\\'20\\' height=\\'14\\' rx=\\'2\\'/><path d=\\'M8 21h8M12 17v4\\'/></svg><span>${title}</span></div>')">`
          : `<div class="no-poster"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>${title}</span></div>`
        }
        <div class="poster-overlay">
          <div class="poster-title">${title}</div>
          ${year ? `<div class="poster-year">${year}</div>` : ''}
        </div>
        <div class="play-badge">
          <svg width="18" height="18" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
      </a>`;
  }).join('');

  grid.innerHTML = `<div class="poster-grid">${html}</div>`;
}

// ── Error state ──
function showError(msg, canRetry) {
  $('collectionName').textContent = COLLECTION_NAME;
  $('gridContainer').innerHTML = `
    <div class="state-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,215,0,0.4)" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p>${msg}</p>
      <span class="sub">Check network or server settings</span>
      ${canRetry ? '<button class="retry-btn" onclick="loadItems()">Try Again</button>' : ''}
    </div>`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
document.title = `FLM TV – ${COLLECTION_NAME}`;
$('collectionName').textContent = COLLECTION_NAME;
$('headerTitle').textContent = COLLECTION_NAME;
loadItems();
</script>
</body>
</html>
