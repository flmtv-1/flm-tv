<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category - FLM TV</title>
    <style>
        :root {
            --primary: #ffd700;
            --bg: #0a0f1a;
            --bg-light: #1a1f2e;
            --text: #ffffff;
            --text-secondary: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8); border: 2px solid var(--primary); color: var(--primary); padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; z-index: 1000; transition: all 0.3s; }
        .back-btn:hover { background: var(--primary); color: #000; }
        .header { background: var(--bg-light); padding: 6rem 2rem 2rem; border-bottom: 3px solid var(--primary); }
        .category-title { font-size: 3rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; }
        .category-count { font-size: 1.2rem; color: var(--text-secondary); }
        .content { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .item-card { background: var(--bg-light); border: 2px solid transparent; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s; }
        .item-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 8px 20px rgba(255,215,0,0.3); }
        .item-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1a1a1a; }
        .item-info { padding: 1rem; }
        .item-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.25rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-year { color: var(--text-secondary); font-size: 0.9rem; }
        .load-more-btn { display: block; margin: 2rem auto; background: var(--primary); color: #000; border: none; padding: 1rem 3rem; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .category-title { font-size: 2rem; } .items-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; } }
    </style>
</head>
<body>
<button class="back-btn" onclick="history.back()">← Back</button>
<div id="loading"><div class="spinner"></div></div>
<div class="header">
    <div style="max-width:1400px;margin:0 auto;">
        <h1 class="category-title" id="categoryTitle">Loading...</h1>
        <div class="category-count" id="categoryCount"></div>
    </div>
</div>
<div class="content">
    <div class="items-grid" id="itemsGrid"></div>
    <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="loadMore()">Load More</button>
</div>

<script>
const CONFIG = {
    SERVER: 'https://flmtv.com/jellyfin',
    API_KEY: '62131ee22c0141c6b651be75a7444350',
    USER_ID: '2562494c1df24f8789cd0ad8a38a7bf4',
    SERVER_ID: 'db6bb6388c8c4c70825698639853ede6',
    PLAYER: 'http://flmtv26.duckdns.org:8096'
};

const categoryId = new URLSearchParams(window.location.search).get('id');
const categoryName = new URLSearchParams(window.location.search).get('name');
const LIMIT = 24;
let startIndex = 0;
let total = 0;

async function apiGet(path) {
    const sep = path.includes('?') ? '&' : '?';
    const r = await fetch(`${CONFIG.SERVER}${path}${sep}api_key=${CONFIG.API_KEY}`);
    if (!r.ok) throw new Error(r.status);
    return r.json();
}

function createCard(item) {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.onclick = () => {
        if (item.Type === 'Series') {
            window.location.href = `tv-detail.html?id=${item.Id}`;
        } else {
            window.location.href = `${CONFIG.PLAYER}/web/index.html#!/details?id=${item.Id}&serverId=${CONFIG.SERVER_ID}&api_key=${CONFIG.API_KEY}`;
        }
    };
    const poster = item.ImageTags && item.ImageTags.Primary
        ? `${CONFIG.SERVER}/Items/${item.Id}/Images/Primary?api_key=${CONFIG.API_KEY}&tag=${item.ImageTags.Primary}&maxWidth=400`
        : 'https://placehold.co/180x270?text=No+Image';
    card.innerHTML = `
        <img src="${poster}" alt="${item.Name}" class="item-poster" loading="lazy" onerror="this.src='https://placehold.co/180x270?text=No+Image'">
        <div class="item-info">
            <div class="item-title">${item.Name}</div>
            ${item.ProductionYear ? `<div class="item-year">${item.ProductionYear}</div>` : ''}
        </div>`;
    return card;
}

async function loadMore() {
    document.getElementById('loadMoreBtn').textContent = 'Loading...';
    try {
        const data = await apiGet(`/Users/${CONFIG.USER_ID}/Items?ParentId=${categoryId}&Recursive=true&SortBy=SortName&StartIndex=${startIndex}&Limit=${LIMIT}&Fields=PrimaryImageAspectRatio`);
        const items = data.Items || [];
        const grid = document.getElementById('itemsGrid');
        items.forEach(item => grid.appendChild(createCard(item)));
        startIndex += items.length;
        document.getElementById('loadMoreBtn').style.display = startIndex < total ? 'block' : 'none';
        document.getElementById('loadMoreBtn').textContent = 'Load More';
    } catch(e) {
        console.error('Load more error:', e);
    }
}

async function init() {
    if (!categoryId) { history.back(); return; }
    if (categoryName) document.getElementById('categoryTitle').textContent = decodeURIComponent(categoryName);
    try {
        const data = await apiGet(`/Users/${CONFIG.USER_ID}/Items?ParentId=${categoryId}&Recursive=true&SortBy=SortName&StartIndex=0&Limit=${LIMIT}&Fields=PrimaryImageAspectRatio`);
        total = data.TotalRecordCount || 0;
        document.getElementById('categoryCount').textContent = `${total} items`;
        document.getElementById('loading').style.display = 'none';
        const items = data.Items || [];
        if (!items.length) {
            document.getElementById('itemsGrid').innerHTML = '<p style="color:var(--text-secondary);grid-column:1/-1;text-align:center;padding:2rem;">No items found</p>';
            return;
        }
        const grid = document.getElementById('itemsGrid');
        items.forEach(item => grid.appendChild(createCard(item)));
        startIndex = items.length;
        if (startIndex < total) document.getElementById('loadMoreBtn').style.display = 'block';
    } catch(e) {
        console.error('Init error:', e);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('itemsGrid').innerHTML = '<p style="color:#f87171;grid-column:1/-1;text-align:center;padding:2rem;">Error loading content. Please try again.</p>';
    }
}

init();
</script>
</body>
</html>
