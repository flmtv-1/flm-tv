<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLM TV - Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        /* SINGLE CUSTOM HEADER */
        .flm-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 2px solid #00ff88;
        }

        .flm-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .flm-logo img {
            height: 40px;
        }

        .flm-logo h1 {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #00ccff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        /* VIDEO PLAYER CONTAINER */
        .player-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* CUSTOM VIDEO CONTROLS */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-wrapper:hover .custom-controls {
            opacity: 1;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background: #00ff88;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .control-btn:hover {
            color: #00ff88;
            transform: scale(1.1);
        }

        .time-display {
            font-size: 14px;
            color: #fff;
            min-width: 100px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }

        .title-info {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }

        /* LOADING SPINNER */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .flm-header {
                height: 50px;
                padding: 0 10px;
            }

            .flm-logo h1 {
                font-size: 18px;
            }

            .back-btn {
                padding: 8px 15px;
                font-size: 12px;
            }

            .player-container {
                top: 50px;
            }

            .control-btn {
                font-size: 20px;
            }

            .volume-control {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- SINGLE CUSTOM HEADER -->
    <div class="flm-header">
        <div class="flm-logo">
            <h1>🎬 FLM TV</h1>
        </div>
        <div class="title-info" id="videoTitle">Loading...</div>
        <button class="back-btn" onclick="goBack()">← Back to Browse</button>
    </div>

    <!-- VIDEO PLAYER -->
    <div class="player-container">
        <div class="video-wrapper">
            <video id="videoPlayer" controls></video>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <!-- CUSTOM CONTROLS (overlay on hover) -->
            <div class="custom-controls">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-filled" id="progressFilled"></div>
                </div>
                <div class="controls-row">
                    <button class="control-btn" id="playPauseBtn">▶</button>
                    <button class="control-btn" id="rewindBtn">⏪</button>
                    <button class="control-btn" id="forwardBtn">⏩</button>
                    <span class="time-display">
                        <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                    </span>
                    <div class="volume-control">
                        <button class="control-btn" id="muteBtn">🔊</button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                    </div>
                    <button class="control-btn" id="fullscreenBtn" style="margin-left: auto;">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const JELLYFIN_URL = 'http://flmtv26.duckdns.org:9096'; // Your Jellyfin server
        const API_KEY = 'YOUR_API_KEY_HERE'; // Replace with your API key

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const itemName = urlParams.get('name') || 'Playing...';

        // DOM Elements
        const video = document.getElementById('videoPlayer');
        const loading = document.getElementById('loading');
        const videoTitle = document.getElementById('videoTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFilled = document.getElementById('progressFilled');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Set title
        videoTitle.textContent = decodeURIComponent(itemName);

        // Load and play video
        async function loadVideo() {
            if (!itemId) {
                alert('No video selected');
                return;
            }

            loading.style.display = 'block';

            try {
                // Get item info from Jellyfin
                const response = await fetch(`${JELLYFIN_URL}/Items/${itemId}?api_key=${API_KEY}`);
                const data = await response.json();
                
                videoTitle.textContent = data.Name || itemName;

                // Build direct stream URL
                const streamUrl = `${JELLYFIN_URL}/Videos/${itemId}/stream?static=true&api_key=${API_KEY}`;
                
                video.src = streamUrl;
                video.load();
                
                loading.style.display = 'none';
                
            } catch (error) {
                console.error('Error loading video:', error);
                loading.style.display = 'none';
                alert('Error loading video. Please try again.');
            }
        }

        // Play/Pause
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = '⏸';
            } else {
                video.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        // Update play button when video plays/pauses
        video.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
        });

        video.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
        });

        // Progress bar
        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progressFilled.style.width = percent + '%';
            currentTimeDisplay.textContent = formatTime(video.currentTime);
        });

        video.addEventListener('loadedmetadata', () => {
            durationDisplay.textContent = formatTime(video.duration);
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            video.currentTime = percent * video.duration;
        });

        // Rewind/Forward
        rewindBtn.addEventListener('click', () => {
            video.currentTime = Math.max(0, video.currentTime - 10);
        });

        forwardBtn.addEventListener('click', () => {
            video.currentTime = Math.min(video.duration, video.currentTime + 10);
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value / 100;
            updateMuteButton();
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            updateMuteButton();
        });

        function updateMuteButton() {
            if (video.muted || video.volume === 0) {
                muteBtn.textContent = '🔇';
            } else if (video.volume < 0.5) {
                muteBtn.textContent = '🔉';
            } else {
                muteBtn.textContent = '🔊';
            }
        }

        // Fullscreen
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                video.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // Format time
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Go back
        function goBack() {
            window.history.back();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    playPauseBtn.click();
                    break;
                case 'ArrowLeft':
                    rewindBtn.click();
                    break;
                case 'ArrowRight':
                    forwardBtn.click();
                    break;
                case 'f':
                    fullscreenBtn.click();
                    break;
                case 'm':
                    muteBtn.click();
                    break;
            }
        });

        // Auto-hide controls
        let hideControlsTimeout;
        const videoWrapper = document.querySelector('.video-wrapper');

        videoWrapper.addEventListener('mousemove', () => {
            clearTimeout(hideControlsTimeout);
            hideControlsTimeout = setTimeout(() => {
                if (!video.paused) {
                    document.querySelector('.custom-controls').style.opacity = '0';
                }
            }, 3000);
        });

        // Initialize
        loadVideo();
    </script>
</body>
</html>
