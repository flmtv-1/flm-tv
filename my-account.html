<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - FLM TV</title>
  <style>
    :root { --hdr: 50px; --gold: #ffd700; --green: #22c55e; --red: #dc2626; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at 20% 30%, rgba(34,197,94,0.10) 0%, transparent 45%),
                  radial-gradient(ellipse at 80% 70%, rgba(255,215,0,0.08) 0%, transparent 45%),
                  radial-gradient(ellipse at 50% 100%, rgba(80,40,140,0.15) 0%, transparent 60%),
                  #000;
      overflow: hidden;
      position: relative;
    }

    /* Twinkling starfield — pure CSS, no images to load */
    #flmStars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #flmStars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.6;
      animation: flmTwinkle 3s ease-in-out infinite;
    }
    @keyframes flmTwinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }

    #flmBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--hdr);
      background: rgba(0,0,0,0.92);
      border-bottom: 2px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      z-index: 99999;
    }

    .flm-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-front {
      background: var(--gold);
      color: #000;
    }

    .btn-front:hover { background: #ffe84d; }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-flag {
      display: flex;
      flex-direction: column;
      width: 14px;
      height: 20px;
      gap: 2px;
    }

    .logo-flag span {
      flex: 1;
      border-radius: 1px;
    }

    .logo-flag span:nth-child(1) { background: #0038a8; }
    .logo-flag span:nth-child(2) { background: var(--red); }
    .logo-flag span:nth-child(3) { background: var(--gold); }

    .logo-text { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .logo-text .flm { color: var(--gold); }
    .logo-text .tv  { color: var(--green); }

    .bar-spacer { flex: 1; }

    #jellyfinFrame {
      position: fixed;
      top: var(--hdr);
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - var(--hdr));
      border: none;
      background: #000;
      z-index: 5;
    }

    #flmBgArt {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .flm-bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 3s ease-in-out;
    }
    .flm-bg-slide.active {
      opacity: 0.22;
    }
    /* Extra darkening so the message text stays readable over the art */
    #flmBgArt::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.75) 100%);
    }

    #flmMsg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.1rem;
      text-align: center;
      padding: 2rem;
      z-index: 3;
      text-shadow: 0 0 20px rgba(255,215,0,0.35);
    }

    #flmShip {
      position: fixed;
      width: 46px;
      height: 46px;
      z-index: 2;
      opacity: 0.55;
      animation: flmDrift 22s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(34,197,94,0.6));
    }
    @keyframes flmDrift {
      0%   { top: 22%; left: -8%;  transform: rotate(8deg); }
      50%  { top: 60%; left: 55%;  transform: rotate(-4deg); }
      100% { top: 22%; left: 108%; transform: rotate(8deg); }
    }

    @media (max-width: 768px) {
      .flm-btn { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
      .logo-text { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="flmStars"></div>

<div id="flmBgArt">
  <div class="flm-bg-slide active" style="background-image:url('assets/images/Graphic_2_Billboard_FLM_3840x14407-Da_One.png');"></div>
  <div class="flm-bg-slide" style="background-image:url('assets/images/graphic_2-10-Da_One.png');"></div>
</div>

<svg id="flmShip" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#ffd700" stroke-width="2" stroke-linejoin="round">
    <path d="M32 6 L44 40 L32 34 L20 40 Z" fill="rgba(255,215,0,0.15)"/>
    <path d="M32 34 L32 54" stroke="#22c55e"/>
    <circle cx="32" cy="20" r="4" fill="rgba(34,197,94,0.4)" stroke="#22c55e"/>
  </g>
</svg>

<div id="flmBar">
  <a class="flm-btn btn-front" href="home.html" id="homeBtn">🏠 Home</a>
  <div class="logo-wrap">
    <div class="logo-flag"><span></span><span></span><span></span></div>
    <div class="logo-text"><span class="flm">FLM</span> <span class="tv">TV</span></div>
  </div>
  <div class="bar-spacer"></div>
</div>

<iframe id="jellyfinFrame" allowfullscreen="" allow="autoplay; fullscreen; picture-in-picture" title="FLM TV My Account" style="display:none;"></iframe>
<div id="flmMsg"></div>

<script>
// Crossfading background slideshow — cycles through however many
// .flm-bg-slide divs are present, so more images can be added later
// just by adding more divs, no JS changes needed.
(function() {
  const slides = document.querySelectorAll('.flm-bg-slide');
  if (slides.length < 2) return; // nothing to cycle
  let current = 0;
  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 7000);
})();
</script>

<script>
// Purely decorative starfield — generates random twinkling dots, no
// external assets, no dependency on anything else on the page.
(function() {
  const container = document.getElementById('flmStars');
  const count = 80;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('span');
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';
    star.style.width = star.style.height = (Math.random() < 0.15 ? 3 : 2) + 'px';
    container.appendChild(star);
  }
})();
</script>

<script>
const CONFIG = {
  SERVER: 'https://flmtv26.duckdns.org:8920'
};

// Same real-member check used by The Vault on movie pages — this page is
// just a direct shortcut to the same place, reachable from the home page
// header instead of requiring a click into a movie first.
const memberEmail = localStorage.getItem('flmtv_member_email');
let session = null;
try {
  const creds = JSON.parse(localStorage.getItem('jellyfin_credentials') || 'null');
  const server = creds && creds.Servers && creds.Servers[0];
  if (server && server.UserId && server.AccessToken) session = server;
} catch (e) {}

if (!memberEmail || !session) {
  document.getElementById('flmMsg').innerHTML =
    'Sign in (or sign up free) on Home to manage your profile.<br><br>' +
    '<a href="home.html" class="flm-btn btn-front" style="text-decoration:none;">Go to Home</a>';
} else {
  document.getElementById('jellyfinFrame').style.display = '';
  document.getElementById('jellyfinFrame').src =
    CONFIG.SERVER + '/web/index.html?flmuid=' + encodeURIComponent(session.UserId) +
    '&flmtok=' + encodeURIComponent(session.AccessToken) + '#/home';
}
</script>

</body></html>
