<div class="spinner"></div>
<script>
const API_KEY   = '62131ee22c0141c6b651be75a7444350';
const SERVER    = 'https://flmtv26.duckdns.org:8920';
const SERVER_ID = 'db6bb6388c8c4c70825698639853ede6';

const params  = new URLSearchParams(location.search);
const ITEM_ID = params.get('id') || '';

if (ITEM_ID) {
  window.location.replace(
