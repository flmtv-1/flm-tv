<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLM TV - Collection Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0f1a;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #ffd700;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo-text {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .back-btn {
            background: #22c55e;
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        
        .collection-header {
            padding: 2rem;
            background: linear-gradient(to bottom, rgba(26, 31, 46, 0.8), transparent);
        }
        
        .collection-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 0.5rem;
        }
        
        .collection-info {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        
        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .movie-card {
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
        }
        
        .movie-card:hover .play-overlay {
            opacity: 1;
        }
        
        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 8px;
            background: #1a1f2e;
        }
        
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 8px;
        }
        
        .play-icon {
            width: 60px;
            height: 60px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .movie-info {
            padding: 0.75rem 0.25rem;
        }
        
        .movie-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .movie-year {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a1f2e;
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Jellyfin Player Overlay */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        
        .player-overlay.active {
            display: flex;
        }
        
        .player-header {
            background: rgba(15, 23, 42, 0.95);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffd700;
        }
        
        .close-player {
            background: #ce1126;
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .close-player:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(206, 17, 38, 0.4);
        }
        
        #playerFrame {
            flex: 1;
            width: 100%;
            border: none;
        }
        
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
            
            .header {
                padding: 0.75rem 1rem;
            }
            
            .collection-title {
                font-size: 1.5rem;
            }
            
            .logo-text {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo-section">
            <button class="back-btn" onclick="goBack()" id="collBackBtn" tabindex="0">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>
        <div class="logo-text">FLM TV</div>
    </div>
    
    <!-- Collection Header -->
    <div class="collection-header">
        <h1 class="collection-title" id="collectionTitle">Loading...</h1>
        <div class="collection-info" id="collectionInfo">Loading collection...</div>
    </div>
    
    <!-- Content Grid -->
    <div class="content-grid" id="contentGrid">
        <div class="loading">
            <div class="spinner"></div>
            <div>Loading collection...</div>
        </div>
    </div>
    
    <!-- Jellyfin Player Overlay -->
    <div class="player-overlay" id="playerOverlay">
        <div class="player-header">
            <div class="logo-text">FLM TV</div>
            <button class="close-player" onclick="closePlayer()" id="collCloseBtn" tabindex="0">
                <i class="fas fa-times"></i> Close Player
            </button>
        </div>
        <iframe id="playerFrame" allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>
    
    <script>
        // JELLYFIN CONFIG
        const JELLYFIN_CONFIG = {
            SERVER: 'https://flmtv.com/jellyfin',
            API_KEY: '62131ee22c0141c6b651be75a7444350',
            USER_ID: '2562494c1df24f8789cd0ad8a38a7bf4'
        };
        
        // Get collection ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const collectionId = urlParams.get('id');
        const collectionName = urlParams.get('name') || 'Collection';
        
        async function loadCollection() {
            if (!collectionId) {
                document.getElementById('contentGrid').innerHTML = 
                    '<div class="loading">No collection specified</div>';
                return;
            }
            
            try {
                // Fetch collection items
                const response = await fetch(
                    `${JELLYFIN_CONFIG.SERVER}/Users/${JELLYFIN_CONFIG.USER_ID}/Items?ParentId=${collectionId}&Recursive=true&IncludeItemTypes=Movie,Series,Episode&api_key=${JELLYFIN_CONFIG.API_KEY}`
                );
                const data = await response.json();
                
                // Update header
                document.getElementById('collectionTitle').textContent = collectionName;
                document.getElementById('collectionInfo').textContent = 
                    `${data.Items?.length || 0} items`;
                
                // Render items
                const grid = document.getElementById('contentGrid');
                grid.innerHTML = '';
                
                if (data.Items && data.Items.length > 0) {
                    data.Items.forEach(item => {
                        const card = createMovieCard(item);
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="loading">No items in this collection</div>';
                }
                
            } catch (error) {
                console.error('Error loading collection:', error);
                document.getElementById('contentGrid').innerHTML = 
                    '<div class="loading">Error loading collection</div>';
            }
        }
        
        function createMovieCard(item) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => { window.location.href = 'movie-frame.html?id=' + item.Id; };
            
            const imageUrl = item.ImageTags?.Primary
                ? `${JELLYFIN_CONFIG.SERVER}/Items/${item.Id}/Images/Primary?api_key=${JELLYFIN_CONFIG.API_KEY}&tag=${item.ImageTags.Primary}&maxHeight=450`
                : 'https://placehold.co/200x300?text=No+Image';
            
            card.innerHTML = `
                <div style="position: relative;">
                    <img src="${imageUrl}" alt="${item.Name}" class="movie-poster" loading="lazy">
                    <div class="play-overlay">
                        <div class="play-icon">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">${item.Name}</div>
                    <div class="movie-year">
                        ${item.ProductionYear || ''} 
                        ${item.OfficialRating ? '• ' + item.OfficialRating : ''}
                    </div>
                </div>
            `;
            
            return card;
        }
        
        function playInJellyfin(itemId, itemName) {
            console.log('🎬 Opening Jellyfin player for:', itemName);
            
            const overlay = document.getElementById('playerOverlay');
            const frame = document.getElementById('playerFrame');
            
            // Use Jellyfin's native player - this ALWAYS works!
            const playerUrl = `${JELLYFIN_CONFIG.SERVER}/web/index.html#/details?id=${itemId}&serverId=db6bb6388c8c4c70825698639853ede6`;
            
            frame.src = playerUrl;
            overlay.classList.add('active');
            
            // Add to browser history for back button
            history.pushState({modal: 'player'}, '', '#playing');
        }
        
        function closePlayer() {
            const overlay = document.getElementById('playerOverlay');
            const frame = document.getElementById('playerFrame');
            
            frame.src = '';
            overlay.classList.remove('active');
            
            if (window.location.hash === '#playing') {
                history.back();
            }
        }
        
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'home.html';
            }
        }
        
        // Handle browser back button
        window.addEventListener('popstate', function(event) {
            const overlay = document.getElementById('playerOverlay');
            if (overlay.classList.contains('active')) {
                closePlayer();
            }
        });
        
        // Load collection on page load
        loadCollection();
    </script>

<script>
// ── FLM TV: Firestick D-pad navigation for Collection Browser ──────────
(function() {
    var ua = navigator.userAgent || '';
    if (!/AFT|FireTV|Silk/i.test(ua)) return;

    console.log('📺 FLM TV: collection-browser Firestick nav active');

    // ── Fix viewport for 960px CSS viewport ──
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute('content', 'width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');

    // ── Inject Firestick CSS ──
    var style = document.createElement('style');
    style.textContent = \`
        /* Header compact */
        .header { padding: 0.5rem 1rem !important; }
        .logo-text { font-size: 1.4rem !important; }
        .back-btn { padding: 0.4rem 0.9rem !important; font-size: 0.82rem !important; }

        /* Grid: 5 columns on 960px Firestick */
        .content-grid {
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 0.75rem !important;
            padding: 0.75rem 1rem !important;
        }

        /* Collection header smaller */
        .collection-header { padding: 0.75rem 1rem !important; }
        .collection-title { font-size: 1.6rem !important; }
        .collection-info { font-size: 0.9rem !important; }

        /* Hide scrollbars */
        body::-webkit-scrollbar { display: none !important; }
        body { scrollbar-width: none !important; }

        /* Gold focus ring for all focusable elements */
        .movie-card:focus,
        .back-btn:focus,
        .close-player:focus {
            outline: 4px solid #ffd700 !important;
            outline-offset: 3px !important;
            box-shadow: 0 0 0 6px rgba(255,215,0,0.35),
                        0 0 25px rgba(255,215,0,0.6) !important;
            transform: scale(1.1) !important;
            z-index: 99 !important;
            position: relative !important;
        }

        /* Show play overlay when card is focused */
        .movie-card:focus .play-overlay { opacity: 1 !important; }
    \`;
    document.head.appendChild(style);

    // ── Make movie cards keyboard-focusable ──
    function makeCardsFocusable() {
        document.querySelectorAll('.movie-card').forEach(function(card) {
            if (!card.getAttribute('tabindex')) {
                card.setAttribute('tabindex', '0');
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        card.click();
                    }
                });
            }
        });
    }

    // Run now + watch for dynamically added cards
    makeCardsFocusable();
    new MutationObserver(makeCardsFocusable).observe(document.body, { childList: true, subtree: true });

    // ── Spatial navigation helpers ──
    function getFocusable() {
        var selector = '.movie-card, #collBackBtn, #collCloseBtn, .back-btn, .close-player';
        // If player overlay is open, restrict to close button only
        var overlay = document.getElementById('playerOverlay');
        if (overlay && overlay.classList.contains('active')) {
            selector = '#collCloseBtn, .close-player';
        }
        return Array.from(document.querySelectorAll(selector)).filter(function(el) {
            return el.offsetParent !== null && el.offsetWidth > 0 && el.offsetHeight > 0;
        });
    }

    function findBest(cur, all, dir) {
        var cr = cur.getBoundingClientRect();
        var cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
        var cands = all.filter(function(el) {
            if (el === cur) return false;
            var r = el.getBoundingClientRect();
            var ex = r.left + r.width / 2, ey = r.top + r.height / 2;
            if (dir === 'right') return ex > cr.right - 5;
            if (dir === 'left')  return ex < cr.left + 5;
            if (dir === 'down')  return ey > cr.bottom - 5;
            if (dir === 'up')    return ey < cr.top + 5;
        });
        if (!cands.length) return null;
        var best = null, bs = Infinity;
        cands.forEach(function(el) {
            var r = el.getBoundingClientRect();
            var dx = (r.left + r.width / 2) - cx;
            var dy = (r.top + r.height / 2) - cy;
            var primary = (dir === 'right' || dir === 'left') ? Math.abs(dx) : Math.abs(dy);
            var secondary = (dir === 'right' || dir === 'left') ? Math.abs(dy) : Math.abs(dx);
            var score = primary + secondary * 0.3;
            if (score < bs) { bs = score; best = el; }
        });
        return best;
    }

    // ── Keydown handler ──
    document.addEventListener('keydown', function(e) {
        // Backspace/Escape = smart back (or close player if open)
        if (e.key === 'Backspace' || e.key === 'Escape') {
            e.preventDefault();
            var overlay = document.getElementById('playerOverlay');
            if (overlay && overlay.classList.contains('active')) {
                if (typeof closePlayer === 'function') closePlayer();
            } else {
                if (window.history.length > 1) window.history.back();
                else window.location.href = 'home.html';
            }
            return;
        }

        var all = getFocusable();
        if (!all.length) return;

        var focused = document.activeElement;
        var inList = all.indexOf(focused) >= 0;

        // No focus — grab first element on any arrow key
        if (!inList) {
            if (['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter'].includes(e.key)) {
                e.preventDefault();
                var first = document.getElementById('collBackBtn') || all[0];
                first.focus();
                first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
        }

        var dir = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' }[e.key];
        if (dir) {
            e.preventDefault();
            var next = findBest(focused, all, dir);
            if (next) {
                next.focus();
                next.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (dir === 'up') {
                // Hit top — go to back button
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(function() {
                    var btn = document.getElementById('collBackBtn') || all[0];
                    if (btn) { btn.focus(); }
                }, 350);
            }
            return;
        }

        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (focused.tagName === 'A' && focused.href) {
                window.location.href = focused.href;
            } else {
                focused.click();
            }
        }
    }, true);

    // ── Auto-focus Back button on load ──
    window.addEventListener('load', function() {
        setTimeout(function() {
            makeCardsFocusable();
            var btn = document.getElementById('collBackBtn');
            if (btn) btn.focus();
        }, 800);
    });
})();
</script>

</body>
</html>
