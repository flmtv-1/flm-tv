<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" id="flmViewportMeta">
<script>
  if (/AFT|FireTV|Silk/i.test(navigator.userAgent)) {
    var flmVp = document.getElementById('flmViewportMeta');
    if (flmVp) flmVp.setAttribute('content', 'width=960, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
  }
</script>
<title>Las Vegas Tonight TV with Dale Davidson — FLM TV Network</title>
<link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --red: #C0272D;
  --black: #07070A;
  --dark: #0E0E13;
  --dark2: #14141A;
  --dark3: #1C1C24;
  --text: #F0EDE8;
  --text-dim: #888898;
  --text-muted: #444450;
  --green: #22c55e;
}

html, body {
  min-height: 100%;
  background: var(--black);
  color: var(--text);
  font-family: 'Arial', sans-serif;
}

/* ── TOP NAV ── */
.topnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: rgba(7,7,10,0.98);
  border-bottom: 2px solid var(--gold);
  position: sticky; top: 0; z-index: 100;
}
.nav-left { display:flex; align-items:center; gap:16px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  background: rgba(201,168,76,0.1);
  border: 1px solid var(--gold);
  border-radius: 4px;
  color: var(--gold);
  font-size: 12px; font-weight: 700;
  text-decoration: none; letter-spacing: 1px;
  transition: all 0.2s;
}
.back-btn:hover { background: var(--gold); color: #000; }
.nav-logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
.nav-logo .lv { color: var(--red); }
.nav-logo .tonight { color: var(--gold); }

.container { max-width: 1300px; margin: 0 auto; padding: 2rem 2rem 4rem; }

/* ── HERO TV CARD ── */
.hero-card {
  position: relative;
  display: block;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(201,168,76,0.4);
  text-decoration: none;
  color: inherit;
  aspect-ratio: 21/9;
  background: #000;
  transition: border-color 0.25s, transform 0.25s;
}
.hero-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.hero-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.5;
  filter: grayscale(15%);
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(5,5,8,0.95) 30%, rgba(5,5,8,0.55) 70%, rgba(5,5,8,0.25) 100%);
}
.hero-content {
  position: relative; z-index: 2;
  height: 100%;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 2.5rem 3rem;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--red);
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 800; letter-spacing: 2px;
  width: fit-content; margin-bottom: 1rem;
}
.hero-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hero-title { font-family:'Bebas Neue',sans-serif; font-size: 3rem; letter-spacing: 2px; line-height: 1; }
.hero-title .lv { color: var(--red); }
.hero-title .tonight { color: var(--gold); }
.hero-sub { font-size: 1rem; color: var(--text-dim); letter-spacing: 1px; margin-top: 0.5rem; }
.hero-cta {
  margin-top: 1.75rem;
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--gold); color: #000;
  padding: 0.8rem 1.8rem; border-radius: 6px;
  font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px;
  width: fit-content;
}
.hero-card:hover .hero-cta { background: var(--gold-light); }

@media (max-width: 768px) {
  .hero-card { aspect-ratio: 4/5; }
  .hero-content { padding: 1.5rem; }
  .hero-title { font-size: 2.1rem; }
}

/* ── SHOW GRID ── */
.section-heading {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.9rem; letter-spacing: 1px;
  color: var(--gold);
  margin: 3rem 0 1.25rem;
}
.show-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px,1fr));
  gap: 1.25rem;
}
.show-card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: var(--dark2);
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
  text-decoration: none; color: inherit;
  transition: transform 0.2s, border-color 0.2s;
}
.show-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.show-cover { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
.show-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.show-live-badge {
  position: absolute; top: 8px; left: 8px;
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,0.6); padding: 3px 9px; border-radius: 12px; z-index: 2;
}
.show-live-badge span.dot { width:7px; height:7px; border-radius:50%; background:#E8333A; animation: blink 1.2s infinite; }
.show-live-badge span.txt { font-size: 0.7rem; font-weight: 800; color:#E8333A; letter-spacing: 1px; }
.show-info { padding: 0.85rem 1rem; }
.show-name { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.3; }
.show-host { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.25rem; }

.show-card.add-more {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-style: dashed; color: var(--text-dim);
  padding: 2rem 1rem; text-align: center; cursor: default;
}
.show-card.add-more:hover { transform: none; border-color: rgba(255,255,255,0.08); }
.show-card.add-more i { font-size: 1.6rem; margin-bottom: 0.6rem; color: var(--gold); opacity: 0.6; }
.show-card.add-more span { font-size: 0.75rem; letter-spacing: 0.05em; }

/* Fire TV focus */
.back-btn:focus, .hero-card:focus, .show-card:focus {
  outline: 4px solid #ffd700 !important;
  outline-offset: 3px !important;
  transform: scale(1.03);
  z-index: 10; position: relative;
}
</style>
</head>
<body>

  <nav class="topnav">
    <div class="nav-left">
      <a href="home.html" class="back-btn">← Home</a>
      <div class="nav-logo"><span class="lv">LAS VEGAS</span> <span class="tonight">TONIGHT</span></div>
    </div>
  </nav>

  <div class="container">

    <a href="dale-live.html" class="hero-card" id="heroCard" tabindex="0">
      <img src="assets/images/DaleLogo.jpg" alt="Las Vegas Tonight TV with Dale Davidson" class="hero-bg">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-badge"><span class="hero-dot"></span> LIVE</div>
        <div class="hero-title"><span class="lv">LAS VEGAS</span> <span class="tonight">TONIGHT</span></div>
        <div class="hero-sub">with Dale Davidson · Presented by FLM TV · Channel 26.5 Las Vegas</div>
        <div class="hero-cta"><i class="fas fa-play"></i> Watch Live</div>
      </div>
    </a>

    <h2 class="section-heading">On This Channel</h2>
    <div class="show-grid" id="showGrid"></div>

  </div>

<script>
  // ── DALE'S SHOWS ──────────────────────────────────────────────
  // Add a new show any time by adding an entry here — no other
  // code changes needed. Point `url` at that show's own stream/
  // playback page once it has one; until then it can point at
  // dale-live.html or be left out of the array.
  const DALE_SHOWS = [
    {
      name: 'Las Vegas Tonight',
      host: 'with Dale Davidson',
      image: 'assets/images/DaleLogo.jpg',
      url: 'dale-live.html',
      live: true
    }
  ];

  const grid = document.getElementById('showGrid');

  DALE_SHOWS.forEach(show => {
    const card = document.createElement('a');
    card.className = 'show-card';
    card.href = show.url;
    card.setAttribute('tabindex', '0');
    card.innerHTML = `
      ${show.live ? `<div class="show-live-badge"><span class="dot"></span><span class="txt">LIVE</span></div>` : ''}
      <div class="show-cover"><img src="${show.image}" alt="${show.name}" loading="lazy"></div>
      <div class="show-info">
        <div class="show-name">${show.name}</div>
        <div class="show-host">${show.host}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  const addMore = document.createElement('div');
  addMore.className = 'show-card add-more';
  addMore.innerHTML = `<i class="fas fa-plus"></i><span>More shows coming soon</span>`;
  grid.appendChild(addMore);
</script>

<script>
// ── FIRESTICK D-PAD NAVIGATION ──────────────────────────────
(function() {
  if (!/AFT|FireTV|Silk/i.test(navigator.userAgent)) return;

  function getFocusable() {
    return Array.from(document.querySelectorAll('.back-btn, .hero-card, .show-card'))
      .filter(el => el.offsetParent !== null && el.offsetWidth > 0);
  }
  function findBest(cur, all, dir) {
    const cr = cur.getBoundingClientRect();
    const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    const cands = all.filter(el => {
      if (el === cur) return false;
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      if (dir === 'right') return ex > cr.right - 10;
      if (dir === 'left')  return ex < cr.left + 10;
      if (dir === 'down')  return ey > cr.bottom - 10;
      if (dir === 'up')    return ey < cr.top + 10;
    });
    if (!cands.length) return null;
    let best = null, bestScore = Infinity;
    cands.forEach(el => {
      const r = el.getBoundingClientRect();
      const dx = (r.left + r.width / 2) - cx, dy = (r.top + r.height / 2) - cy;
      const primary = (dir === 'right' || dir === 'left') ? Math.abs(dx) : Math.abs(dy);
      const secondary = (dir === 'right' || dir === 'left') ? Math.abs(dy) : Math.abs(dx);
      const score = primary + secondary * 0.3;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    return best;
  }

  document.addEventListener('keydown', function(e) {
    const all = getFocusable();
    if (!all.length) return;
    const focused = document.activeElement;
    const inList = all.indexOf(focused) >= 0;

    if (!inList) {
      if (['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter'].includes(e.key)) {
        e.preventDefault();
        all[0].focus();
        all[0].scrollIntoView({ block: 'center' });
      }
      return;
    }

    const dir = { ArrowRight:'right', ArrowLeft:'left', ArrowDown:'down', ArrowUp:'up' }[e.key];
    if (dir) {
      e.preventDefault();
      const next = findBest(focused, all, dir);
      if (next) { next.focus(); next.scrollIntoView({ behavior:'smooth', block:'center' }); }
      else if (dir === 'up') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => document.querySelector('.back-btn').focus(), 400);
      }
    }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focused.click(); }
    if (e.key === 'Backspace' || e.key === 'Escape') { e.preventDefault(); window.location.href = 'home.html'; }
  }, true);
})();
</script>

</body>
</html>
