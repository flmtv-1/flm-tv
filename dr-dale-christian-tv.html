<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --red: #C0272D;
  --black: #07070A;
  --dark: #0E0E13;
  --dark2: #14141A;
  --dark3: #1C1C24;
  --text: #F0EDE8;
  --text-dim: #888898;
  --text-muted: #444450;
  --green: #22c55e;
}

html, body {
  min-height: 100%;
  background: var(--black);
  color: var(--text);
  font-family: 'Arial', sans-serif;
}

/* ── TOP NAV ── */
.topnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: rgba(7,7,10,0.98);
  border-bottom: 2px solid var(--gold);
  position: sticky; top: 0; z-index: 100;
}
.nav-left { display:flex; align-items:center; gap:16px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  background: rgba(201,168,76,0.1);
  border: 1px solid var(--gold);
  border-radius: 4px;
  color: var(--gold);
  font-size: 12px; font-weight: 700;
  text-decoration: none; letter-spacing: 1px;
  transition: all 0.2s;
}
.back-btn:hover { background: var(--gold); color: #000; }
.nav-logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
.nav-logo .lv { color: var(--red); }
.nav-logo .tonight { color: var(--gold); }

.container { max-width: 1300px; margin: 0 auto; padding: 2rem 2rem 4rem; }

/* ── HERO TV CARD ── */
.hero-card {
  position: relative;
  display: block;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(201,168,76,0.4);
  text-decoration: none;
  color: inherit;
  aspect-ratio: 21/9;
  background: #000;
  transition: border-color 0.25s, transform 0.25s;
}
.hero-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.hero-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.5;
  filter: grayscale(15%);
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(5,5,8,0.95) 30%, rgba(5,5,8,0.55) 70%, rgba(5,5,8,0.25) 100%);
}
.hero-content {
  position: relative; z-index: 2;
  height: 100%;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 2.5rem 3rem;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--red);
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 800; letter-spacing: 2px;
  width: fit-content; margin-bottom: 1rem;
}
.hero-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hero-title { font-family:'Bebas Neue',sans-serif; font-size: 3rem; letter-spacing: 2px; line-height: 1; }
.hero-title .lv { color: var(--red); }
.hero-title .tonight { color: var(--gold); }
.hero-sub { font-size: 1rem; color: var(--text-dim); letter-spacing: 1px; margin-top: 0.5rem; }
.hero-cta {
  margin-top: 1.75rem;
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--gold); color: #000;
  padding: 0.8rem 1.8rem; border-radius: 6px;
  font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px;
  width: fit-content;
}
.hero-card:hover .hero-cta { background: var(--gold-light); }

@media (max-width: 768px) {
  .hero-card { aspect-ratio: 4/5; }
  .hero-content { padding: 1.5rem; }
  .hero-title { font-size: 2.1rem; }
}

/* ── SHOW GRID ── */
.section-heading {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.9rem; letter-spacing: 1px;
  color: var(--gold);
  margin: 3rem 0 1.25rem;
}
.show-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px,1fr));
  gap: 1.25rem;
}
.show-card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: var(--dark2);
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
  text-decoration: none; color: inherit;
  transition: transform 0.2s, border-color 0.2s;
}
.show-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.show-cover { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
.show-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.show-live-badge {
  position: absolute; top: 8px; left: 8px;
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,0.6); padding: 3px 9px; border-radius: 12px; z-index: 2;
}
.show-live-badge span.dot { width:7px; height:7px; border-radius:50%; background:#E8333A; animation: blink 1.2s infinite; }
.show-live-badge span.txt { font-size: 0.7rem; font-weight: 800; color:#E8333A; letter-spacing: 1px; }
.show-info { padding: 0.85rem 1rem; }
.show-name { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.3; }
.show-host { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.25rem; }

.show-card.add-more {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-style: dashed; color: var(--text-dim);
  padding: 2rem 1rem; text-align: center; cursor: default;
}
.show-card.add-more:hover { transform: none; border-color: rgba(255,255,255,0.08); }
.show-card.add-more i { font-size: 1.6rem; margin-bottom: 0.6rem; color: var(--gold); opacity: 0.6; }
.show-card.add-more span { font-size: 0.75rem; letter-spacing: 0.05em; }

.show-card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.show-count { font-size: 0.7rem; color: var(--gold); margin-top: 0.3rem; letter-spacing: 0.05em; }

/* ── EPISODES ── */
.ep-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
  margin: 3rem 0 1.25rem;
}
.ep-header .section-heading { margin: 0; }
.ep-tools { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.ep-search {
  background: var(--dark2);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  color: var(--text);
  padding: 0.55rem 0.9rem;
  font-size: 0.85rem;
  width: 230px; max-width: 100%;
}
.ep-search:focus { outline: none; border-color: var(--gold); }
.ep-search::placeholder { color: var(--text-dim); }
.sort-btn {
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.5);
  border-radius: 6px;
  color: var(--gold);
  padding: 0.55rem 0.9rem;
  font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
  cursor: pointer;
}
.sort-btn:hover { background: var(--gold); color: #000; }
.ep-status { color: var(--text-dim); font-size: 0.9rem; padding: 2rem 0; text-align: center; }
.ep-status .spin {
  display: inline-block; width: 18px; height: 18px; margin-right: 10px; vertical-align: -4px;
  border: 2px solid rgba(201,168,76,0.25); border-top-color: var(--gold);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ep-status button { margin-top: 1rem; }

.ep-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
  gap: 1.25rem;
}
.ep-card {
  display: block;
  border-radius: 8px;
  overflow: hidden;
  background: var(--dark2);
  border: 1px solid rgba(255,255,255,0.08);
  text-decoration: none; color: inherit;
  transition: transform 0.2s, border-color 0.2s;
}
.ep-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.ep-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
.ep-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ep-thumb img.logo-fallback { object-fit: contain; }
.ep-num {
  position: absolute; top: 8px; left: 8px;
  background: rgba(0,0,0,0.75);
  border: 1px solid rgba(201,168,76,0.6);
  color: var(--gold);
  font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 1px;
  padding: 1px 8px; border-radius: 4px;
}
.ep-time {
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,0.75); color: #fff;
  font-size: 0.7rem; padding: 2px 6px; border-radius: 3px;
}
.ep-play {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.35);
  opacity: 0; transition: opacity 0.2s;
  font-size: 2rem; color: var(--gold);
}
.ep-card:hover .ep-play, .ep-card:focus .ep-play { opacity: 1; }
.ep-info { padding: 0.75rem 0.9rem 0.9rem; }
.ep-guest { font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
.ep-sub { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.25rem; }

@media (max-width: 768px) {
  .container { padding: 1.25rem 1rem 3rem; }
  .ep-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 0.85rem; }
  .ep-search { width: 100%; }
  .ep-tools { width: 100%; }
}

/* Fire TV focus */
.ep-card:focus, .sort-btn:focus, .ep-search:focus {
  outline: 4px solid #ffd700 !important;
  outline-offset: 3px !important;
}
.ep-card:focus { transform: scale(1.03); position: relative; z-index: 10; }
.back-btn:focus, .hero-card:focus, .show-card:focus {
  outline: 4px solid #ffd700 !important;
  outline-offset: 3px !important;
  transform: scale(1.03);
  z-index: 10; position: relative;
}
</style>

<script>
  // Faded live preview in the hero banner — same stream as the "Watch Live"
  // button leads to. Falls back to DaleLogo.jpg automatically if the stream
  // can't load. Swap/remove this once dedicated show artwork/clips are ready.
  (function() {
    const vid = document.getElementById('heroVideo');
    const fallback = document.getElementById('heroFallback');
    const url = 'https://streams.vegasplus.us:8443/stream/vegastonight/playlist.m3u8';

    function showFallback() {
      vid.style.display = 'none';
      if (fallback) fallback.style.display = 'block';
    }

    function showVideo() {
      vid.style.display = 'block';
      if (fallback) fallback.style.display = 'none';
    }

    function init() {
      vid.muted = true; vid.volume = 0; vid.defaultMuted = true;
      vid.addEventListener('playing', showVideo, { once: true });
      if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        const h = new Hls();
        h.loadSource(url);
        h.attachMedia(vid);
        h.on(Hls.Events.MANIFEST_PARSED, () => { vid.muted = true; vid.play().catch(() => {}); });
        h.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) showFallback(); });
      } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
        vid.src = url;
        vid.play().catch(() => {});
        vid.addEventListener('error', showFallback);
      } else {
        showFallback();
      }
    }
    if (typeof Hls !== 'undefined') { init(); } else { window.addEventListener('load', init); }
  })();
</script>

<script>
  // ── DALE'S SHOWS + EPISODES (pulled live from Jellyfin) ─────────
  // Shows and episodes come straight from the Jellyfin library that
  // points at V:\DR. DALE. New episodes appear after a library scan,
  // and any new show folder Dale adds next to "Las Vegas Tonight"
  // gets its own card automatically — no edits to this page needed.
  // Same server/key as home.html; episodes open in movie-frame.html.
  const JELLYFIN = {
    SERVER:  'https://flmtv.com/jellyfin',
    API_KEY: '62131ee22c0141c6b651be75a7444350'
  };

  // Known show(s). Used to find the library and as a fallback list
  // if the library lookup fails. Las Vegas Tonight is shown first.
  const DALE_SERIES = [
    { id: '214f0f8dfbfd1a8123455417bbd9c8a4', name: 'Las Vegas Tonight' }
  ];
  const HOST_LINE = 'with Dale Davidson';
  const FALLBACK_IMG = 'assets/images/DaleLogo.jpg';

  const showGrid  = document.getElementById('showGrid');
  const epGrid    = document.getElementById('epGrid');
  const epStatus  = document.getElementById('epStatus');
  const epHeading = document.getElementById('epHeading');
  const epSearch  = document.getElementById('epSearch');
  const sortBtn   = document.getElementById('sortBtn');

  let seriesList = [];
  let currentSeries = null;
  let episodes = [];
  let newestFirst = true;
  let loadToken = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  async function jf(endpoint, params = {}, isRetry = false) {
    const q = new URLSearchParams({ api_key: JELLYFIN.API_KEY });
    Object.keys(params).forEach(k => { if (params[k] != null) q.append(k, params[k]); });
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 12000);
    try {
      const r = await fetch(`${JELLYFIN.SERVER}${endpoint}?${q}`, {
        mode: 'cors', credentials: 'omit',
        headers: { 'Accept': 'application/json' },
        signal: controller.signal
      });
      clearTimeout(t);
      if (!r.ok) return null;
      return await r.json();
    } catch (e) {
      clearTimeout(t);
      if (!isRetry) return jf(endpoint, params, true);
      return null;
    }
  }

  function img(itemId, tag, w) {
    return `${JELLYFIN.SERVER}/Items/${itemId}/Images/Primary?api_key=${JELLYFIN.API_KEY}` +
           (tag ? `&tag=${tag}` : '') + `&fillWidth=${w}&quality=85&format=webp`;
  }

  // "Las Vegas Tonight - S01E300 - Pete Allman" -> "Pete Allman"
  function guestName(ep) {
    const n = (ep.Name || '').replace(/^.*?S\d+\s*E\d+\s*-\s*/i, '').trim();
    return n || (ep.Name || 'Episode');
  }

  function minutes(ticks) {
    if (!ticks) return '';
    const m = Math.round(ticks / 600000000);
    return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m} min`;
  }

  // ── Shows ──
  async function loadSeries() {
    let list = null;
    // Find the library folder the known show lives in, then list every show in it
    const known = await jf('/Items', { Ids: DALE_SERIES[0].id, Fields: 'ParentId' });
    const parentId = known && known.Items && known.Items[0] && known.Items[0].ParentId;
    if (parentId) {
      const res = await jf('/Items', {
        ParentId: parentId, IncludeItemTypes: 'Series', Recursive: 'true',
        SortBy: 'SortName', Fields: 'ChildCount,RecursiveItemCount',
        EnableImages: 'true', ImageTypeLimit: '1'
      });
      if (res && res.Items && res.Items.length) list = res.Items;
    }
    if (!list) {
      const res = await jf('/Items', {
        Ids: DALE_SERIES.map(s => s.id).join(','),
        Fields: 'ChildCount,RecursiveItemCount', EnableImages: 'true'
      });
      list = (res && res.Items && res.Items.length) ? res.Items
           : DALE_SERIES.map(s => ({ Id: s.id, Name: s.name }));
    }
    // Las Vegas Tonight first, the rest alphabetical
    const firstId = DALE_SERIES[0].id;
    list.sort((a, b) => (b.Id === firstId) - (a.Id === firstId));
    seriesList = list;
    renderSeries();
  }

  function renderSeries() {
    showGrid.innerHTML = '';
    seriesList.forEach(s => {
      const card = document.createElement('a');
      card.className = 'show-card';
      card.href = '#episodes';
      card.setAttribute('tabindex', '0');
      card.dataset.id = s.Id;
      const tag = s.ImageTags && s.ImageTags.Primary;
      const cover = tag ? img(s.Id, tag, 400) : FALLBACK_IMG;
      const count = s.RecursiveItemCount ? `${s.RecursiveItemCount} episodes` : '';
      card.innerHTML = `
        <div class="show-cover"><img src="${cover}" alt="${esc(s.Name)}" loading="lazy"
             onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"></div>
        <div class="show-info">
          <div class="show-name">${esc(s.Name)}</div>
          <div class="show-host">${HOST_LINE}</div>
          ${count ? `<div class="show-count">${count}</div>` : ''}
        </div>`;
      card.addEventListener('click', e => {
        e.preventDefault();
        selectSeries(s, true);
      });
      showGrid.appendChild(card);
    });
    if (seriesList.length < 2) {
      const more = document.createElement('div');
      more.className = 'show-card add-more';
      more.innerHTML = `<i class="fas fa-plus"></i><span>More shows coming soon</span>`;
      showGrid.appendChild(more);
    }
    const wanted = new URLSearchParams(location.search).get('show');
    const start = seriesList.find(s => s.Id === wanted) || seriesList[0];
    if (start) selectSeries(start, !!wanted);
  }

  // ── Episodes ──
  async function selectSeries(s, scroll) {
    currentSeries = s;
    showGrid.querySelectorAll('.show-card').forEach(c =>
      c.classList.toggle('selected', c.dataset.id === s.Id));
    epHeading.textContent = `${s.Name} · Episodes`;
    epSearch.value = '';
    epGrid.innerHTML = '';
    setStatus('<span class="spin"></span>Loading episodes…');
    if (scroll) document.getElementById('episodes').scrollIntoView({ behavior: 'smooth', block: 'start' });

    const myToken = ++loadToken;
    const res = await jf(`/Shows/${s.Id}/Episodes`, {
      Fields: 'PrimaryImageAspectRatio', EnableImages: 'true', ImageTypeLimit: '1'
    });
    if (myToken !== loadToken) return; // a different show was picked meanwhile

    if (!res || !res.Items) {
      setStatus('Episodes are taking longer than usual to load.<br>' +
        '<button type="button" class="sort-btn" id="retryBtn">TRY AGAIN</button>');
      document.getElementById('retryBtn').onclick = () => selectSeries(s, false);
      return;
    }
    episodes = res.Items;
    renderEpisodes();
  }

  function setStatus(html) {
    epStatus.innerHTML = html;
    epStatus.style.display = html ? 'block' : 'none';
  }

  function renderEpisodes() {
    const term = epSearch.value.trim().toLowerCase();
    let list = episodes.slice().sort((a, b) =>
      ((a.ParentIndexNumber || 0) - (b.ParentIndexNumber || 0)) ||
      ((a.IndexNumber || 0) - (b.IndexNumber || 0)));
    if (newestFirst) list.reverse();
    if (term) list = list.filter(ep =>
      guestName(ep).toLowerCase().includes(term) || String(ep.IndexNumber || '').includes(term));

    const seriesTag = currentSeries && currentSeries.ImageTags && currentSeries.ImageTags.Primary;
    const frag = document.createDocumentFragment();
    list.forEach(ep => {
      const a = document.createElement('a');
      a.className = 'ep-card';
      a.href = `movie-frame.html?id=${ep.Id}`;
      a.setAttribute('tabindex', '0');
      const guest = guestName(ep);
      let thumb, fallbackCls = '';
      if (ep.ImageTags && ep.ImageTags.Primary) thumb = img(ep.Id, ep.ImageTags.Primary, 480);
      else if (ep.SeriesPrimaryImageTag) { thumb = img(ep.SeriesId, ep.SeriesPrimaryImageTag, 480); fallbackCls = 'logo-fallback'; }
      else if (seriesTag) { thumb = img(currentSeries.Id, seriesTag, 480); fallbackCls = 'logo-fallback'; }
      else { thumb = FALLBACK_IMG; fallbackCls = 'logo-fallback'; }
      const num = ep.IndexNumber != null ? `EP ${ep.IndexNumber}` : '';
      const time = minutes(ep.RunTimeTicks);
      a.innerHTML = `
        <div class="ep-thumb">
          <img src="${thumb}" class="${fallbackCls}" alt="${esc(guest)}" loading="lazy"
               onerror="this.onerror=null;this.src='${FALLBACK_IMG}';this.className='logo-fallback'">
          ${num ? `<span class="ep-num">${num}</span>` : ''}
          ${time ? `<span class="ep-time">${time}</span>` : ''}
          <div class="ep-play"><i class="fas fa-play-circle"></i></div>
        </div>
        <div class="ep-info">
          <div class="ep-guest">${esc(guest)}</div>
          <div class="ep-sub">${esc(currentSeries ? currentSeries.Name : '')}</div>
        </div>`;
      frag.appendChild(a);
    });
    epGrid.innerHTML = '';
    epGrid.appendChild(frag);

    if (!episodes.length) setStatus('New episodes coming soon.');
    else if (!list.length) setStatus(`No episodes match “${esc(epSearch.value.trim())}”.`);
    else setStatus('');
  }

  epSearch.addEventListener('input', () => { if (episodes.length) renderEpisodes(); });
  sortBtn.addEventListener('click', () => {
    newestFirst = !newestFirst;
    sortBtn.textContent = newestFirst ? 'NEWEST FIRST' : 'OLDEST FIRST';
    if (episodes.length) renderEpisodes();
  });

  loadSeries();
</script>

<script>
// ── FIRESTICK D-PAD NAVIGATION ──────────────────────────────
(function() {
  if (!/AFT|FireTV|Silk/i.test(navigator.userAgent)) return;

  function getFocusable() {
    return Array.from(document.querySelectorAll('.back-btn, .hero-card, .show-card:not(.add-more), .ep-search, .sort-btn, .ep-card'))
      .filter(el => el.offsetParent !== null && el.offsetWidth > 0);
  }
  function findBest(cur, all, dir) {
    const cr = cur.getBoundingClientRect();
    const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    const cands = all.filter(el => {
      if (el === cur) return false;
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      if (dir === 'right') return ex > cr.right - 10;
      if (dir === 'left')  return ex < cr.left + 10;
      if (dir === 'down')  return ey > cr.bottom - 10;
      if (dir === 'up')    return ey < cr.top + 10;
    });
    if (!cands.length) return null;
    let best = null, bestScore = Infinity;
    cands.forEach(el => {
      const r = el.getBoundingClientRect();
      const dx = (r.left + r.width / 2) - cx, dy = (r.top + r.height / 2) - cy;
      const primary = (dir === 'right' || dir === 'left') ? Math.abs(dx) : Math.abs(dy);
      const secondary = (dir === 'right' || dir === 'left') ? Math.abs(dy) : Math.abs(dx);
      const score = primary + secondary * 0.3;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    return best;
  }

  document.addEventListener('keydown', function(e) {
    const all = getFocusable();
    if (!all.length) return;
    const focused = document.activeElement;
    const inList = all.indexOf(focused) >= 0;

    // While typing in the search box, let the keyboard behave normally
    // (Backspace deletes, Enter/left/right edit). Up/Down still leave the box.
    if (focused && focused.tagName === 'INPUT' &&
        ['Backspace','Enter',' ','ArrowLeft','ArrowRight'].includes(e.key)) return;

    if (!inList) {
      if (['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter'].includes(e.key)) {
        e.preventDefault();
        all[0].focus();
        all[0].scrollIntoView({ block: 'center' });
      }
      return;
    }

    const dir = { ArrowRight:'right', ArrowLeft:'left', ArrowDown:'down', ArrowUp:'up' }[e.key];
    if (dir) {
      e.preventDefault();
      const next = findBest(focused, all, dir);
      if (next) { next.focus(); next.scrollIntoView({ behavior:'smooth', block:'center' }); }
      else if (dir === 'up') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => document.querySelector('.back-btn').focus(), 400);
      }
    }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focused.click(); }
    if (e.key === 'Backspace' || e.key === 'Escape') { e.preventDefault(); window.location.href = 'home.html'; }
  }, true);
})();
</script>
