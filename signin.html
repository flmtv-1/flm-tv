<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FLM TV</title>
    <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signin-container {
            max-width: 440px;
            width: 100%;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo { font-size: 2.75rem; font-weight: 900; color: #ffd700; margin-bottom: 0.5rem; }
        .subtitle { color: rgba(255,255,255,0.7); margin-bottom: 1.75rem; font-size: 1.05rem; }

        .tabs { display: flex; margin-bottom: 1.5rem; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .tab {
            flex: 1; padding: 0.75rem; background: #16161f; color: rgba(255,255,255,0.6);
            cursor: pointer; font-weight: 600; transition: all 0.2s;
        }
        .tab.active { background: #ffd700; color: #000; }

        .field { text-align: left; margin-bottom: 1rem; }
        .field label { display: block; font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 0.35rem; }
        .field input {
            width: 100%; padding: 0.9rem; border-radius: 8px; border: 1px solid #444;
            background: #0a0f1a; color: #fff; font-size: 1rem;
        }
        .field input:focus { outline: none; border-color: #ffd700; }

        .signin-btn {
            width: 100%; padding: 1.1rem; font-size: 1.15rem; font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #22c55e 100%);
            border: none; border-radius: 12px; color: #000; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin-top: 0.5rem;
        }
        .signin-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6); }
        .signin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .status { margin-top: 1.25rem; padding: 0.9rem; border-radius: 8px; display: none; font-size: 0.95rem; }
        .status.loading { display: block; background: rgba(255, 215, 0, 0.1); color: #ffd700; }
        .status.success { display: block; background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .status.error { display: block; background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .spinner {
            display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,215,0,0.3);
            border-top-color: #ffd700; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hint { margin-top: 1rem; font-size: 0.8rem; color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo">FLM TV</div>
        <p class="subtitle" id="subtitle">Create your free account to start watching</p>

        <div class="tabs">
            <div class="tab active" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
            <div class="tab" id="tabLogin" onclick="switchTab('login')">Sign In</div>
        </div>

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password">
        </div>

        <button class="signin-btn" id="submitBtn">
            <i class="fas fa-play-circle"></i>
            <span id="submitLabel">Create Account &amp; Watch</span>
        </button>

        <div class="status" id="status"></div>
        <p class="hint">Your account keeps your own watch history and playlists — separate from every other viewer.</p>
    </div>

    <script>
        const JELLYFIN_SERVER = 'https://flmtv26.duckdns.org:8920';
        let mode = 'signup'; // 'signup' | 'login'

        const statusDiv   = document.getElementById('status');
        const submitBtn   = document.getElementById('submitBtn');
        const submitLabel = document.getElementById('submitLabel');
        const subtitle    = document.getElementById('subtitle');
        const usernameEl  = document.getElementById('username');
        const passwordEl  = document.getElementById('password');

        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            submitLabel.textContent = mode === 'signup' ? 'Create Account & Watch' : 'Sign In & Watch';
            subtitle.textContent = mode === 'signup'
                ? 'Create your free account to start watching'
                : 'Welcome back! Sign in to continue';
            statusDiv.className = 'status';
        }

        function isSignedIn() {
            const creds = localStorage.getItem('jellyfin_credentials');
            if (!creds) return false;
            try {
                const parsed = JSON.parse(creds);
                const server = parsed.Servers && parsed.Servers[0];
                if (!server) return false;
                const hoursSinceAccess = (Date.now() - server.DateLastAccessed) / (1000 * 60 * 60);
                return hoursSinceAccess < 24;
            } catch { return false; }
        }
        if (isSignedIn()) window.location.href = 'home.html';

        function storeSession(server, userId, token) {
            localStorage.setItem('jellyfin_credentials', JSON.stringify({
                Servers: [{
                    AccessToken: token,
                    UserId: userId,
                    Id: server.Id || 'db6bb6388c8c4c70825698639853ede6',
                    ManualAddress: JELLYFIN_SERVER,
                    LastConnectionMode: 2,
                    Name: 'FLM TV Server',
                    DateLastAccessed: Date.now()
                }]
            }));
        }

        async function authenticate(username, password) {
            const res = await fetch(`${JELLYFIN_SERVER}/Users/AuthenticateByName`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Emby-Authorization': `MediaBrowser Client="FLM TV", Device="Web", DeviceId="flmtv-web-${Date.now()}", Version="1.0.0"`
                },
                body: JSON.stringify({ Username: username, Pw: password })
            });
            if (!res.ok) throw new Error('sign-in-failed');
            return res.json();
        }

        async function handleSubmit() {
            const username = usernameEl.value.trim();
            const password = passwordEl.value;

            if (!username || !password) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Please enter a username and password.';
                return;
            }

            submitBtn.disabled = true;
            statusDiv.className = 'status loading';
            statusDiv.innerHTML = '<div class="spinner"></div> ' + (mode === 'signup' ? 'Creating your account...' : 'Signing in...');

            try {
                if (mode === 'signup') {
                    const signupRes = await fetch('/.netlify/functions/jellyfin-signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const signupData = await signupRes.json();
                    if (!signupRes.ok) throw new Error(signupData.error || 'Could not create account');
                }

                // Whether just-created or an existing account, log in for real
                const authData = await authenticate(username, password);
                storeSession({ Id: authData.ServerId }, authData.User.Id, authData.AccessToken);

                statusDiv.className = 'status success';
                statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Success! Redirecting...';
                setTimeout(() => { window.location.href = 'home.html'; }, 900);

            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' +
                    (err.message === 'sign-in-failed'
                        ? 'Incorrect username or password.'
                        : err.message);
                submitBtn.disabled = false;
            }
        }

        submitBtn.addEventListener('click', handleSubmit);
    </script>
</body>
</html>
