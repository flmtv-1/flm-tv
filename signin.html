<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FLM TV</title>
    <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signin-container {
            max-width: 500px;
            width: 100%;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .logo {
            font-size: 3rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 1rem;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .signin-btn {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #22c55e 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .signin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }
        
        .signin-btn:active {
            transform: translateY(0);
        }
        
        .signin-btn i {
            font-size: 1.5rem;
        }
        
        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        
        .status.loading {
            display: block;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }
        
        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
        
        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,215,0,0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .signin-container {
                padding: 2rem;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .signin-btn {
                padding: 1.2rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo">FLM TV</div>
        <p class="subtitle">Welcome! Sign in free to start watching</p>
        
        <button class="signin-btn" id="signinBtn">
            <i class="fas fa-play-circle"></i>
            Sign In & Watch
        </button>
        
        <div class="status" id="status">
            <div class="spinner"></div> Signing in...
        </div>
    </div>
    
    <script>
        const JELLYFIN = {
            SERVER: 'https://flmtv26.duckdns.org:8920',
            API_KEY: '62131ee22c0141c6b651be75a7444350',
            USER_ID: '0407d4609a0346f99c09e0d7ddc9ccd1'
        };
        
        const statusDiv = document.getElementById('status');
        const signinBtn = document.getElementById('signinBtn');
        
        // Check if already signed in
        function isSignedIn() {
            const creds = localStorage.getItem('jellyfin_credentials');
            if (creds) {
                try {
                    const parsed = JSON.parse(creds);
                    if (parsed.Servers && parsed.Servers.length > 0) {
                        const server = parsed.Servers[0];
                        // Check if credentials are recent (less than 24 hours old)
                        const hoursSinceAccess = (Date.now() - server.DateLastAccessed) / (1000 * 60 * 60);
                        return hoursSinceAccess < 24;
                    }
                } catch (e) {
                    return false;
                }
            }
            return false;
        }
        
        // If already signed in, go to home
        if (isSignedIn()) {
            window.location.href = 'home.html';
        }
        
        // Sign in function
        async function signIn() {
            signinBtn.disabled = true;
            statusDiv.className = 'status loading';
            statusDiv.innerHTML = '<div class="spinner"></div> Signing in...';
            
            try {
                const authResponse = await fetch(`${JELLYFIN.SERVER}/Users/AuthenticateByName`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Emby-Authorization': `MediaBrowser Client="FLM TV", Device="Web", DeviceId="flmtv-web-${Date.now()}", Version="1.0.0"`
                    },
                    body: JSON.stringify({
                        Username: 'Public',
                        Pw: ''
                    })
                });
                
                if (authResponse.ok) {
                    const authData = await authResponse.json();
                    
                    // Store credentials
                    localStorage.setItem('jellyfin_credentials', JSON.stringify({
                        Servers: [{
                            AccessToken: authData.AccessToken,
                            UserId: authData.User.Id,
                            Id: authData.ServerId || 'db6bb6388c8c4c70825698639853ede6',
                            ManualAddress: JELLYFIN.SERVER,
                            LastConnectionMode: 2,
                            Name: 'FLM TV Server',
                            DateLastAccessed: Date.now()
                        }]
                    }));
                    
                    // Also store individual keys
                    localStorage.setItem('jellyfin_serverId', authData.ServerId || 'db6bb6388c8c4c70825698639853ede6');
                    localStorage.setItem('jellyfin_userId', authData.User.Id);
                    localStorage.setItem('jellyfin_accessToken', authData.AccessToken);
                    
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Success! Redirecting...';
                    
                    console.log('✅ Signed in successfully');
                    
                    // Redirect to home after short delay
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1000);
                    
                } else {
                    throw new Error('Authentication failed');
                }
                
            } catch (error) {
                console.error('Sign in error:', error);
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Sign in failed. Please try again.';
                signinBtn.disabled = false;
            }
        }
        
        // Attach click handler
        signinBtn.addEventListener('click', signIn);
    </script>
</body>
</html>
