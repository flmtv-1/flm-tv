<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FLM TV - 24/7 Live Stream</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .banner {
      text-align: center;
      background: #222;
      padding: 20px;
    }
    .banner img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }
    .player {
      width: 100%;
      max-width: 960px;
      margin: 30px auto;
    }
    .player video, .player iframe {
      width: 100%;
      height: 540px;
      border-radius: 12px;
      background: black;
    }
    .description {
      max-width: 960px;
      margin: 20px auto;
      font-size: 18px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <div class="banner" id="liveBanner">
    <!-- Banner image goes here -->
  </div>

  <div class="player" id="livePlayer">
    <!-- Video player injected here -->
  </div>

  <div class="description" id="liveDesc">
    <!-- Stream description goes here -->
  </div>

  <!-- STATIONS BAR -->
  <div style="
    max-width: 960px;
    margin: 0 auto 40px;
    padding: 14px 20px;
    background: #1a1a1a;
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  ">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:8px;height:8px;border-radius:50%;background:#E8333A;animation:liveDot 1.2s infinite;"></div>
      <span style="font-family:Arial,sans-serif;font-size:13px;color:#888;letter-spacing:1px;">LOOKING FOR MORE LIVE TV?</span>
    </div>
    <a href="live-stations.html" style="
      display:flex;align-items:center;gap:8px;
      background:#C9A84C;color:#000;text-decoration:none;
      font-family:Arial,sans-serif;font-size:12px;font-weight:700;
      letter-spacing:2px;padding:8px 18px;border-radius:4px;
      text-transform:uppercase;
    ">
      📺 Browse 2,500+ TV Stations →
    </a>
  </div>

  <style>
    @keyframes liveDot { 0%,100%{opacity:1} 50%{opacity:0.2} }
  </style>

  <script>
    // 🧠 Load from localStorage (or switch to JSON later)
    const streamUrl = localStorage.getItem('flm_live_url');
    const streamDesc = localStorage.getItem('flm_live_desc');
    const streamBanner = localStorage.getItem('flm_live_banner');

    if (streamBanner) {
      document.getElementById('liveBanner').innerHTML = `<img src="/assets/${streamBanner}" alt="Live Banner">`;
    }

    if (streamUrl) {
      const isIframe = streamUrl.includes("youtube") || streamUrl.includes("twitch");
      document.getElementById('livePlayer').innerHTML = isIframe
        ? `<iframe src="${streamUrl}" frameborder="0" allowfullscreen></iframe>`
        : `<video controls autoplay><source src="${streamUrl}" type="application/x-mpegURL">Your browser does not support the video tag.</video>`;
    } else {
      document.getElementById('livePlayer').innerHTML = `<p style="text-align:center">❌ No live stream URL set.</p>`;
    }

    document.getElementById('liveDesc').innerText = streamDesc || '';
  </script>

</body>
</html>
