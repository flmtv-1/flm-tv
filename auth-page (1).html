<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing In - FLM TV</title>
    <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-container {
            text-align: center;
            max-width: 500px;
            padding: 3rem;
        }
        
        .logo {
            font-size: 3rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        .status {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            margin-top: 1rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Hidden iframe for authentication */
        #authFrame {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">FLM TV</div>
        <div class="spinner"></div>
        <div class="status" id="status">Signing you in...</div>
    </div>

    <!-- Hidden iframe to trigger Jellyfin authentication -->
    <iframe id="authFrame"></iframe>

    <script>
        const JELLYFIN = {
            SERVER: 'http://flmtv26.duckdns.org:8096',
            SERVER_ID: 'db6bb6388c8c4c70825698639853ede6'
        };

        // Get movie ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        const statusDiv = document.getElementById('status');

        if (!movieId) {
            statusDiv.textContent = 'Error: No movie found';
            setTimeout(() => window.location.href = 'home.html', 2000);
        } else {
            authenticateAndRedirect();
        }

        async function authenticateAndRedirect() {
            try {
                statusDiv.textContent = 'Authenticating...';
                
                // Method 1: Try to authenticate via API
                const authResponse = await fetch(`${JELLYFIN.SERVER}/Users/AuthenticateByName`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Emby-Authorization': `MediaBrowser Client="FLM TV", Device="Web", DeviceId="flmtv-web-auto", Version="1.0.0"`
                    },
                    body: JSON.stringify({
                        Username: 'Public',
                        Pw: ''
                    }),
                    credentials: 'include'
                });

                if (authResponse.ok) {
                    const authData = await authResponse.json();
                    
                    // Store credentials on our domain
                    localStorage.setItem('jellyfin_credentials', JSON.stringify({
                        Servers: [{
                            AccessToken: authData.AccessToken,
                            UserId: authData.User.Id,
                            Id: authData.ServerId || JELLYFIN.SERVER_ID,
                            ManualAddress: JELLYFIN.SERVER,
                            LastConnectionMode: 2,
                            Name: 'FLM TV Server',
                            DateLastAccessed: Date.now()
                        }]
                    }));

                    console.log('✅ API Authentication successful');
                    statusDiv.textContent = 'Opening movie...';
                }
                
            } catch (error) {
                console.log('⚠️ API auth failed, trying iframe method:', error);
            }

            // Method 2: Load Jellyfin in hidden iframe to set cookies on their domain
            const authFrame = document.getElementById('authFrame');
            const authUrl = `${JELLYFIN.SERVER}/web/`;
            
            statusDiv.textContent = 'Preparing player...';
            authFrame.src = authUrl;

            // Wait for iframe to load, then redirect to movie
            setTimeout(() => {
                statusDiv.textContent = 'Ready!';
                const jellyfinUrl = `${JELLYFIN.SERVER}/web/#!/details?id=${movieId}&serverId=${JELLYFIN.SERVER_ID}`;
                window.location.href = jellyfinUrl;
            }, 2000);
        }
    </script>
</body>
</html>
