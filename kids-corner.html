<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Corner - FLM TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- EPUB.js for reading EPUB books -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI Emoji', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ffd700;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .logo i {
            margin-right: 0.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .back-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #1ea34a;
            transform: scale(1.05);
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Section Tabs */
        .section-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 3px solid transparent;
            padding: 1rem 2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .tab-btn.active {
            background: #ffd700;
            color: #333;
            border-color: #fff;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
        }

        /* Section Content */
        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .book-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .book-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .book-cover {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .book-cover i {
            font-size: 4rem;
            color: white;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-title {
            font-size: 1rem;
            color: #333;
            text-align: center;
            font-weight: 700;
            line-height: 1.3;
        }

        .book-type {
            display: inline-block;
            background: #22c55e;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .game-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .game-icon i {
            font-size: 3rem;
            color: white;
        }

        .game-name {
            font-size: 1.2rem;
            color: #333;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .game-description {
            font-size: 0.9rem;
            color: #666;
        }

        /* PDF Reader Overlay */
        .reader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 10000;
        }

        .reader-overlay.active {
            display: flex;
            flex-direction: column;
        }

        .reader-header {
            padding: 1rem 2rem;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ffd700;
        }

        .reader-title {
            font-size: 1.5rem;
            color: #ffd700;
        }

        .close-reader {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .close-reader:hover {
            background: #dc2626;
        }

        .reader-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        #pdfCanvas {
            max-width: 90%;
            max-height: 80vh;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Navigation */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #ffd700;
            color: #333;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 2rem;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
        }

        .nav-arrow:hover:not(:disabled) {
            background: #ffed4e;
            transform: translateY(-50%) scale(1.1);
        }

        .nav-arrow.left {
            left: 2rem;
        }

        .nav-arrow.right {
            right: 2rem;
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd700;
            color: #333;
            padding: 1rem 2rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            z-index: 100;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.5rem;
        }

        .loading i {
            font-size: 4rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .nav-arrow {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }

            .section-title {
                font-size: 2rem;
            }
        }

        /* Coloring App Styles */
        .color-btn {
            width: 50px;
            height: 50px;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .color-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .color-btn.selected {
            border: 5px solid #ffd700;
            transform: scale(1.3);
        }

        #coloringSVG path, #coloringSVG polygon, #coloringSVG circle, #coloringSVG rect, #coloringSVG ellipse {
            transition: fill 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <i class="fas fa-star"></i>
            Kids Corner
        </div>
        <a href="home.html" class="back-btn">
            <i class="fas fa-home"></i> Back Home
        </a>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Section Tabs -->
        <div class="section-tabs">
            <button class="tab-btn active" onclick="showSection('books')">
                <i class="fas fa-book"></i>
                Books
            </button>
            <button class="tab-btn" onclick="showSection('audiobooks')">
                <i class="fas fa-headphones"></i>
                Audiobooks
            </button>
            <button class="tab-btn" onclick="showSection('cartoons')">
                <i class="fas fa-tv"></i>
                Cartoons
            </button>
            <button class="tab-btn" onclick="showSection('coloring')">
                <i class="fas fa-palette"></i>
                Coloring
            </button>
            <button class="tab-btn" onclick="showSection('games')">
                <i class="fas fa-gamepad"></i>
                Games
            </button>
        </div>

        <!-- Books Section -->
        <div id="books-section" class="section-content active">
            <h1 class="section-title">📚 Choose a Book to Read</h1>
            <div class="books-grid" id="booksGrid">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading your books...</p>
                </div>
            </div>
        </div>

        <!-- Audiobooks Section -->
        <div id="audiobooks-section" class="section-content">
            <h1 class="section-title">🎧 Choose an Audiobook to Listen</h1>
            <div class="books-grid" id="audiobooksGrid">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading audiobooks...</p>
                </div>
            </div>
        </div>

        <!-- Cartoons Section -->
        <div id="cartoons-section" class="section-content">
            <h1 class="section-title">📺 Choose a Cartoon to Watch</h1>
            <div class="books-grid" id="cartoonsGrid">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading cartoons...</p>
                </div>
            </div>
        </div>

        <!-- Coloring Section -->
        <div id="coloring-section" class="section-content">
            <h1 class="section-title">🎨 Choose a Picture to Color</h1>
            
            <!-- Coloring Page Gallery -->
            <div class="books-grid" id="coloringGallery" style="display: block;">
                <!-- Gallery will be populated by JavaScript -->
            </div>
            
            <!-- Coloring Canvas (hidden until page selected) -->
            <div id="coloringCanvas" style="display: none;">
                <div style="text-align: center; margin-bottom: 1rem;">
                    <button class="back-btn" onclick="backToGallery()" style="display: inline-block; margin: 0 auto;">
                        <i class="fas fa-arrow-left"></i> Choose Another Picture
                    </button>
                </div>
                
                <!-- Color Palette -->
                <div style="display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
                    <button class="color-btn" onclick="selectColor('#FF0000')" style="background: #FF0000;" title="Red"></button>
                    <button class="color-btn" onclick="selectColor('#FF6B00')" style="background: #FF6B00;" title="Orange"></button>
                    <button class="color-btn" onclick="selectColor('#FFD700')" style="background: #FFD700;" title="Yellow"></button>
                    <button class="color-btn" onclick="selectColor('#00FF00')" style="background: #00FF00;" title="Green"></button>
                    <button class="color-btn" onclick="selectColor('#00BFFF')" style="background: #00BFFF;" title="Blue"></button>
                    <button class="color-btn" onclick="selectColor('#8B00FF')" style="background: #8B00FF;" title="Purple"></button>
                    <button class="color-btn" onclick="selectColor('#FF1493')" style="background: #FF1493;" title="Pink"></button>
                    <button class="color-btn" onclick="selectColor('#8B4513')" style="background: #8B4513;" title="Brown"></button>
                    <button class="color-btn" onclick="selectColor('#000000')" style="background: #000000;" title="Black"></button>
                    <button class="color-btn" onclick="selectColor('#FFFFFF')" style="background: #FFFFFF; border: 2px solid #333;" title="White"></button>
                    <button class="color-btn" onclick="clearColoring()" style="background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);" title="Clear All">
                        <i class="fas fa-undo" style="color: white;"></i>
                    </button>
                </div>
                
                <!-- SVG Coloring Area -->
                <div style="display: flex; justify-content: center;">
                    <svg id="coloringSVG" width="600" height="600" style="background: white; border: 3px solid #ffd700; border-radius: 15px; cursor: pointer;"></svg>
                </div>
            </div>
        </div>

        <!-- Games Section -->
        <div id="games-section" class="section-content">
            <h1 class="section-title">🎮 Choose a Game to Play</h1>
            <div class="games-grid" id="gamesGrid">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Games coming soon!</p>
                </div>
            </div>
        </div>

    </div>

    <!-- EPUB Book Reader -->
    <div class="reader-overlay" id="readerOverlay">
        <div class="reader-header">
            <div class="reader-title" id="readerTitle">Book Title</div>
            <button class="close-reader" onclick="closeReader()">
                <i class="fas fa-times"></i> Close
            </button>
        </div>
        <div class="reader-content">
            <button class="nav-arrow left" id="prevPage" onclick="previousPage()">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <div id="epubViewer" style="width: 80%; max-width: 800px; height: 80vh; background: white; border-radius: 15px; overflow: hidden;"></div>
            
            <button class="nav-arrow right" id="nextPage" onclick="nextPage()">
                <i class="fas fa-chevron-right"></i>
            </button>
            
            <div class="page-counter" id="pageCounter">Loading...</div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        
        const JELLYFIN_CONFIG = {
            SERVER: 'https://flmtv26.duckdns.org:8920',
            API_KEY: '62131ee22c0141c6b651be75a7444350',
            USER_ID: '0407d4609a0346f99c09e0d7ddc9ccd1',
            BOOKS_LIBRARY_ID: '467bd88b656c88ee6a423d8478e9e54a',      // TEXT BOOKS (EPUB)
            AUDIOBOOKS_LIBRARY_ID: '17eace283c0eb2fcd9a3132a4fdf1819',  // AUDIO BOOKS-KIDS
            CARTOONS_LIBRARY_ID: 'ca43f3291c81d4f007f2b33936d256e6',    // KIDS WORLD (Cartoons/TV)
            GAMES_LIBRARY_ID: null  // Add when games library is created
        };

        // ═══════════════════════════════════════════════════════════════
        // BOOKS, AUDIOBOOKS, CARTOONS, AND GAMES - LOADED FROM JELLYFIN
        // ═══════════════════════════════════════════════════════════════
        
        let BOOKS = [];
        let AUDIOBOOKS = [];
        let CARTOONS = [];
        let GAMES = [];

        // ═══════════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════════
        
        // (EPUB state variables are defined in the EPUB BOOK READER section below)

        // ═══════════════════════════════════════════════════════════════
        // INITIALIZE
        // ═══════════════════════════════════════════════════════════════
        
        window.addEventListener('load', () => {
            // Only load books initially (active tab)
            loadBooks();
            // Initialize coloring gallery (lightweight)
            initColoringGallery();
            // Don't load audiobooks and cartoons until user clicks those tabs
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('readerOverlay').classList.contains('active')) {
                if (e.key === 'ArrowLeft') previousPage();
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === 'Escape') closeReader();
            }
        });

        // ═══════════════════════════════════════════════════════════════
        // SECTION SWITCHING - WITH ON-DEMAND LOADING
        // ═══════════════════════════════════════════════════════════════
        
        let loadedSections = { books: true, coloring: true }; // Pre-loaded
        
        function showSection(section) {
            // Hide all sections
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            // Show selected section
            document.getElementById(`${section}-section`).classList.add('active');
            event.target.closest('.tab-btn').classList.add('active');
            
            // Load content on-demand if not already loaded
            if (!loadedSections[section]) {
                if (section === 'audiobooks') {
                    loadAudiobooks();
                    loadedSections.audiobooks = true;
                } else if (section === 'cartoons') {
                    loadCartoons();
                    loadedSections.cartoons = true;
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // LOAD BOOKS FROM JELLYFIN
        // ═══════════════════════════════════════════════════════════════
        
        async function loadBooks() {
            const grid = document.getElementById('booksGrid');
            
            try {
                const url = `${JELLYFIN_CONFIG.SERVER}/Users/${JELLYFIN_CONFIG.USER_ID}/Items?ParentId=${JELLYFIN_CONFIG.BOOKS_LIBRARY_ID}&Recursive=true&IncludeItemTypes=Book&Fields=Path&SortBy=SortName&api_key=${JELLYFIN_CONFIG.API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                BOOKS = (data.Items || []).map(book => ({
                    id: book.Id,
                    name: book.Name,
                    file: `${JELLYFIN_CONFIG.SERVER}/Items/${book.Id}/Download?api_key=${JELLYFIN_CONFIG.API_KEY}`,
                    type: book.Path ? book.Path.split('.').pop().toUpperCase() : 'PDF',
                    imageUrl: book.ImageTags && book.ImageTags.Primary
                        ? `${JELLYFIN_CONFIG.SERVER}/Items/${book.Id}/Images/Primary?maxHeight=400&quality=90&tag=${book.ImageTags.Primary}&api_key=${JELLYFIN_CONFIG.API_KEY}`
                        : null
                }));
                
                displayBooks();
            } catch (error) {
                console.error('Error loading books:', error);
                grid.innerHTML = `
                    <div class="loading">
                        <p style="color: #ff6b6b;">Oops! Could not load books</p>
                        <p style="font-size: 1rem; margin-top: 1rem;">Ask a grown-up to check the connection!</p>
                    </div>
                `;
            }
        }
        
        function displayBooks() {
            const grid = document.getElementById('booksGrid');
            
            if (BOOKS.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        <p>No books available yet!</p>
                        <p style="font-size: 1rem; margin-top: 1rem;">Ask a grown-up to add some books 📚</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = BOOKS.map((book, index) => `
                <div class="book-card" onclick="openBook(${index})">
                    <div class="book-cover">
                        ${book.imageUrl ? `<img src="${book.imageUrl}" alt="${book.name}">` : '<i class="fas fa-book-open"></i>'}
                    </div>
                    <div class="book-title">${book.name}</div>
                    <span class="book-type">${book.type}</span>
                </div>
            `).join('');
        }

        // ═══════════════════════════════════════════════════════════════
        // LOAD AUDIOBOOKS FROM JELLYFIN
        // ═══════════════════════════════════════════════════════════════
        
        async function loadAudiobooks() {
            const grid = document.getElementById('audiobooksGrid');
            
            try {
                const url = `${JELLYFIN_CONFIG.SERVER}/Users/${JELLYFIN_CONFIG.USER_ID}/Items?ParentId=${JELLYFIN_CONFIG.AUDIOBOOKS_LIBRARY_ID}&Recursive=true&IncludeItemTypes=Audio&Fields=Path&SortBy=SortName&api_key=${JELLYFIN_CONFIG.API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                AUDIOBOOKS = (data.Items || []).map(audio => ({
                    id: audio.Id,
                    name: audio.Name,
                    type: 'AUDIO',
                    imageUrl: audio.ImageTags && audio.ImageTags.Primary
                        ? `${JELLYFIN_CONFIG.SERVER}/Items/${audio.Id}/Images/Primary?maxHeight=400&quality=90&tag=${audio.ImageTags.Primary}&api_key=${JELLYFIN_CONFIG.API_KEY}`
                        : null
                }));
                
                displayAudiobooks();
            } catch (error) {
                console.error('Error loading audiobooks:', error);
                grid.innerHTML = `
                    <div class="loading">
                        <p style="color: #ff6b6b;">Could not load audiobooks</p>
                    </div>
                `;
            }
        }
        
        function displayAudiobooks() {
            const grid = document.getElementById('audiobooksGrid');
            
            if (AUDIOBOOKS.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        <p>No audiobooks available yet!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = AUDIOBOOKS.map((audio, index) => `
                <div class="book-card" onclick="openAudiobook(${index})">
                    <div class="book-cover">
                        ${audio.imageUrl ? `<img src="${audio.imageUrl}" alt="${audio.name}">` : '<i class="fas fa-headphones"></i>'}
                    </div>
                    <div class="book-title">${audio.name}</div>
                    <span class="book-type">🎧 AUDIO</span>
                </div>
            `).join('');
        }

        // ═══════════════════════════════════════════════════════════════
        // LOAD CARTOONS FROM JELLYFIN
        // ═══════════════════════════════════════════════════════════════
        
        async function loadCartoons() {
            const grid = document.getElementById('cartoonsGrid');
            
            try {
                const url = `${JELLYFIN_CONFIG.SERVER}/Users/${JELLYFIN_CONFIG.USER_ID}/Items?ParentId=${JELLYFIN_CONFIG.CARTOONS_LIBRARY_ID}&Recursive=true&IncludeItemTypes=Series&Fields=Path&SortBy=SortName&api_key=${JELLYFIN_CONFIG.API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                CARTOONS = (data.Items || []).map(show => ({
                    id: show.Id,
                    name: show.Name,
                    type: 'TV',
                    imageUrl: show.ImageTags && show.ImageTags.Primary
                        ? `${JELLYFIN_CONFIG.SERVER}/Items/${show.Id}/Images/Primary?maxHeight=400&quality=90&tag=${show.ImageTags.Primary}&api_key=${JELLYFIN_CONFIG.API_KEY}`
                        : null
                }));
                
                displayCartoons();
            } catch (error) {
                console.error('Error loading cartoons:', error);
                grid.innerHTML = `
                    <div class="loading">
                        <p style="color: #ff6b6b;">Could not load cartoons</p>
                    </div>
                `;
            }
        }
        
        function displayCartoons() {
            const grid = document.getElementById('cartoonsGrid');
            
            if (CARTOONS.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        <p>No cartoons available yet!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = CARTOONS.map((show, index) => `
                <div class="book-card" onclick="openCartoon(${index})">
                    <div class="book-cover">
                        ${show.imageUrl ? `<img src="${show.imageUrl}" alt="${show.name}">` : '<i class="fas fa-tv"></i>'}
                    </div>
                    <div class="book-title">${show.name}</div>
                    <span class="book-type">📺 TV</span>
                </div>
            `).join('');
        }

        // ═══════════════════════════════════════════════════════════════
        // LOAD GAMES
        // ═══════════════════════════════════════════════════════════════
        
        function loadGames() {
            const grid = document.getElementById('gamesGrid');
            
            if (GAMES.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        <p>No games available yet!</p>
                        <p style="font-size: 1rem; margin-top: 1rem;">Ask a grown-up to add some games 🎮</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = GAMES.map((game, index) => `
                <div class="game-card" onclick="openGame(${index})">
                    <div class="game-icon">
                        <i class="fas fa-${game.icon}"></i>
                    </div>
                    <div class="game-name">${game.name}</div>
                    <div class="game-description">${game.description}</div>
                </div>
            `).join('');
        }

        // ═══════════════════════════════════════════════════════════════
        // OPEN BOOK
        // ═══════════════════════════════════════════════════════════════
        
        // ═══════════════════════════════════════════════════════════════
        // EPUB BOOK READER
        // ═══════════════════════════════════════════════════════════════
        
        let currentBook = null;
        let rendition = null;

        async function openBook(index) {
            const book = BOOKS[index];
            
            console.log('📖 Opening EPUB book:', book.name);
            
            // Show overlay
            const overlay = document.getElementById('readerOverlay');
            const title = document.getElementById('readerTitle');
            title.textContent = book.name;
            overlay.classList.add('active');
            
            // Get EPUB file URL from Jellyfin
            const epubUrl = `${JELLYFIN_CONFIG.SERVER}/Items/${book.id}/Download?api_key=${JELLYFIN_CONFIG.API_KEY}`;
            
            try {
                // Create epub.js book
                currentBook = ePub(epubUrl);
                
                // Render into viewer
                rendition = currentBook.renderTo("epubViewer", {
                    width: "100%",
                    height: "100%",
                    spread: "none"
                });
                
                // Display first page
                await rendition.display();
                
                // Update page counter
                document.getElementById('pageCounter').textContent = 'Use arrows to turn pages';
                
                console.log('✅ EPUB loaded successfully!');
            } catch (error) {
                console.error('❌ Error loading EPUB:', error);
                alert('Could not open this book. Please try another one!');
                closeReader();
            }
        }

        function openAudiobook(index) {
            const audio = AUDIOBOOKS[index];
            
            console.log('🎧 Opening audiobook:', audio.name);
            
            // Open in Jellyfin's native audio player
            const jellyfinUrl = `${JELLYFIN_CONFIG.SERVER}/web/index.html#!/details?id=${audio.id}`;
            window.location.href = jellyfinUrl;
        }

        function openCartoon(index) {
            const show = CARTOONS[index];
            
            console.log('📺 Opening cartoon:', show.name);
            
            // Open in Jellyfin's native TV player
            const jellyfinUrl = `${JELLYFIN_CONFIG.SERVER}/web/index.html#!/details?id=${show.id}`;
            window.location.href = jellyfinUrl;
        }

        // ═══════════════════════════════════════════════════════════════
        // EPUB NAVIGATION
        // ═══════════════════════════════════════════════════════════════
        
        function nextPage() {
            if (rendition) {
                rendition.next();
            }
        }

        function previousPage() {
            if (rendition) {
                rendition.prev();
            }
        }

        function closeReader() {
            document.getElementById('readerOverlay').classList.remove('active');
            
            // Destroy epub.js instance
            if (rendition) {
                rendition.destroy();
                rendition = null;
            }
            if (currentBook) {
                currentBook.destroy();
                currentBook = null;
            }
            
            // Clear viewer
            document.getElementById('epubViewer').innerHTML = '';
        }

        // ═══════════════════════════════════════════════════════════════
        // OPEN GAME
        // ═══════════════════════════════════════════════════════════════
        
        function openGame(index) {
            const game = GAMES[index];
            // Open game in new window/tab
            window.open(game.file, '_blank');
        }

        // ═══════════════════════════════════════════════════════════════
        // COLORING BOOK
        // ═══════════════════════════════════════════════════════════════

        let currentColor = '#FF0000'; // Default red
        let currentColoringPage = null; // Renamed to avoid conflict

        // Coloring pages library (SVG paths)
        const COLORING_PAGES = [
            {
                name: '🐱 Happy Cat',
                svg: '<g><circle cx="300" cy="250" r="100" fill="white" stroke="black" stroke-width="3"/><circle cx="270" cy="230" r="15" fill="white" stroke="black" stroke-width="2"/><circle cx="330" cy="230" r="15" fill="white" stroke="black" stroke-width="2"/><circle cx="275" cy="235" r="5" fill="black"/><circle cx="325" cy="235" r="5" fill="black"/><path d="M 280 270 Q 300 280 320 270" fill="none" stroke="black" stroke-width="3"/><polygon points="250,180 230,150 260,200" fill="white" stroke="black" stroke-width="2"/><polygon points="350,180 370,150 340,200" fill="white" stroke="black" stroke-width="2"/><ellipse cx="300" cy="320" rx="60" ry="80" fill="white" stroke="black" stroke-width="3"/></g>'
            },
            {
                name: '⭐ Big Star',
                svg: '<polygon points="300,100 350,250 500,250 380,350 430,500 300,400 170,500 220,350 100,250 250,250" fill="white" stroke="black" stroke-width="4"/>'
            },
            {
                name: '🦋 Butterfly',
                svg: '<g><ellipse cx="300" cy="300" rx="20" ry="60" fill="white" stroke="black" stroke-width="3"/><circle cx="300" cy="250" r="25" fill="white" stroke="black" stroke-width="3"/><circle cx="295" cy="245" r="5" fill="black"/><circle cx="305" cy="245" r="5" fill="black"/><ellipse cx="230" cy="280" rx="70" ry="90" fill="white" stroke="black" stroke-width="3"/><ellipse cx="370" cy="280" rx="70" ry="90" fill="white" stroke="black" stroke-width="3"/><ellipse cx="230" cy="370" rx="50" ry="70" fill="white" stroke="black" stroke-width="3"/><ellipse cx="370" cy="370" rx="50" ry="70" fill="white" stroke="black" stroke-width="3"/><line x1="300" y1="230" x2="280" y2="200" stroke="black" stroke-width="2"/><line x1="300" y1="230" x2="320" y2="200" stroke="black" stroke-width="2"/></g>'
            },
            {
                name: '🌸 Flower',
                svg: '<g><circle cx="300" cy="300" r="40" fill="white" stroke="black" stroke-width="3"/><ellipse cx="300" cy="220" rx="35" ry="60" fill="white" stroke="black" stroke-width="3"/><ellipse cx="380" cy="300" rx="35" ry="60" fill="white" stroke="black" stroke-width="3" transform="rotate(90 380 300)"/><ellipse cx="300" cy="380" rx="35" ry="60" fill="white" stroke="black" stroke-width="3"/><ellipse cx="220" cy="300" rx="35" ry="60" fill="white" stroke="black" stroke-width="3" transform="rotate(90 220 300)"/><circle cx="300" cy="300" r="20" fill="yellow" stroke="black" stroke-width="2"/><rect x="295" y="350" width="10" height="150" fill="white" stroke="black" stroke-width="3"/><ellipse cx="270" cy="450" rx="30" ry="15" fill="white" stroke="black" stroke-width="2"/><ellipse cx="330" cy="470" rx="30" ry="15" fill="white" stroke="black" stroke-width="2"/></g>'
            },
            {
                name: '🏠 Little House',
                svg: '<g><rect x="200" y="300" width="200" height="200" fill="white" stroke="black" stroke-width="3"/><polygon points="300,200 450,300 150,300" fill="white" stroke="black" stroke-width="3"/><rect x="260" y="380" width="60" height="120" fill="white" stroke="black" stroke-width="2"/><circle cx="290" cy="440" r="5" fill="black"/><rect x="340" y="340" width="40" height="40" fill="white" stroke="black" stroke-width="2"/><line x1="360" y1="340" x2="360" y2="380" stroke="black" stroke-width="2"/><line x1="340" y1="360" x2="380" y2="360" stroke="black" stroke-width="2"/></g>'
            },
            {
                name: '🐟 Fish',
                svg: '<g><ellipse cx="300" cy="300" rx="120" ry="80" fill="white" stroke="black" stroke-width="3"/><polygon points="420,300 500,250 500,350" fill="white" stroke="black" stroke-width="3"/><circle cx="250" cy="280" r="12" fill="white" stroke="black" stroke-width="2"/><circle cx="250" cy="280" r="5" fill="black"/><path d="M 320 270 Q 340 260 360 270" fill="none" stroke="black" stroke-width="2"/><path d="M 320 300 Q 340 310 360 300" fill="none" stroke="black" stroke-width="2"/></g>'
            }
        ];

        // Initialize coloring gallery
        function initColoringGallery() {
            const gallery = document.getElementById('coloringGallery');
            
            gallery.innerHTML = COLORING_PAGES.map((page, index) => `
                <div class="book-card" onclick="openColoringPage(${index})">
                    <div class="book-cover">
                        <i class="fas fa-palette" style="font-size: 4rem; color: #ffd700;"></i>
                    </div>
                    <div class="book-title">${page.name}</div>
                    <span class="book-type">🎨 COLOR ME!</span>
                </div>
            `).join('');
        }

        // Open a coloring page
        function openColoringPage(index) {
            currentColoringPage = index;
            const page = COLORING_PAGES[index];
            
            // Hide gallery, show canvas
            document.getElementById('coloringGallery').style.display = 'none';
            document.getElementById('coloringCanvas').style.display = 'block';
            
            // Load SVG
            const svg = document.getElementById('coloringSVG');
            svg.innerHTML = page.svg;
            
            // Add click handlers to all colorable elements
            const colorableElements = svg.querySelectorAll('circle, rect, ellipse, polygon, path[fill]');
            colorableElements.forEach(el => {
                // Skip black elements (outlines)
                if (el.getAttribute('fill') === 'black') return;
                
                el.style.cursor = 'pointer';
                el.addEventListener('click', function() {
                    this.setAttribute('fill', currentColor);
                });
            });
        }

        // Select color
        function selectColor(color) {
            currentColor = color;
            
            // Update button selection
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.closest('.color-btn').classList.add('selected');
        }

        // Clear coloring
        function clearColoring() {
            if (currentColoringPage === null) return;
            
            // Reload the page to reset
            openColoringPage(currentColoringPage);
        }

        // Back to gallery
        function backToGallery() {
            document.getElementById('coloringGallery').style.display = 'grid';
            document.getElementById('coloringCanvas').style.display = 'none';
            currentColoringPage = null;
        }

        // Initialize coloring gallery on load
        window.addEventListener('load', () => {
            initColoringGallery();
        });
    </script>

</body>
</html>
