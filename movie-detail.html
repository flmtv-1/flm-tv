<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Movie - FLM TV</title>
    <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
            color: #ffd700;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading {
            text-align: center;
        }
        
        .loading-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="loading">
        <img src="assets/logos/flm-logo.png" alt="FLM TV" class="loading-logo">
        <div class="spinner"></div>
        <p class="loading-text">Loading movie...</p>
    </div>

    <script>
        const JELLYFIN = {
            SERVER: 'https://flmtv26.duckdns.org:8920',
            SERVER_ID: 'db6bb6388c8c4c70825698639853ede6',
            API_KEY: '62131ee22c0141c6b651be75a7444350'
        };

        // Get movie ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (movieId) {
            // Redirect directly to Jellyfin detail page
            console.log('🎬 Redirecting to Jellyfin for movie:', movieId);
            window.location.href = `${JELLYFIN.SERVER}/web/index.html?api_key=${JELLYFIN.API_KEY}#!/details?id=${movieId}&serverId=${JELLYFIN.SERVER_ID}`;
        } else {
            // No movie ID - go back to home
            console.log('❌ No movie ID provided');
            document.querySelector('.loading-text').textContent = 'Error: No movie found';
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 2000);
        }
    </script>
</body>
</html>
