<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLM TV Channel 26.5 - LIVE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        /* SINGLE CUSTOM HEADER */
        .flm-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 2px solid #ff0000;
        }

        .flm-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .flm-logo h1 {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .back-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #00ccff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        /* LIVE STREAM CONTAINER */
        .stream-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stream-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* LOADING STATE */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }

        /* STREAM INFO OVERLAY */
        .stream-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #ff0000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stream-wrapper:hover .stream-info {
            opacity: 1;
        }

        .stream-info h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #00ff88;
        }

        .stream-info p {
            font-size: 14px;
            color: #ccc;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .flm-header {
                height: 50px;
                padding: 0 10px;
            }

            .flm-logo h1 {
                font-size: 16px;
            }

            .live-indicator {
                font-size: 12px;
            }

            .back-btn {
                padding: 8px 15px;
                font-size: 12px;
            }

            .stream-container {
                top: 50px;
            }

            .stream-info {
                bottom: 10px;
                left: 10px;
                padding: 10px 15px;
            }

            .stream-info h2 {
                font-size: 16px;
            }

            .stream-info p {
                font-size: 12px;
            }
        }

        /* OFFLINE MESSAGE */
        .offline-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }

        .offline-message.show {
            display: block;
        }

        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .offline-message h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ff0000;
        }

        .offline-message p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .schedule-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #00ff88;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .schedule-link:hover {
            background: #00ccff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- SINGLE CUSTOM HEADER -->
    <div class="flm-header">
        <div class="flm-logo">
            <h1>🎬 FLM TV</h1>
        </div>
        <div class="live-indicator">
            <div class="live-dot"></div>
            <span>CHANNEL 26.5 LIVE</span>
        </div>
        <button class="back-btn" onclick="goBack()">← Back to Browse</button>
    </div>

    <!-- LIVE STREAM -->
    <div class="stream-container">
        <div class="stream-wrapper">
            <!-- LOADING INDICATOR -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">Connecting to live stream...</div>
            </div>

            <!-- CASTR EMBED - Replace with your actual Castr embed URL -->
            <iframe 
                id="liveStream"
                src="YOUR_CASTR_EMBED_URL_HERE"
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                allowfullscreen
                onload="hideLoading()"
                style="display:none;">
            </iframe>

            <!-- STREAM INFO OVERLAY -->
            <div class="stream-info">
                <h2>📡 FLM Television Network</h2>
                <p>Broadcasting from Las Vegas, Nevada</p>
                <p>Serving Filipino communities worldwide</p>
            </div>

            <!-- OFFLINE MESSAGE (shown if stream unavailable) -->
            <div class="offline-message" id="offlineMessage">
                <div class="offline-icon">📺</div>
                <h2>Stream Currently Offline</h2>
                <p>We're not broadcasting right now.</p>
                <p>Check back soon for our next show!</p>
                <a href="#" class="schedule-link" onclick="goBack()">← View Schedule</a>
            </div>
        </div>
    </div>

    <script>
        // Hide loading spinner when stream loads
        function hideLoading() {
            const loading = document.getElementById('loading');
            const stream = document.getElementById('liveStream');
            
            loading.style.display = 'none';
            stream.style.display = 'block';
        }

        // Go back to browse
        function goBack() {
            window.history.back();
        }

        // Check if stream is online (optional)
        function checkStreamStatus() {
            // You can implement a ping to your streaming server
            // or Castr API to check if stream is active
            
            // For now, assume stream is always available
            // If you want to show offline message:
            // document.getElementById('offlineMessage').classList.add('show');
            // document.getElementById('loading').style.display = 'none';
        }

        // Error handling for iframe
        document.getElementById('liveStream').addEventListener('error', function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('offlineMessage').classList.add('show');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                goBack();
            }
        });

        // Initialize
        setTimeout(() => {
            // If loading takes too long, check connection
            if (document.getElementById('loading').style.display !== 'none') {
                console.log('Stream taking longer to load...');
            }
        }, 10000);
    </script>
</body>
</html>
