<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLM TV</title>
    <link rel="icon" type="image/png" href="assets/logos/flm-logo.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
        }
        
        /* VIDEO BACKGROUND - FULL IMAGE VISIBLE */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: url('assets/images/flmtv-AlienBanner1-1200x630.png');
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #0a0a0a;
        }
        
        /* Mobile - scale background to fit better */
        @media (max-width: 768px) {
            .video-bg {
                background-size: 100% auto;
            }
        }
        
        .video-bg video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1s ease;
        }
        
        /* Dark overlay for button visibility */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }
        
        /* CONTENT - BUTTON EVEN LOWER */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 20px 120px;
        }
        
        /* ENTER BUTTON - SMALLER */
        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            font-size: 22px;
            font-weight: 900;
            text-decoration: none;
            color: #000;
            background: linear-gradient(135deg, #fcd116 0%, #22c55e 100%);
            border-radius: 100px;
            box-shadow: 0 0 60px rgba(252, 209, 22, 0.8), 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .enter-btn:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 0 100px rgba(252, 209, 22, 1), 0 30px 80px rgba(0, 0, 0, 0.8);
        }
        
        /* FOOTER */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px; /* Reduced padding */
            z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
        }
        
        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            margin-bottom: 10px; /* Reduced margin */
        }
        
        .footer-links a {
            transition: transform 0.3s ease;
        }
        
        .footer-links a:hover {
            transform: translateY(-5px);
        }
        
        .footer-links img {
            height: 36px;
            width: auto;
        }
        
        .footer-info {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1.5px;
        }
        
        .footer-info strong {
            color: #fcd116;
        }
        
        /* MOBILE */
        @media (max-width: 768px) {
            .content {
                padding: 0;
                align-items: center;
                justify-content: center; /* Center the button in the middle of screen */
            }
            
            .enter-btn {
                padding: 12px 30px;
                font-size: 20px;
                margin-bottom: 550px; /* MAXIMUM height - push WAY up */
            }
            
            .footer {
                padding: 15px 20px; /* Smaller footer on mobile */
            }
            
            .footer-links {
                gap: 40px;
                margin-bottom: 8px;
            }
            
            .footer-links img {
                height: 28px;
            }
        }
        
        @media (max-width: 480px) {
            .content {
                padding: 0;
                align-items: center;
                justify-content: center;
            }
            
            .enter-btn {
                padding: 10px 28px;
                font-size: 18px;
                margin-bottom: 580px; /* MAXIMUM - as high as possible */
            }
            
            .footer {
                padding: 12px 15px;
            }
            
            .footer-links {
                gap: 30px;
                margin-bottom: 6px;
            }
            
            .footer-links img {
                height: 24px;
            }
        }
        
        /* MUTE/UNMUTE BUTTON - sits next to ENTER button */
        .mute-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 50%;
            color: #ffd700;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .mute-btn:hover, .mute-btn:focus {
            background: #ffd700;
            color: #000;
            transform: scale(1.1);
            outline: 4px solid #22c55e !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.8) !important;
        }

        /* Strong focus glow for remote navigation on both buttons */
        .enter-btn:focus {
            outline: 4px solid #22c55e !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.9) !important;
            animation: none !important;
        }

        /* Global focus glow for Firestick */
        :focus {
            outline: 4px solid #22c55e !important;
            outline-offset: 3px !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.7) !important;
        }

        @media (max-width: 768px) {
            .mute-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    
    <!-- VIDEO BACKGROUND -->
    <div class="video-bg">
        <video id="introVideo" autoplay muted playsinline>
            <!-- Video source is set by JavaScript -->
            <source id="videoSource" src="" type="video/mp4">
        </video>
    </div>
    
    <!-- Dark overlay -->
    <div class="overlay"></div>
    
    <!-- ENTER BUTTON + MUTE BUTTON side by side -->
    <div class="content">
        <div style="display:flex; align-items:center; gap:1rem;">
            <a class="enter-btn" href="home.html">
                <span>▶</span>
                <span>ENTER</span>
            </a>
            <button class="mute-btn" id="muteBtn" title="Unmute">
                <i class="fas fa-volume-mute"></i>
            </button>
        </div>
    </div>
    
    <!-- FOOTER -->
    <div class="footer">
        <div class="footer-links">
            <a href="https://7realmstv.com" target="_blank">
                <img src="assets/images/FLM logo symbol.png" alt="7RealmsTV">
            </a>
        </div>
        <div class="footer-info">
            <strong>Channel 26.5 Las Vegas</strong> • Film • Live • Music
        </div>
    </div>
    
    <!-- SCRIPT TO CHOOSE VIDEO BASED ON VISIT -->
    <script>
        // Check if user has visited before
        const hasVisited = localStorage.getItem('flmtv_visited');
        
        // Get video element
        const videoSource = document.getElementById('videoSource');
        const video = document.getElementById('introVideo');
        
        if (!hasVisited) {
            // FIRST VISIT - Show Blue Aliens video
            videoSource.src = 'assets/videos/FLM TV Tag Blue Aliens2.mp4';
            
            // Mark as visited for next time
            localStorage.setItem('flmtv_visited', 'true');
            
            console.log('🎬 First visit - Playing Blue Aliens intro');
        } else {
            // SECOND VISIT (and beyond) - Show Tag 4-1 video
            videoSource.src = 'assets/videos/Tag 4-1.mp4';
            
            console.log('🎬 Returning visitor - Playing Tag 4-1 intro');
        }
        
        // Load and play the video
        video.load();
        
        // HIDE VIDEO WHEN IT ENDS - SHOW BACKGROUND IMAGE!
        video.addEventListener('ended', function() {
            video.style.opacity = '0';
            console.log('✅ Video ended - Showing Alien Banner background');
        });
        
        // MUTE/UNMUTE BUTTON FUNCTIONALITY
        const muteBtn = document.getElementById('muteBtn');
        let isMuted = true; // Starts muted
        
        // Set video volume to maximum
        video.volume = 1.0;
        
        muteBtn.addEventListener('click', function() {
            isMuted = !isMuted;
            video.muted = isMuted;
            
            // Update button icon and title
            if (isMuted) {
                muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                muteBtn.title = 'Unmute';
                console.log('🔇 Video muted');
            } else {
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                muteBtn.title = 'Mute';
                console.log('🔊 Video unmuted - Volume at', video.volume);
            }
        });
    </script>

<script>
// Auto-focus ENTER button on load for Firestick remote
window.addEventListener('load', function() {
    var enterBtn = document.querySelector('.enter-btn');
    if (enterBtn) {
        enterBtn.focus();
    }
});

// D-pad navigation on intro page
document.addEventListener('keydown', function(e) {
    var focusable = Array.from(document.querySelectorAll('.enter-btn, .mute-btn')).filter(function(el) {
        return el.offsetParent !== null;
    });
    var focused = document.activeElement;
    var idx = focusable.indexOf(focused);

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        var next = focusable[idx + 1];
        if (next) next.focus();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        var prev = focusable[idx - 1];
        if (prev) prev.focus();
    } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (focused) focused.click();
    }
});
</script>
    
</body>
</html>
