<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Kids - FLM TV</title>
    
    <!-- PDF.js Library for reading PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            color: white;
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Navigation tabs */
        .nav-tabs {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }

        .tab-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            transform: scale(1.1);
        }

        /* Main content area */
        .content {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Header */
        .section-header {
            color: white;
            font-size: 2em;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* CARD GRID - Like your main streaming site */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .content-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .content-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .card-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            color: #333;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-subtitle {
            color: #666;
            font-size: 0.9em;
        }

        /* Audio Player */
        .audio-player {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .audio-player.active {
            display: block;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .player-cover {
            width: 200px;
            height: 200px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .player-info h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .player-info p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        audio {
            width: 100%;
            margin: 20px 0;
            border-radius: 15px;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Book Reader - ENHANCED FOR PDF */
        .book-reader {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .book-reader.active {
            display: block;
        }

        .book-container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* Book page canvas for PDF rendering */
        #bookCanvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
        }

        /* Text-based book pages */
        .book-page {
            padding: 60px;
            min-height: 600px;
        }

        .book-page img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
        }

        .book-page h2 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .book-page p {
            font-size: 1.3em;
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }

        .page-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 0 0 15px 15px;
        }

        .page-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .page-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-number {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 25px;
        }

        /* Loading animation */
        .loading {
            text-align: center;
            padding: 100px;
            color: white;
            font-size: 1.5em;
        }

        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Coming Soon */
        .coming-soon {
            text-align: center;
            padding: 100px 20px;
            color: white;
        }

        .coming-soon h2 {
            font-size: 3em;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Book loading indicator */
        .book-loading {
            text-align: center;
            padding: 100px;
            color: #666;
        }

        .book-loading.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .tab-btn {
                padding: 12px 25px;
                font-size: 1em;
            }

            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .player-header {
                flex-direction: column;
                text-align: center;
            }

            .book-page {
                padding: 30px;
            }

            .page-controls {
                padding: 20px;
            }

            .page-btn {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Animated stars -->
    <div class="stars" id="stars"></div>

    <!-- Header -->
    <div class="header">
        <h1>🌟 Epic Kids Zone 🌟</h1>
    </div>

    <!-- Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showSection('audiobooks')">📚 AUDIOBOOKS</button>
        <button class="tab-btn" onclick="showSection('textbooks')">📖 STORY BOOKS</button>
        <button class="tab-btn" onclick="showSection('games')">🎮 GAMES</button>
        <button class="tab-btn" onclick="showSection('puzzles')">🧩 PUZZLES</button>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Audiobooks Section -->
        <div id="audiobooks" class="content-section active">
            <div class="section-header">🎧 Choose an Audiobook!</div>
            
            <div class="loading" id="audiobooksLoading">
                <div class="spinner"></div>
                Loading audiobooks...
            </div>

            <div class="card-grid" id="audiobookGrid"></div>

            <!-- Audio Player -->
            <div class="audio-player" id="audioPlayer">
                <button class="back-btn" onclick="closeAudioPlayer()">← Back to Library</button>
                <div class="player-header">
                    <img id="playerCover" class="player-cover" src="" alt="Cover">
                    <div class="player-info">
                        <h2 id="playerTitle"></h2>
                        <p id="playerAuthor"></p>
                        <p id="playerDescription" style="font-size: 1em; margin-top: 15px;"></p>
                    </div>
                </div>
                <audio id="audioElement" controls>
                    <source id="audioSource" src="" type="audio/mpeg">
                </audio>
            </div>
        </div>

        <!-- Text Books Section -->
        <div id="textbooks" class="content-section">
            <div class="section-header">📚 Choose a Story Book!</div>
            
            <div class="loading" id="textbooksLoading">
                <div class="spinner"></div>
                Loading books...
            </div>

            <div class="card-grid" id="bookGrid"></div>

            <!-- Book Reader - ENHANCED WITH PDF SUPPORT -->
            <div class="book-reader" id="bookReader">
                <button class="back-btn" onclick="closeBookReader()">← Back to Library</button>
                
                <div class="book-container">
                    <!-- For PDF books -->
                    <div id="pdfContainer" style="display: none;">
                        <canvas id="bookCanvas"></canvas>
                    </div>
                    
                    <!-- For text/image books -->
                    <div id="textContainer" style="display: none;">
                        <div class="book-page" id="bookPage"></div>
                    </div>
                    
                    <!-- Loading indicator -->
                    <div class="book-loading" id="bookLoading">
                        <div class="spinner"></div>
                        <p>Loading book pages...</p>
                    </div>
                    
                    <!-- Page controls -->
                    <div class="page-controls">
                        <button class="page-btn" id="prevPage" onclick="previousPage()">← Previous</button>
                        <span class="page-number">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></span>
                        <button class="page-btn" id="nextPage" onclick="nextPage()">Next →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Games Section -->
        <div id="games" class="content-section">
            <div class="coming-soon">
                <h2>🎮 Fun Games Coming Soon!</h2>
                <p style="font-size: 1.5em;">We're building awesome games for you!</p>
            </div>
        </div>

        <!-- Puzzles Section -->
        <div id="puzzles" class="content-section">
            <div class="coming-soon">
                <h2>🧩 Cool Puzzles Coming Soon!</h2>
                <p style="font-size: 1.5em;">Get ready for brain-teasing fun!</p>
            </div>
        </div>
    </div>

    <!-- Load configuration from external file -->
    <script src="config.js"></script>
    
    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Use configuration from config.js file
        // If FLMTV_KIDS_CONFIG exists, use it. Otherwise use defaults.
        const KIDS_CONFIG = typeof FLMTV_KIDS_CONFIG !== 'undefined' ? FLMTV_KIDS_CONFIG : {
            SERVER_URL: 'http://192.168.68.108:8096',
            USERNAME: 'Public',
            PASSWORD: '',
            AUDIOBOOKS_LIBRARY_ID: '',
            TEXTBOOKS_LIBRARY_ID: ''
        };

        const CONFIG = {
            JELLYFIN_SERVER: KIDS_CONFIG.SERVER_URL,
            JELLYFIN_USER: KIDS_CONFIG.USERNAME,
            JELLYFIN_PASSWORD: KIDS_CONFIG.PASSWORD,
            AUDIOBOOKS_LIBRARY_ID: KIDS_CONFIG.AUDIOBOOKS_LIBRARY_ID,
            TEXTBOOKS_LIBRARY_ID: KIDS_CONFIG.TEXTBOOKS_LIBRARY_ID
        };

        // Create animated stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        createStars();

        // Navigation
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        // Global variables
        let jellyfinAuth = null;
        let audiobooks = [];
        let textbooks = [];
        let currentAudiobook = null;
        let currentBook = null;
        let currentPageIndex = 0;
        let pdfDoc = null;
        let pageRendering = false;

        // Authenticate with Jellyfin (hidden from user)
        async function authenticateJellyfin() {
            try {
                const response = await fetch(`${CONFIG.JELLYFIN_SERVER}/Users/authenticatebyname`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Emby-Authorization': 'MediaBrowser Client="FLM TV Kids", Device="Web", DeviceId="flmtv-kids", Version="1.0.0"'
                    },
                    body: JSON.stringify({
                        Username: CONFIG.JELLYFIN_USER,
                        Pw: CONFIG.JELLYFIN_PASSWORD
                    })
                });

                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const data = await response.json();
                jellyfinAuth = {
                    accessToken: data.AccessToken,
                    userId: data.User.Id
                };

                return true;
            } catch (error) {
                console.error('Authentication error:', error);
                return false;
            }
        }

        // Load audiobooks
        async function loadAudiobooks() {
            if (!CONFIG.AUDIOBOOKS_LIBRARY_ID) {
                console.warn('Audiobooks library ID not configured');
                document.getElementById('audiobooksLoading').innerHTML = '<p>Please configure your audiobooks library ID in config.js</p>';
                return;
            }

            document.getElementById('audiobooksLoading').style.display = 'block';

            try {
                if (!jellyfinAuth) {
                    await authenticateJellyfin();
                }

                const response = await fetch(
                    `${CONFIG.JELLYFIN_SERVER}/Users/${jellyfinAuth.userId}/Items?` +
                    `ParentId=${CONFIG.AUDIOBOOKS_LIBRARY_ID}&` +
                    `IncludeItemTypes=AudioBook&` +
                    `Recursive=true&` +
                    `Fields=Overview,People&` +
                    `api_key=${jellyfinAuth.accessToken}`
                );

                const data = await response.json();

                audiobooks = data.Items.map(item => ({
                    id: item.Id,
                    title: item.Name,
                    author: item.AlbumArtist || item.People?.find(p => p.Type === 'Author')?.Name || 'Unknown Author',
                    cover: `${CONFIG.JELLYFIN_SERVER}/Items/${item.Id}/Images/Primary?api_key=${jellyfinAuth.accessToken}`,
                    audioFile: `${CONFIG.JELLYFIN_SERVER}/Audio/${item.Id}/universal?UserId=${jellyfinAuth.userId}&DeviceId=flmtv-kids&api_key=${jellyfinAuth.accessToken}&Container=mp3`,
                    description: item.Overview || 'A wonderful story to listen to!'
                }));

                displayAudiobooks();
            } catch (error) {
                console.error('Error loading audiobooks:', error);
                document.getElementById('audiobooksLoading').innerHTML = '<p style="color: white;">Could not load audiobooks. Check console for details.</p>';
            }

            document.getElementById('audiobooksLoading').style.display = 'none';
        }

        // Display audiobooks as cards
        function displayAudiobooks() {
            const grid = document.getElementById('audiobookGrid');
            grid.innerHTML = '';

            if (audiobooks.length === 0) {
                grid.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1; font-size: 1.2em;">No audiobooks found!</p>';
                return;
            }

            audiobooks.forEach(book => {
                const card = document.createElement('div');
                card.className = 'content-card';
                card.onclick = () => playAudiobook(book);
                
                card.innerHTML = `
                    <img class="card-image" src="${book.cover}" alt="${book.title}" 
                         onerror="this.src='https://via.placeholder.com/200x280/667eea/ffffff?text=${encodeURIComponent(book.title)}'">
                    <div class="card-info">
                        <div class="card-title">${book.title}</div>
                        <div class="card-subtitle">${book.author}</div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Play audiobook
        function playAudiobook(book) {
            currentAudiobook = book;
            document.getElementById('playerCover').src = book.cover;
            document.getElementById('playerTitle').textContent = book.title;
            document.getElementById('playerAuthor').textContent = 'by ' + book.author;
            document.getElementById('playerDescription').textContent = book.description;
            document.getElementById('audioSource').src = book.audioFile;
            document.getElementById('audioElement').load();
            
            document.getElementById('audioPlayer').classList.add('active');
            document.getElementById('audiobookGrid').style.display = 'none';
        }

        // Close audio player
        function closeAudioPlayer() {
            document.getElementById('audioPlayer').classList.remove('active');
            document.getElementById('audiobookGrid').style.display = 'grid';
            document.getElementById('audioElement').pause();
        }

        // Load textbooks with PDF support
        async function loadTextbooks() {
            if (!CONFIG.TEXTBOOKS_LIBRARY_ID) {
                console.warn('Textbooks library ID not configured');
                document.getElementById('textbooksLoading').innerHTML = '<p>Please configure your textbooks library ID in config.js</p>';
                return;
            }

            document.getElementById('textbooksLoading').style.display = 'block';

            try {
                if (!jellyfinAuth) {
                    await authenticateJellyfin();
                }

                const response = await fetch(
                    `${CONFIG.JELLYFIN_SERVER}/Users/${jellyfinAuth.userId}/Items?` +
                    `ParentId=${CONFIG.TEXTBOOKS_LIBRARY_ID}&` +
                    `IncludeItemTypes=Book&` +
                    `Recursive=true&` +
                    `Fields=Overview,People,Path,MediaSources&` +
                    `api_key=${jellyfinAuth.accessToken}`
                );

                const data = await response.json();

                textbooks = data.Items.map(item => ({
                    id: item.Id,
                    title: item.Name,
                    author: item.People?.find(p => p.Type === 'Author')?.Name || 'Unknown',
                    cover: `${CONFIG.JELLYFIN_SERVER}/Items/${item.Id}/Images/Primary?api_key=${jellyfinAuth.accessToken}`,
                    description: item.Overview || 'A wonderful story to read!',
                    // Check if it's a PDF
                    isPDF: item.Path?.toLowerCase().endsWith('.pdf'),
                    // URL to download/view the file
                    fileUrl: `${CONFIG.JELLYFIN_SERVER}/Items/${item.Id}/Download?api_key=${jellyfinAuth.accessToken}`
                }));

                displayTextbooks();
            } catch (error) {
                console.error('Error loading textbooks:', error);
                document.getElementById('textbooksLoading').innerHTML = '<p style="color: white;">Could not load books. Check console for details.</p>';
            }

            document.getElementById('textbooksLoading').style.display = 'none';
        }

        // Display textbooks as cards
        function displayTextbooks() {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            if (textbooks.length === 0) {
                grid.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1; font-size: 1.2em;">No books found!</p>';
                return;
            }

            textbooks.forEach(book => {
                const card = document.createElement('div');
                card.className = 'content-card';
                card.onclick = () => openBook(book);
                
                card.innerHTML = `
                    <img class="card-image" src="${book.cover}" alt="${book.title}"
                         onerror="this.src='https://via.placeholder.com/200x280/f093fb/ffffff?text=${encodeURIComponent(book.title)}'">
                    <div class="card-info">
                        <div class="card-title">${book.title}</div>
                        <div class="card-subtitle">${book.author}</div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Open book with PDF support
        async function openBook(book) {
            currentBook = book;
            currentPageIndex = 1; // PDFs are 1-indexed
            
            document.getElementById('bookReader').classList.add('active');
            document.getElementById('bookGrid').style.display = 'none';
            document.getElementById('bookLoading').classList.remove('hidden');

            if (book.isPDF) {
                // Load PDF
                await loadPDFBook(book.fileUrl);
            } else {
                // Show text-based book (placeholder)
                loadTextBook(book);
            }
        }

        // Load PDF book and render pages
        async function loadPDFBook(url) {
            try {
                // Show PDF container, hide text container
                document.getElementById('pdfContainer').style.display = 'block';
                document.getElementById('textContainer').style.display = 'none';

                // Load PDF
                const loadingTask = pdfjsLib.getDocument(url);
                pdfDoc = await loadingTask.promise;

                document.getElementById('totalPages').textContent = pdfDoc.numPages;
                document.getElementById('bookLoading').classList.add('hidden');

                // Render first page
                renderPDFPage(currentPageIndex);
            } catch (error) {
                console.error('Error loading PDF:', error);
                document.getElementById('bookLoading').innerHTML = '<p style="color: red;">Could not load PDF book</p>';
            }
        }

        // Render a single PDF page
        async function renderPDFPage(pageNum) {
            if (pageRendering) return;
            pageRendering = true;

            try {
                const page = await pdfDoc.getPage(pageNum);
                const canvas = document.getElementById('bookCanvas');
                const ctx = canvas.getContext('2d');

                // Calculate scale to fit container
                const container = document.querySelector('.book-container');
                const containerWidth = container.offsetWidth - 80; // Account for padding
                const viewport = page.getViewport({ scale: 1 });
                const scale = containerWidth / viewport.width;
                const scaledViewport = page.getViewport({ scale: scale });

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: scaledViewport
                };

                await page.render(renderContext).promise;
                
                // Update page number display
                document.getElementById('currentPage').textContent = pageNum;
                
                // Update button states
                document.getElementById('prevPage').disabled = pageNum <= 1;
                document.getElementById('nextPage').disabled = pageNum >= pdfDoc.numPages;

                pageRendering = false;
            } catch (error) {
                console.error('Error rendering page:', error);
                pageRendering = false;
            }
        }

        // Load text-based book (non-PDF)
        function loadTextBook(book) {
            // Show text container, hide PDF container
            document.getElementById('textContainer').style.display = 'block';
            document.getElementById('pdfContainer').style.display = 'none';
            document.getElementById('bookLoading').classList.add('hidden');

            // Create simple text pages
            const bookPage = document.getElementById('bookPage');
            bookPage.innerHTML = `
                <h2>${book.title}</h2>
                <p style="font-size: 1.2em; color: #666;">by ${book.author}</p>
                <img src="${book.cover}" style="max-width: 300px; margin: 30px auto; display: block;">
                <p>${book.description}</p>
                <p style="margin-top: 30px; font-style: italic; color: #888;">
                    This book is available in your library! To read the full story, 
                    make sure it's in PDF format in your Jellyfin Books library.
                </p>
            `;

            document.getElementById('currentPage').textContent = '1';
            document.getElementById('totalPages').textContent = '1';
            document.getElementById('prevPage').disabled = true;
            document.getElementById('nextPage').disabled = true;
        }

        // Page navigation
        function nextPage() {
            if (currentBook && currentBook.isPDF && pdfDoc) {
                if (currentPageIndex < pdfDoc.numPages) {
                    currentPageIndex++;
                    renderPDFPage(currentPageIndex);
                }
            }
        }

        function previousPage() {
            if (currentBook && currentBook.isPDF && pdfDoc) {
                if (currentPageIndex > 1) {
                    currentPageIndex--;
                    renderPDFPage(currentPageIndex);
                }
            }
        }

        // Close book
        function closeBookReader() {
            document.getElementById('bookReader').classList.remove('active');
            document.getElementById('bookGrid').style.display = 'grid';
            currentBook = null;
            currentPageIndex = 0;
            pdfDoc = null;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('bookReader').classList.contains('active')) {
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === 'ArrowLeft') previousPage();
                if (e.key === 'Escape') closeBookReader();
            }
        });

        // Auto-load content on page load
        window.addEventListener('load', async () => {
            await loadAudiobooks();
            await loadTextbooks();
        });
    </script>
</body>
</html>
