<meta charset="UTF-8">

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:#7A6330;--red:#C0272D;--red-bright:#E8333A;--black:#070709;--dark:#0E0E13;--dark2:#14141A;--dark3:#1C1C24;--dark4:#26262F;--text:#F0EDE8;--text-dim:#888898;--text-muted:#444450;--live-green:#00E676;--ad-blue:#4A9EFF;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.012) 3px,rgba(0,0,0,0.012) 4px);pointer-events:none;z-index:999;}
.topnav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(7,7,9,0.97);border-bottom:1px solid rgba(201,168,76,0.2);backdrop-filter:blur(12px);}

.nav-logo span{color:var(--red);}

.live-pill{display:flex;align-items:center;gap:7px;background:var(--red);color:#fff;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;padding:7px 16px;border-radius:2px;transition:background 0.2s;}

.live-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite;}

.hero{position:relative;overflow:hidden;padding:48px 32px 36px;background:linear-gradient(180deg,rgba(192,39,45,0.07) 0%,transparent 100%);text-align:center;}

.live-badge{display:inline-flex;align-items:center;gap:6px;background:var(--live-green);color:#000;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;padding:2px 8px;border-radius:2px;margin-top:6px;}
.live-badge-dot{width:5px;height:5px;border-radius:50%;background:#000;animation:blink 1s infinite;}
.watch-now-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--live-green);color:#000;font-weight:800;font-size:12px;letter-spacing:1px;padding:6px 16px;border-radius:4px;text-decoration:none;transition:all 0.2s;}
.watch-now-btn:hover{background:#fff;color:#000;}
.progress-bar-wrap{grid-column:1/-1;height:3px;background:rgba(0,230,118,0.1);}
.progress-bar-fill{height:100%;background:var(--live-green);transition:width 1s linear;}
.show-card.ad-card .show-time,.show-card.ad-card .show-info,.show-card.ad-card .show-dur{background:rgba(74,158,255,0.03);}
.show-card.ad-card .show-name{color:var(--ad-blue);font-size:13px;font-weight:500;}
.show-card.ad-card .show-time-start{color:var(--ad-blue);font-size:11px;}
.show-card.ad-card.aired{opacity:1;}
.show-card.flm-card .show-name{color:var(--gold);}
.show-card.flm-card .show-time,.show-card.flm-card .show-info,.show-card.flm-card .show-dur{background:rgba(201,168,76,0.03);}
.movie-badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--gold);border:1px solid rgba(201,168,76,0.3);padding:1px 6px;border-radius:2px;margin-left:8px;vertical-align:middle;}

@media(max-width:640px){

<script>
// ── SCHEDULE ENGINE ───────────────────────────────────────────────
// Reads FLM-TV-Schedule.json from the same folder.
// Chains all shows continuously — no midnight resets.
// Shows date separators when the broadcast day rolls over.
// Just replace FLM-TV-Schedule.json to update the schedule.

let SCHEDULE = []; // populated after JSON fetch
let _chain = null;
let showPHTime = false;

// Current UTC offset for Las Vegas (handles PDT/PST automatically); falls back to -7 (PDT)
function getLVOffsetHours() {
  try {
    const fmt = new Intl.DateTimeFormat('en-US', {timeZone:'America/Los_Angeles', timeZoneName:'shortOffset'});
    const part = fmt.formatToParts(new Date()).find(p => p.type === 'timeZoneName').value;
    const m = part.match(/GMT([+-]\d+)/);
    return m ? parseInt(m[1], 10) : -7;
  } catch (e) { return -7; }
}
const PH_OFFSET = 8; // Philippines is always UTC+8, no DST

// Build a continuous chain from the first show's anchor date+time.
// Anchored as an absolute UTC instant representing Las Vegas time, so every
// viewer worldwide sees the correct show marked LIVE regardless of their own device clock/timezone.
function buildChain() {
  if (!SCHEDULE.length) return [];
  const chain = [];
  const first = SCHEDULE[0];
  const anchorDate = first.date || new Date().toISOString().split('T')[0];
  const timeStr = first.startTime || first.t || '00:00';
  const [fh, fm] = timeStr.split(':').map(Number);
  const [ay, am, ad] = anchorDate.split('-').map(Number);
  const lvOffset = getLVOffsetHours();
  let cursor = new Date(Date.UTC(ay, am - 1, ad, fh - lvOffset, fm, 0));
  for (let i = 0; i < SCHEDULE.length; i++) {
    const s = SCHEDULE[i];
    const start = new Date(cursor.getTime());
    const dur = Math.round((s.outPoint || s.duration || s.d || 0) - (s.inPoint || 0));
    const end = new Date(cursor.getTime() + dur * 1000);
    chain.push({ s, start, end, dur });
    cursor = end;
  }
  return chain;
}

function getChain() {
  if (!_chain) _chain = buildChain();
  return _chain;
}

function getStatus(entry) {
  const now = new Date();
  if (now >= entry.start && now < entry.end) return 'live';
  if (now >= entry.end) return 'aired';
  return 'upcoming';
}

function getProgress(entry) {
  const now = new Date();
  return Math.min(100, Math.max(0, (now - entry.start) / (entry.end - entry.start) * 100));
}

function fmt12(date) {
  const offset = showPHTime ? PH_OFFSET : getLVOffsetHours();
  const shifted = new Date(date.getTime() + offset * 3600000);
  let h = shifted.getUTCHours(), m = shifted.getUTCMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}

function fmtDur(sec) {
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), h = Math.floor(m / 60);
  if (h > 0) return h + 'h ' + (m % 60 > 0 ? m % 60 + 'm' : '');
  return m + ' min';
}

function fmtDateLong(date) {
  return date.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'}).toUpperCase();
}

// ── RENDER ────────────────────────────────────────────────────────
function renderSchedule() {
  _chain = null;
  const wrap = document.getElementById('scheduleWrap');
  wrap.innerHTML = '';

  const chain = getChain();
  if (!chain.length) {
    wrap.innerHTML = '<div class="error-msg">No schedule loaded. Place FLM-TV-Schedule.json in the same folder.</div>';
    return;
  }

  // Stats
  const shows = chain.filter(e => e.s.category !== 'commercial' && e.s.category !== 'ad');
  document.getElementById('statTotal').textContent = shows.length;
  document.getElementById('statHours').textContent = (shows.reduce((t,e) => t + e.dur, 0) / 3600).toFixed(1);

  // Find live show
  const liveEntry = chain.find(e => getStatus(e) === 'live') || null;

  let lastDateStr = '';

  chain.forEach(entry => {
    const { s, start, end, dur } = entry;
    const status = getStatus(entry);
    const isLive = liveEntry && entry === liveEntry;
    const isAired = !isLive && status === 'aired';
    const cat = ((s.category || s.cat) || '').toLowerCase();
    const isAd = cat === 'commercial' || cat === 'ad' || cat === 'promo';
    const isMovie = cat === 'movie';
    const isKids = cat === 'kids';
    const isFlm = cat === 'flm';

    // Date separator when calendar date changes
    const dateStr = start.getFullYear() + '-' + start.getMonth() + '-' + start.getDate();
    if (dateStr !== lastDateStr) {
      lastDateStr = dateStr;
      wrap.insertAdjacentHTML('beforeend', `
        <div class="date-separator">
          <div class="date-separator-label">${fmtDateLong(start)}</div>
          <div class="date-separator-line"></div>
        </div>`);
    }

    const cardClass = [
      'show-card',
      isLive ? 'live-now' : (isAired ? 'aired' : 'upcoming'),
      isAd ? 'ad-card' : '',
      isFlm ? 'flm-card' : ''
    ].filter(Boolean).join(' ');

    const filterData = [
      (!isAd && !isMovie && !isKids && !isFlm) ? 'shows' : '',
      isMovie ? 'movies' : '',
      isKids ? 'kids' : '',
      isFlm ? 'flm' : '',
      status === 'upcoming' ? 'upcoming' : ''
    ].filter(Boolean).join(' ');

    const pct = isLive ? getProgress(entry) : 0;
    const liveId = isLive ? 'id="live-now-card"' : '';

    wrap.insertAdjacentHTML('beforeend', `
      <div class="${cardClass}" ${liveId} data-filter="${filterData}" tabindex="0">
        <div class="show-time">
          <div class="show-time-start">${fmt12(start)}</div>
          <div class="show-time-end">${fmt12(end)}</div>
        </div>
        <div class="show-info">
          <div class="show-name">${s.name||s.n}${isMovie ? '<span class="movie-badge">MOVIE</span>' : ''}</div>
          ${isLive ? `<div class="live-badge"><span class="live-badge-dot"></span> ON AIR NOW</div>` : ''}
          ${isKids ? `<div class="show-meta">KIDS</div>` : ''}
          ${isFlm ? `<div class="show-meta">★ FLM ORIGINAL</div>` : ''}
          ${isLive ? `<a href="live.html" class="watch-now-btn">▶ Watch Now</a>` : ''}
        </div>
        <div class="show-dur">${fmtDur(dur)}</div>
        ${isLive ? `<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:${pct}%"></div></div>` : ''}
      </div>`);
  });
}

function togglePHTime() {
  showPHTime = !showPHTime;
  const btn = document.getElementById('phToggleBtn');
  if (btn) {
    btn.textContent = showPHTime ? '🇺🇸 Vegas Time' : '🇵🇭 PH Time';
    btn.classList.toggle('active-ph', showPHTime);
  }
  renderSchedule();
}

function jumpToNow() {
  const el = document.getElementById('live-now-card');
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.style.boxShadow = '0 0 0 3px #00E676,0 0 40px rgba(0,230,118,0.35)';
  setTimeout(() => { el.style.boxShadow = ''; }, 900);
}

function filterSchedule(cat, btn) {
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.show-card').forEach(card => {
    const tags = card.dataset.filter || '';
    let show = false;
    if (cat === 'all') show = true;
    else if (cat === 'shows') show = tags.includes('shows');
    else if (cat === 'movies') show = tags.includes('movies');
    else if (cat === 'kids') show = tags.includes('kids');
    else if (cat === 'flm') show = tags.includes('flm');
    else if (cat === 'upcoming') show = tags.includes('upcoming');
    card.classList.toggle('hidden', !show);
  });
}

function updateClock() {
  const d = new Date();
  const offset = showPHTime ? PH_OFFSET : getLVOffsetHours();
  const shifted = new Date(d.getTime() + offset * 3600000);
  const h = shifted.getUTCHours() % 12 || 12, m = String(shifted.getUTCMinutes()).padStart(2,'0'), s = String(shifted.getUTCSeconds()).padStart(2,'0');
  const el = document.getElementById('clockDisplay');
  if (el) el.textContent = `${h}:${m}:${s} ${shifted.getUTCHours() >= 12 ? 'PM' : 'AM'} ${showPHTime ? 'PHT' : 'PT'}`;
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  if (!fill) return;
  const chain = getChain();
  const live = chain.find(e => getStatus(e) === 'live');
  if (live) fill.style.width = getProgress(live) + '%';
}

// ── TODAY'S SCHEDULE ──────────────────────────────────────────────
// Updated: 2026-08-20 11:18
const TODAY_SCHEDULE = [
  {t:"03:32",n:"Close Encounters of the 5th Kind ",d:7236,cat:"movie",date:"2026-08-20"},
  {t:"05:33",n:"Close Encounters Of The Third Kind ",d:8085,cat:"movie",date:"2026-08-20"},
  {t:"07:48",n:"Sesame Street ",d:1556,cat:"",date:"2026-08-20"},
  {t:"08:14",n:"Sesame Street 2",d:1556,cat:"",date:"2026-08-20"},
  {t:"08:40",n:"Super Why! ",d:1620,cat:"",date:"2026-08-20"},
  {t:"09:07",n:"Ready Jet Go ",d:1591,cat:"",date:"2026-08-20"},

// ── LOAD JSON & INIT ─────────────────────────────────────────────
// Tries to fetch FLM-TV-Schedule.json first.
// If not found, falls back to TODAY_SCHEDULE array above.
// The bat file / update_schedule.py injects into TODAY_SCHEDULE.
// Either workflow works — JSON fetch OR bat file injection.

async function loadSchedule() {
  // Use TODAY_SCHEDULE array first (injected by bat file)
  // Only fetch JSON if the array is empty
  if (TODAY_SCHEDULE && TODAY_SCHEDULE.length > 0) {
    SCHEDULE = TODAY_SCHEDULE.map(s => ({
      name: s.n, startTime: s.t, duration: s.d,
      category: s.cat, date: s.date || ''
    }));
    renderSchedule();
    jumpToNow();
    return;
  }
  // Fallback: try to fetch FLM-TV-Schedule.json
  try {
    const res = await fetch('FLM-TV-Schedule.json?v=' + Date.now());
    if (!res.ok) throw new Error('File not found');
    const data = await res.json();
    const dateKey = Object.keys(data)[0];
    const shows = data[dateKey];
    SCHEDULE = shows.map(s => ({ ...s, date: s.date || dateKey }));
  } catch (e) {
    document.getElementById('scheduleWrap').innerHTML =
      '<div class="error-msg">⚠ No schedule found. Run the bat file to update.</div>';
    return;
  }
  renderSchedule();
  jumpToNow();
}

document.getElementById('heroDate').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }).toUpperCase();

updateClock();
setInterval(updateClock, 1000);
setInterval(updateProgress, 10000);
loadSchedule();
</script>

<script>
(function(){
  var ua=navigator.userAgent||'';
  if(!/AFT|FireTV|Silk/i.test(ua))return;
  var vp=document.querySelector('meta[name="viewport"]');
  if(vp)vp.setAttribute('content','width=960,initial-scale=1.0,maximum-scale=1.0,user-scalable=no');
  var style=document.createElement('style');
  style.textContent=`.show-card:focus,.ftab:focus,.jump-btn:focus,.nav-logo:focus,a:focus{outline:4px solid #ffd700!important;box-shadow:0 0 20px rgba(255,215,0,0.5)!important;z-index:10;position:relative;}#live-now-card:focus{outline:4px solid #00E676!important;}`;
  document.head.appendChild(style);
  function getFocusable(){return Array.from(document.querySelectorAll('.show-card:not(.hidden),.ftab,.jump-btn,.nav-logo,a.live-pill')).filter(el=>el.offsetParent!==null);}
  function findBest(cur,all,dir){var cr=cur.getBoundingClientRect(),cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;var cands=all.filter(el=>{if(el===cur)return false;var r=el.getBoundingClientRect(),ex=r.left+r.width/2,ey=r.top+r.height/2;if(dir==='right')return ex>cr.right-10;if(dir==='left')return ex<cr.left+10;if(dir==='down')return ey>cr.bottom-10;if(dir==='up')return ey<cr.top+10;});if(!cands.length)return null;var best=null,bs=Infinity;cands.forEach(el=>{var r=el.getBoundingClientRect(),dx=(r.left+r.width/2)-cx,dy=(r.top+r.height/2)-cy,p=(dir==='right'||dir==='left')?Math.abs(dx):Math.abs(dy),s=(dir==='right'||dir==='left')?Math.abs(dy):Math.abs(dx),score=p+s*0.3;if(score<bs){bs=score;best=el;}});return best;}
  document.addEventListener('keydown',function(e){var all=getFocusable();if(!all.length)return;var focused=document.activeElement,inList=all.indexOf(focused)>=0;if(!inList){if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Enter'].includes(e.key)){e.preventDefault();var lc=document.getElementById('live-now-card');if(lc){lc.focus();lc.scrollIntoView({block:'center'});}else{all[0].focus();}}return;}var dir={ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'}[e.key];if(dir){e.preventDefault();var next=findBest(focused,all,dir);if(next){next.focus();next.scrollIntoView({behavior:'smooth',block:'center'});}else if(dir==='up'){window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{all[0].focus();},400);}}if(e.key==='Backspace'||e.key==='Escape'){e.preventDefault();window.location.href='home.html';}},true);
})();
</script>
